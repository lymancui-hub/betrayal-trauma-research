的协变模型进一步提出，可综合三个维度的信息判断某效果与什么因素一起变化。<\/p><h4>三个问题<\/h4><p>共同性或共识性：别人面对同一对象是否也这样；区别性或特异性：这个人面对其他对象是否也这样；一致性：这个人在不同时间面对同一对象是否总是这样。高共同、高区别、高一致，较支持对象因素；低共同、低区别、高一致，较支持个人因素；一致性低时，应更多考虑当次特殊情境。<\/p><h4>案例应用与限制<\/h4><p>某人说“大家都这么做，是环境所迫”，只能算其归因陈述。应核查别人是否确实如此、他在其他环境是否如此、同一环境下是否反复如此，不能仅凭辩解确认外因。要帮助其调整归因，应增加可比较的事实，检验替代解释并澄清个人选择。折扣原则是当另有合理原因时，减弱对某一原因的归因；不是只要提出借口就取消责任。人格理论的George Kelly与此处Kelley不同。<\/p><h4 id=\"case-kelley-202511\">归因案例：区分原因陈述与协变证据<\/h4><p>如果刘某把行为解释为“大家都这样”“环境所迫”，这些陈述体现了强调外部原因的倾向；仅凭这些话，不能断言共同性、区别性和一致性已经满足，因为还缺少其他人的行为、不同对象或环境的比较以及跨时点证据。若要检验：查同处境其他人是否同样行为；查刘某在其他关系或环境是否如此；查他面对相同情境是否反复如此。以证据展示仍存在合法、不同的选择，才能有根据地讨论其改变归因的条件。心理归因不代替对行为事实和责任的独立认定。<\/p>","recall":[{"q":"共同性、区别性、一致性各比较谁或什么？","a":"共同性比较不同人对同一对象；区别性比较同一人对不同对象；一致性比较同一人同一对象在不同时间或情境。"}],"syllabus_topic":2},{"id":"c412-17","title":"韦纳三维归因：成绩案例与动机干预","outline":"专题二：社会心理学","level":"运用","keywords":["韦纳","原因部位","稳定性","可控性","努力","能力"],"body_html":"<p>韦纳把成败归因按原因部位、稳定性和可控性分析。原因部位问在个体内部还是外部；稳定性问跨时间是否较稳定；可控性问个体能否通过行动改变。三个维度彼此独立，内部原因不必然可控，外部原因也不必然完全不可改变。<\/p><table><thead><tr><th>常见原因<\/th><th>部位<\/th><th>通常稳定性<\/th><th>通常可控性<\/th><\/tr><\/thead><tbody><tr><td>能力（传统分类）<\/td><td>内部<\/td><td>较稳定<\/td><td>短期较不可控<\/td><\/tr><tr><td>当次努力<\/td><td>内部<\/td><td>可变化<\/td><td>较可控<\/td><\/tr><tr><td>任务难度<\/td><td>外部<\/td><td>同类任务下较稳定<\/td><td>考生通常不可控<\/td><\/tr><tr><td>运气<\/td><td>外部<\/td><td>不稳定<\/td><td>通常不可控<\/td><\/tr><\/tbody><\/table><h4>情绪、期待与教学<\/h4><p>部位会影响自尊等自我评价，稳定性影响未来期待，可控性影响责任判断及内疚、愤怒等情绪。身体不适需单独分析其原因和持续性，不应直接写成运气。帮助考差学生时，核对真正困难，转向可改进的策略、复习安排与求助，建立具体行动；不能无视资源或健康限制，简单责备“你不努力”。表中的分类是传统例子，实际题目需结合情境。<\/p><h4 id=\"case-weiner-202506\">成绩归因案例：逐项分析与指导<\/h4><p>小明归于努力和能力，应分别编码而非合成一个原因；前者通常可变且较可控，后者在经典分类中较稳定、短期较不可控。小红归于难度和运气，应区分相对稳定的任务条件与不稳定偶然因素；身体不适不能直接等同于运气：身体状态通常是内部原因，持续性和可控性还要看具体病因。成绩归于固定困难可能降低期待，归于偶然因素未必如此，不能直接预言一定放弃。教师应了解学习策略、复习量与身体状态，制定可达成的小目标，提供反馈与必要支持，再检验改进效果。<\/p>","recall":[{"q":"内部归因是否一定可控？","a":"不是。传统分类中的能力是内部、相对稳定、短期较不可控；当次努力通常内部、可变化、较可控。"}],"syllabus_topic":2},{"id":"c412-18","title":"基本归因偏差与自利归因：避免只看人、不看情境","outline":"专题二：社会心理学","level":"掌握","keywords":["基本归因错误","自利性偏差","行动者观察者","情境"],"body_html":"<p>基本归因错误通常指解释他人行为时，过分强调人格、意图等内部原因，低估情境约束的倾向。例如看到同学迟到，立即认为其不负责任，却未了解临时交通中断。它是判断倾向，不意味着人格永远无关或外部原因总是真的。<\/p><h4>相关概念辨析<\/h4><p>自利归因指倾向把成功归于自己的能力和努力，把失败归于外部条件，以维护积极自我评价。行动者与观察者掌握的信息、注意焦点不同，也可能产生解释差异，但不能把它当成任何情境都成立的绝对规律。基本归因偏差主要比较对他人的内部、外部解释，自利偏差主要看解释是否有利于自我。<\/p><h4>为何发生、怎样改进<\/h4><p>行动者通常更显眼，情境信息却容易被忽略；时间紧、负荷大和既有印象可能增加简单判断。可先列已知事实，补充行为发生的条件，再比较此人其他情境以及别人同情境的行为。论述时用“偏差定义—表现例子—信息和动机机制—后果—校正方法”结构。公平归因不是替人找借口，而是在真实情境和个人行动之间作有证据的判断。<\/p>","recall":[{"q":"基本归因错误与自利偏差有何不同？","a":"前者着重对他人行为高估内部原因、低估情境；后者着重使成败解释有利于维护自我评价。"}],"syllabus_topic":2},{"id":"c412-19","title":"社会态度：三成分、形成与行为预测","outline":"专题二：社会心理学","level":"掌握","keywords":["态度","认知情感行为","态度形成","态度行为关系"],"body_html":"<p>态度是个体对一定对象相对持久的评价倾向，可包含认知、情感和行为倾向三个成分。认知是对对象的信念，情感是喜欢或厌恶等感受，行为倾向是准备如何行动；行为倾向不是实际行为，两者不能直接画等号。<\/p><h4>态度怎样形成<\/h4><p>直接经验、条件作用、观察榜样、媒体信息和群体规范都可能起作用。态度还可能服务于获得利益、表达价值、组织知识或保护自我等功能。例如喜欢合作学习，可能既因效率高，也因重视互助与归属。<\/p><h4>为何“想法”与“做法”不同<\/h4><p>实际行为同时受资源、情境压力、习惯、规范和可控性影响。越具体、越有直接经验、越容易被提取且越贴合行为对象和时间的态度，通常越有利于预测行为。一个人支持节约资源，却因缺少可行工具未付诸行动，不能直接说其态度虚假。答题可写“定义与成分—形成途径—功能—预测条件—实例”。改变行为时既提供理由，也要减少现实障碍，例如把学习目标变成可执行的固定时间安排。<\/p>","recall":[{"q":"态度的行为成分是不是实际行为？","a":"主要指行为倾向或意向，实际行为还受情境、机会、能力和社会规范等影响。"}],"syllabus_topic":2},{"id":"c412-20","title":"认知失调：形成条件与减少方式","outline":"专题二：社会心理学","level":"运用","keywords":["费斯廷格","认知失调","态度改变","行为改变","理由不足"],"body_html":"<p>费斯廷格的认知失调理论认为，个体觉察到重要认知之间、或态度与自身行为之间不协调时，可能产生不舒适并被推动去降低失调。它不仅是“有两种观点”，还涉及这些认知被体验为不相容且与自己有关。<\/p><h4>减少失调的途径<\/h4><p>改变行为，如认同认真复习却长期拖延，于是开始执行计划；改变相关认知，如承认原先学习方法不合适；增加协调性认知，如强调拖延还有其他原因；降低冲突认知的重要性，或回避不一致信息。后一类方式有时只减轻感受，并未解决实际问题。自愿选择、责任感、重要性及外部理由是否充足都会影响失调。<\/p><h4>案例与考试应用<\/h4><p>学生付出较大努力才加入某小组，可能更重视该小组，可用努力合理化讨论；做出难以撤回的选择后提高对所选方案评价，可用决策后失调讨论。不能把任何态度变化都归为认知失调，也不要把合理解释一概视为自欺。答题用“原有认知—实际行为或新事实—冲突—不适—降低方式—效果评价”六步，比只列三个策略更能显示理论运用。<\/p>","recall":[{"q":"减少失调是否一定带来更正确的行为？","a":"不一定。可以通过真正改变行为，也可能通过合理化、降低重要性或回避信息暂时减轻不适。"}],"syllabus_topic":2},{"id":"c412-21","title":"说服与态度改变：双路径和传播因素","outline":"专题二：社会心理学","level":"运用","keywords":["说服","精细加工可能性模型","中心路径","外围路径","凯尔曼"],"body_html":"<p>说服是通过信息沟通影响态度的过程。可从传播者、信息、接受者与情境四方面分析：传播者是否可信，论据是否有质量，接受者是否关心且有能力加工，环境是否允许专注。不能简单说“名人说的一定有效”。<\/p><h4>中心与外围路径<\/h4><p>佩蒂与卡乔波的精细加工可能性模型认为，当动机和能力较高时，人更可能认真分析论据，通过中心路径改变；当精细加工较低时，更可能依赖吸引力、数量感或熟悉感等外围线索。中心加工形成的态度通常更持久、更能抵抗反驳，但两种路径不是按人永久分类，线索在不同条件下也可承担不同作用。<\/p><h4>营销案例与稳定改变<\/h4><p>宣传课程时，对准备认真选择的同学提供课程内容、证据和限制；对初次了解者用清晰易读的呈现吸引注意，再提供核验信息。凯尔曼的依从、认同、内化强调接受影响的不同机制：奖惩、关系认同、价值信念整合，不是人人必经的固定三步。论述题可按“双路径—四类因素—实例—长期效果—真实信息与自主选择”展开，不把说服等同操纵。<\/p>","recall":[{"q":"中心路径何时更可能出现？","a":"接受者有足够动机和加工能力时，更认真评估论据；态度改变取决于思考质量，而非单靠表面线索。"}],"syllabus_topic":2},{"id":"c412-22","title":"友情、人际吸引与社会交换","outline":"专题二：社会心理学","level":"掌握","keywords":["友情","人际吸引","相似性","互惠","社会交换","公平"],"body_html":"<p>友情通常包含自愿交往、信任、关心和互惠。人际吸引受到接近与熟悉、相似性、被喜欢的体验、互动质量及个人特征等影响。接触增加机会不保证必然喜欢，相似性常有促进作用，互补性也需结合具体需求，不能一概说“相反的人最相吸”。<\/p><h4>社会交换理论<\/h4><p>社会交换视角用回报、代价及比较标准解释关系评价。人不仅比较当前关系的得失，也会参照自己对关系的期待和可获得的替代选择。公平强调投入与获得的相对关系，并非每次帮助都立即等量回报；稳定友情也包含信任、共同认同和不逐笔计算的关怀，不能把该理论写成所有交往都是金钱交易。<\/p><h4>实例与应用<\/h4><p>复习搭档互相讲解难题，获得支持但也花时间；若一方长期只索取且不尊重对方，关系可能失衡。改善可澄清需要和边界、给予回应、安排公平分工。作答时写“吸引形成条件—交换与公平机制—关系维持—情境例子—理论边界”。沟通中准确倾听、适度自我表露、反馈和守约有助形成信任，但亲密并不意味着取消个人边界。<\/p>","recall":[{"q":"社会交换理论是否等于友情必须逐笔等价交换？","a":"不是。它分析回报、代价及比较标准，长期友情还包含信任、关怀与互惠，不能缩成金钱账本。"}],"syllabus_topic":2},{"id":"c412-23","title":"爱情三元理论与亲密关系中的依恋","outline":"专题二：社会心理学","level":"掌握","keywords":["斯滕伯格","亲密","激情","承诺","爱情三元","依恋"],"body_html":"<p>斯滕伯格的爱情三元理论把爱情区分为亲密、激情与决定或承诺。亲密指情感接近、理解与支持；激情涉及吸引和激发；承诺包括决定爱对方及维持关系的意愿。三成分可以有不同组合，也会随关系发展变化。<\/p><h4>组合记忆<\/h4><p>只有亲密是喜欢，只有激情是迷恋，只有承诺是空洞之爱；亲密加激情是浪漫之爱，亲密加承诺是伴侣之爱，激情加承诺是愚昧之爱；三者兼具通常称圆满之爱。名称是理论分类，不是对真实关系的一次性诊断，也不意味着三成分必须一直处于最高水平。<\/p><h4>依恋与应用<\/h4><p>成年依恋研究常用依恋焦虑与回避维度理解亲密中的担忧和距离调节。它借鉴早期依恋研究，但不能直接把婴儿陌生情境分类原封不动套给成年人。若一方追问、一方退避，应分析具体互动、需求与沟通，而不是只贴“焦虑型、回避型”。答题先定义三成分，再举组合和变化，最后说明维持关系需支持、表达、共同决策与边界。理论帮助分析，不保证预测一段关系的结局。<\/p>","recall":[{"q":"伴侣之爱与浪漫之爱有哪些成分？","a":"伴侣之爱是亲密与承诺；浪漫之爱是亲密与激情。"}],"syllabus_topic":2},{"id":"c412-24","title":"从众：原因、经典研究与影响因素","outline":"专题二：社会心理学","level":"掌握","keywords":["从众","规范性影响","信息性影响","阿希","谢里夫"],"body_html":"<p>从众是个体在真实或想象的群体影响下，使判断或行为向群体规范靠拢。信息性影响源于希望判断正确，尤其在情境模糊或自己缺少知识时；规范性影响源于希望得到接纳、避免排斥，即使内心不同意也可能公开配合。<\/p><h4>经典研究与因素<\/h4><p>谢里夫利用自主运动错觉研究模糊情境中规范如何形成；阿希用线段判断研究明确任务中多数意见的压力。影响因素包括群体规模及一致性、是否有同伴支持、群体吸引力和重要性、任务难度和模糊性、回答公开程度、自信及文化情境。群体人数作用不宜写成无上限线性增加；打破一致性的同伴有时比单纯减少人数更关键。<\/p><h4>现实应用与论述结构<\/h4><p>小组讨论前先独立答题，再匿名收集意见，可减少为了合群而改答案；遇到不熟悉的新任务，参考有可靠证据的群体判断也可能有益。从众不全是负面，关键在规范和证据质量。答题按“定义—两种动机—经典研究—个体、群体和任务因素—例子—合理独立判断”展开，并区分外显配合与内心真正接受。<\/p>","recall":[{"q":"规范性与信息性影响怎样区分？","a":"规范性影响为了被接纳、避免排斥；信息性影响为了在不确定情况下获得正确判断。"}],"syllabus_topic":2},{"id":"c412-25","title":"顺从与服从：请求、权威和影响因素","outline":"专题二：社会心理学","level":"掌握","keywords":["顺从","依从","服从","米尔格拉姆","登门槛","门前大要求"],"body_html":"<p>顺从或依从通常指应他人的直接请求而改变行为；服从指遵循权威的命令；从众则重在群体规范压力。三者都可能表现为行为变化，但影响来源不同，内心也不一定真正接受。<\/p><h4>顺从机制与服从因素<\/h4><p>先请求小事再提出较大请求的登门槛策略常涉及承诺一致；先提出过大请求被拒，再提出较小请求的门面效应常涉及互惠与让步。服从受权威的合法性和接近性、机构支持、受影响者的距离、同伴是否服从、责任是否被转移以及个人判断等影响。外部命令不能自动取消个人责任。<\/p><h4>经典研究的准确表述<\/h4><p>米尔格拉姆研究让参与者相信自己按指令逐级给予“学习者”电击，实际没有对该学习者施加所显示的电击。常见65%的数字来自特定实验条件，不能写成“65%的人真实实施致命电击”，更不能推广为所有场合固定比例。答题应说明情境力量，同时讨论提供异议渠道、明确责任和独立核验如何减少不当服从。<\/p>","recall":[{"q":"从众、顺从、服从各自的主要影响来源是什么？","a":"从众来自群体规范；顺从来自直接请求；服从来自权威命令。"}],"syllabus_topic":2},{"id":"c412-26","title":"群体极化：为什么越讨论越偏向原方向","outline":"专题二：社会心理学","level":"运用","keywords":["群体极化","冒险转移","信息影响","社会比较","群体认同"],"body_html":"<p>群体极化指群体讨论使成员原有的平均倾向进一步加强。例如本来略支持某方案，讨论后更支持；本来较谨慎，讨论后也可能更谨慎。因此极化不是一定更冒险，也不是两派意见一定彼此撕裂。<\/p><h4>形成机制<\/h4><p>信息影响：成员听到更多支持原立场的论据，增强确信；规范与社会比较：为得到群体认可，表达更符合群体重视方向的意见；群体认同：突出“我们”的规范及与外群体的区别。同质成员、单一信息来源和缺少异议渠道可能促进极化，但具体效果需看情境。<\/p><h4>生活例子与措施<\/h4><p>复习群最初只是认为某科较难，反复转发失败经历而很少讨论成功策略，最后形成“根本不可能通过”的更极端判断。分析时依次写初始倾向、交流内容、心理机制、最终变化及行为后果。改善可先独立写意见、主动引入反证、让不同观点平等发言并核验信息。群体讨论也能产生更充分判断，不能由“出现群体”就断言有极化；需要比较讨论前后的方向和强度。<\/p>","recall":[{"q":"群体极化是否总使决策更冒险？","a":"不是。它加强原有倾向，原先谨慎的群体也可能变得更谨慎。"}],"syllabus_topic":2},{"id":"c412-27","title":"群体思维：表现、危害与预防","outline":"专题二：社会心理学","level":"掌握","keywords":["群体思维","贾尼斯","一致性压力","自我审查","思想警卫"],"body_html":"<p>群体思维是群体过度追求一致与凝聚，使批判性评估和替代方案受压制的决策倾向，常与贾尼斯的研究联系。高凝聚本身并非必然有害，还要结合隔绝外部信息、领导过早表态、压力和程序缺陷等条件。<\/p><h4>典型表现与危害<\/h4><p>表现包括无懈可击的错觉、相信本群体天然正确、对警告集体合理化、对外群体刻板看待、压制异议、自我审查、一致同意的错觉及替群体过滤坏消息的“思想警卫”。后果是少比较替代方案、不充分搜寻信息、低估风险且缺少补救计划。沉默可能来自压力，不等于真实赞同。<\/p><h4>预防与概念辨析<\/h4><p>先独立形成意见，领导延后表达偏好，明确鼓励异议，指定反方检验，邀请外部专家，设置重新审视决定的环节。群体极化关注讨论后立场更极端，群体思维关注追求一致损害决策过程；两者可同时出现，但不应简单等同或把后者一律说成前者的子类型。案例题要指出材料中的具体表现，再给与之对应的纠正措施。<\/p>","recall":[{"q":"群体思维与群体极化的区别是什么？","a":"群体思维强调一致性压力妨碍批判决策；群体极化强调讨论后原有立场更强，两者可能并存但不等同。"}],"syllabus_topic":2},{"id":"c412-28","title":"社会助长与社会惰化：他人在场为何效果不同","outline":"专题二：社会心理学","level":"掌握","keywords":["社会助长","社会干扰","社会惰化","优势反应","可识别性"],"body_html":"<p>社会助长研究他人在场如何影响个人表现。扎荣茨的优势反应解释认为，他人在场引起的唤醒会增强优势反应：对熟练、简单任务，优势反应常是正确反应，表现可能提高；对新颖、复杂任务，优势反应可能错误，表现反而受干扰。评价顾忌和分心等也是重要解释。<\/p><h4>社会惰化<\/h4><p>社会惰化指在共同完成任务、个人贡献不易区分时，个体投入的努力可能少于独立完成时。原因包括责任与评价分散、认为个人努力对结果影响小、预期他人搭便车、任务意义或群体认同不足。它不同于缺乏协调造成的效率损失，也不同于复杂任务中的表现焦虑。<\/p><h4>复习小组应用<\/h4><p>让同学在熟练题目上相互展示，可能提高表现；初学困难内容时可先独立练习、减少评价压力。避免小组“一个人做、大家署名”，应明确分工、记录个人贡献、建立有意义目标并提供公平反馈。答题可用“现象定义—发生条件—机制—措施”结构。并非人越多必然越懒，贡献可识别、任务重要且成员互相依赖时，也可能保持较高努力。<\/p>","recall":[{"q":"如何区分社会干扰和社会惰化？","a":"社会干扰可因他人在场使复杂任务表现变差；社会惰化是集体工作中个人投入努力减少，尤其贡献不易识别时。"}],"syllabus_topic":2},{"id":"c412-29","title":"去个性化与侵犯：匿名并非必然导致伤害","outline":"专题二：社会心理学","level":"理解","keywords":["去个性化","匿名","群体规范","侵犯","网络行为"],"body_html":"<p>传统去个性化概念强调人在群体、匿名或高唤醒条件下，个人身份的突出性、自我监控或责任感可能下降，从而更容易出现受当时情境影响的行为。其解释不能简单写成“人群里的人失去理智”，匿名也不是必然导致侵犯。<\/p><h4>与群体规范结合理解<\/h4><p>当攻击性规范占优势时，匿名、责任模糊与同伴鼓励可能增加失控言行；当合作规范明确时，匿名群体也可能表现出互助。这里应区分个人身份不突出、责任分散和群体身份增强等不同机制。社会心理学对这一问题有多种解释，不能只凭参与人数或是否实名确定原因。<\/p><h4>侵犯与现实案例<\/h4><p>侵犯通常指有意伤害不愿受到该伤害的他人的行为；意图是关键，不能把意外伤害等同侵犯。挫折和负性情绪、攻击榜样、情境线索及对他人意图的解释都可能参与。分析网络围攻，可结合匿名、从众、刻板印象、极化和奖励机制；减少伤害可明确规则与责任，停止传播未经核验的信息，支持旁观者提出异议。答案应把机制对应材料，避免把所有概念无差别堆在一起。<\/p>","recall":[{"q":"去个性化为何不等于必然侵犯？","a":"行为方向还取决于群体规范与情境；匿名和个人身份弱化也可能发生于合作、互助情境。"}],"syllabus_topic":2},{"id":"c412-30","title":"利他与助人：形成机制、旁观者效应和促进途径","outline":"专题二：社会心理学","level":"运用","keywords":["亲社会行为","助人","利他","旁观者效应","责任分散","移情"],"body_html":"<p>亲社会行为泛指有益于他人或群体的行为；助人是其中向有需要者提供帮助的行动；利他通常强调以他人福祉为目的，不能只凭是否得到回报判断真实动机。一次助人也可能同时包含同情、规范、关系及自我感受等多种动机。<\/p><h4>形成原因<\/h4><p>可从移情与关心、互惠规范和社会责任规范、观察学习与强化、成本收益评价，以及亲缘与合作的进化解释等层次分析。旁观者效应说明在某些情境中，他人在场可能降低个体介入概率，原因包括责任分散、人众无知和害怕判断错误；它不是任何人数增加都必然无人帮助。<\/p><h4>决策过程与促进途径<\/h4><p>助人需要注意事件、判断是否需要帮助、承担责任、知道怎么做并采取行动。促进措施应逐步对准障碍：说明需要，直接点名请求某人承担明确任务，示范帮助，训练适当技能，降低不必要的参与成本并建立互助规范。例如“请穿蓝衣的同学联系工作人员”，比泛喊“谁来帮忙”更能明确责任。论述题按“概念辨析—多种动机—情境障碍—对应措施—实例”作答，避免把未帮助简单归咎于道德冷漠。<\/p>","recall":[{"q":"促进助人为什么需要具体点名分工？","a":"它能明确谁负责什么，减少责任分散和行动不确定性，让旁观者更容易进入实际行动。"}],"syllabus_topic":2}],"topics":[{"number":1,"numeral":"一","title":"人格心理学","requirements":"掌握\n人格的定义、各流派（精神分析流派、特质流派、生物学取向、人本主义流派、行为主义流派及认知主义流派）的人格观点\n理解\n各流派人格观点的区别与关系\n运用\n各流派人格理论在现实生活中的运用"},{"number":2,"numeral":"二","title":"社会心理学","requirements":"1.掌握\n    社会心理学的常见现象及其理论解释，如社会化过程、归因方式、社会知觉、社会态度；社会关系：友情、爱情；社会影响：服从、顺从、群体极化等\n2.理解\n    印象的形成过程、个体如何受到社会的影响\n3.运用\n使用社会心理学的理论解释社会现象"}]},{"code":"501","title":"思想政治理论","overview":"围绕中国特色社会主义的历史与现实、经济政治文化社会生态建设、和平发展与党的建设，以及马克思主义历史唯物主义、实践观、辩证法和社会科学方法，系统掌握概念、理论关系、基本论述与材料分析方法。","cards":[{"id":"c501-01","title":"历史由来、理论成果与四个自信","outline":"专题一","level":"范围核心","keywords":["中国特色社会主义","四个自信","八个明确","十四个坚持","十个明确"],"body_html":"<p><strong>一、历史由来与理论成果。<\/strong>中国特色社会主义是在中国革命、建设和改革的历史进程中形成发展的。新民主主义革命的胜利和社会主义基本制度的建立奠定了政治、制度基础；社会主义建设的探索积累了经验；改革开放开辟了中国特色社会主义道路，此后在现代化建设中不断发展。理论成果包括邓小平理论、“三个代表”重要思想、科学发展观和习近平新时代中国特色社会主义思想。邓小平理论集中回答“什么是社会主义、怎样建设社会主义”；“三个代表”重要思想进一步回答这一问题，并回答“建设什么样的党、怎样建设党”；科学发展观回答“实现什么样的发展、怎样发展”；习近平新时代中国特色社会主义思想系统回答新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义等重大时代课题。<\/p>\n<p><strong>二、道路、理论体系、制度、文化的关系。<\/strong>道路是实现现代化的实践途径；理论体系提供思想指导；制度把根本原则与治理方式固定为规范；文化提供精神力量和价值认同。四者统一于中国特色社会主义实践。道路自信关注发展方向和实现途径，理论自信关注理论的解释力与指导力，制度自信关注制度的组织和治理作用，文化自信关注文化的生命力与创造力。坚定四个自信，要把认识认同落实到学习、工作和社会实践中，并在解决现实问题中检验和发展。<\/p>\n<p><strong>三、“八个明确”的八项内容。<\/strong>①总任务：实现社会主义现代化和中华民族伟大复兴，在全面建成小康社会基础上分两步走建设社会主义现代化强国。②主要矛盾：人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾，要求坚持以人民为中心。③总体与战略布局：统筹经济、政治、文化、社会、生态文明建设，协调推进“四个全面”，坚定“四个自信”。④改革总目标：完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。⑤依法治国总目标：建设中国特色社会主义法治体系和社会主义法治国家。⑥强军目标：建设听党指挥、能打胜仗、作风优良的人民军队，向世界一流军队迈进。⑦大国外交：推动新型国际关系和人类命运共同体建设。⑧党的领导：党的领导是中国特色社会主义的本质特征和制度优势，加强党的建设并突出政治建设。<\/p>\n<p><strong>四、“十四个坚持”的实践方略。<\/strong>依次是：党对一切工作的领导；以人民为中心；全面深化改革；新发展理念；人民当家作主；全面依法治国；社会主义核心价值体系；在发展中保障和改善民生；人与自然和谐共生；总体国家安全观；党对人民军队的绝对领导；“一国两制”和推进祖国统一；推动构建人类命运共同体；全面从严治党。记忆时可归纳为领导与立场、改革发展与治理、民生生态与安全、军队统一与外交、党的自身建设五组。“八个明确”侧重理论认识，“十四个坚持”侧重实践要求，二者体现理论与实践、认识论与方法论的统一。<\/p>\n<p><strong>五、思想的意义与概念辨析。<\/strong>这一思想继承和发展马克思主义及此前的中国化理论成果，系统回应新时代的发展与治理问题，为现代化和民族复兴提供行动指导。“八个明确”是 2017 年的概括；2021 年形成“十个明确”的进一步概括，其中经济建设和全面从严治党的要求更加明确，党的领导的表述置于首位。两者反映理论概括的发展，答“八个明确”时应完整回答上述八项。与此相应，“四个全面”在不同阶段的首项分别是“全面建成小康社会”和“全面建设社会主义现代化国家”，其余三项为全面深化改革、全面依法治国、全面从严治党。<\/p>","recall":[{"q":"八个明确与十四个坚持是什么关系？","a":"前者侧重理论概括，后者侧重实践方略；二者相互联系，体现认识与行动的统一。"},{"q":"“八个明确”和“十个明确”是什么关系？","a":"“八个明确”是2017年的核心内容概括，“十个明确”是2021年对理论内容的进一步概括，强化了党的领导，并更加明确经济建设和全面从严治党等要求；两者体现理论认识的深化发展。"}],"related_topics":[],"syllabus_topic":1},{"id":"c501-02","title":"新时代的含义、主要矛盾与基本国情","outline":"专题二","level":"范围核心","keywords":["新时代","主要矛盾","社会主义初级阶段","不平衡不充分"],"body_html":"<p><strong>一、新时代的五个方面。<\/strong>中国特色社会主义进入新时代，是我国发展新的历史方位。其内涵是：①在新的历史条件下继续夺取中国特色社会主义胜利；②决胜全面建成小康社会，进而全面建设社会主义现代化强国；③全国人民团结奋斗、创造美好生活、逐步实现共同富裕；④为实现中华民族伟大复兴而奋斗；⑤我国日益走近世界舞台中央、不断作出更大贡献。这一判断同时包含事业发展、国家建设、人民生活、民族复兴和国际作用五个层次。<\/p>\n<p><strong>二、主要成就与重大意义。<\/strong>党的十八大以来，经济实力和科技能力提升，改革和法治建设持续推进，脱贫攻坚取得全面胜利，全面建成小康社会，社会保障与公共服务扩大，生态环境治理加强，国防建设和对外交往发展，全面从严治党深入推进。两个重要节点是 2021 年 2 月 25 日宣布脱贫攻坚取得全面胜利、2021 年 7 月 1 日宣布全面建成小康社会。新时代的意义可概括为：民族复兴进入新的发展阶段；中国特色社会主义展现新的实践活力；现代化道路探索为世界发展提供新的经验。<\/p>\n<p><strong>三、社会主要矛盾的转化。<\/strong>社会主要矛盾由人民日益增长的物质文化需要同落后的社会生产之间的矛盾，转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。转化的依据是生产力水平和总体供给能力提高，人民需要从物质文化扩展到民主、法治、公平、安全、环境等方面，而城乡、区域、群体和领域之间的差距，以及质量、效率、公共服务等不足更加突出。“不平衡”强调结构和分布上的差异，“不充分”强调发展能力和水平的不足。<\/p>\n<p><strong>四、变化与不变。<\/strong>社会主要矛盾变化体现阶段性特征；我国仍处于并将长期处于社会主义初级阶段，仍是世界上最大的发展中国家，体现长期基本国情。“站起来、富起来、强起来”概括国家独立、发展富裕和综合实力提升的历史进程，三者相互衔接，相关任务并非截然分割。工作要求是坚持发展，同时提高质量、补齐短板、促进公平、回应多层次需要。<\/p>\n<p><strong>五、材料分析示例。<\/strong>一地医院床位总数增加，但偏远乡镇居民仍就医困难，说明发展总量改善与资源配置不平衡并存。改进措施包括提升基层医疗能力、优化转诊、完善支付保障和人员配置。分析时既看到既有成就，也识别突出矛盾，再提出与矛盾相对应的措施。<\/p>","recall":[{"q":"主要矛盾改变是否意味着脱离初级阶段？","a":"不是。主要矛盾反映发展阶段的突出问题，初级阶段反映长期的基本国情，两种判断可以同时成立。"}],"related_topics":[],"syllabus_topic":2},{"id":"c501-03","title":"总任务、四个伟大与现代化战略安排","outline":"专题三","level":"范围核心","keywords":["总任务","四个伟大","中国式现代化","两步走"],"body_html":"<p><strong>一、总任务与中国梦。<\/strong>新时代坚持和发展中国特色社会主义的总任务是实现社会主义现代化和中华民族伟大复兴。中国梦的核心内涵是国家富强、民族振兴、人民幸福；三者相互联系，国家和民族的发展最终要体现在人民生活与发展条件的改善。实现中国梦需要坚持中国道路、弘扬中国精神、凝聚中国力量。<\/p>\n<p><strong>二、“四个伟大”的科学内涵与关系。<\/strong>伟大斗争是应对重大挑战、抵御重大风险、克服重大阻力、解决重大矛盾的实践；伟大工程是党的建设新的伟大工程；伟大事业是中国特色社会主义事业；伟大梦想是中华民族伟大复兴。梦想规定目标，事业规定实现目标的道路和实践内容，斗争提供克服困难的行动要求，工程提供领导和组织保证。四者紧密联系，其中党的建设新的伟大工程起决定性作用。<\/p>\n<p><strong>三、现代化建设的两步走。<\/strong>在全面建成小康社会的基础上，第一步从 2020 年到 2035 年基本实现社会主义现代化；第二步从 2035 年到本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国。第一个阶段着重提升经济科技实力、创新能力、法治水平、公共服务、共同富裕和生态质量；第二个阶段推动物质文明、政治文明、精神文明、社会文明、生态文明全面提升。阶段目标具有递进关系，不能把规划目标当作已经实现的事实。<\/p>\n<p><strong>四、战略安排的依据与路径。<\/strong>物质技术基础的积累、社会主要矛盾的变化、人民对美好生活的需要以及国内外环境变化，共同构成战略安排的依据。实现路径是统筹“五位一体”总体布局、协调“四个全面”战略布局，坚持改革创新、依法治理和以人民为中心。中国式现代化具有人口规模巨大、全体人民共同富裕、物质文明和精神文明协调、人与自然和谐共生、走和平发展道路等特点。<\/p>\n<p><strong>五、应用理解。<\/strong>现代化既包括产业、科技、基础设施，也包括公平、公共服务、社会治理和生态环境。以城市更新为例，住房安全、老年服务、公共交通、历史文化保护、居民参与均属具体建设内容，仅用新增投资衡量现代化会遗漏人的发展与生活质量。<\/p>","recall":[{"q":"四个伟大如何组成一个论述框架？","a":"用梦想说明目标、事业说明道路、工程说明组织保证、斗争说明应对挑战的实践要求，再说明相互支撑。"}],"related_topics":[],"syllabus_topic":3},{"id":"c501-04","title":"高质量发展、现代化经济体系与市场政府关系","outline":"专题四","level":"范围核心","keywords":["高质量发展","现代化经济体系","供给侧结构性改革","实体经济"],"body_html":"<p><strong>一、基本经济制度与经济理论。<\/strong>社会主义基本经济制度包括公有制为主体、多种所有制经济共同发展，按劳分配为主体、多种分配方式并存，以及社会主义市场经济体制。坚持和完善这一制度，要巩固和发展公有制经济，鼓励、支持、引导非公有制经济发展，使各种所有制经济依法平等使用生产要素、公平参与竞争。中国特色社会主义政治经济学强调以人民为中心，解放和发展生产力，把效率提升与公平改善、经济发展与社会发展联系起来。<\/p>\n<p><strong>二、为什么转向高质量发展。<\/strong>随着发展阶段变化，单纯依靠要素投入和数量扩张的增长方式受到资源环境、成本、人口结构、需求升级和国际竞争的约束。高质量发展重视质量、效率和动力，体现创新、协调、绿色、开放、共享的新发展理念。创新解决动力问题，协调解决不平衡问题，绿色解决人与自然关系问题，开放解决内外联动问题，共享解决发展成果分配问题。高质量并不排斥合理增速，而是要求增长具有更好的效益和可持续性。<\/p>\n<p><strong>三、现代化经济体系的内涵。<\/strong>它是经济活动各领域、层次和环节相互联系的有机整体，主要包括创新引领、协同发展的产业体系，统一开放、竞争有序的市场体系，体现效率、促进公平的收入分配体系，优势互补、协调联动的城乡区域发展体系，节约资源、保护环境的绿色发展体系，多元平衡、安全高效的全面开放体系，以及市场机制有效、微观主体有活力、宏观调控有度的经济体制。实体经济、科技创新、现代金融、人力资源需要协同发展。<\/p>\n<p><strong>四、主要建设任务。<\/strong>深化供给侧结构性改革，提高有效供给质量；实施创新驱动发展，增强科技和人才支撑；推进乡村振兴和城乡融合；实施区域协调发展战略；完善社会主义市场经济体制；推动更高水平开放。实体经济提供实际产品、服务、就业和技术应用场景，金融应支持实体经济的生产、创新与风险管理。<\/p>\n<p><strong>五、供给侧结构性改革。<\/strong>其着眼点是供给结构与需求结构不相适应，主攻方向是减少无效低效供给、扩大有效供给、提高供给体系质量和效率。相关任务包括去产能、去库存、去杠杆、降成本、补短板，并通过技术、管理和制度创新改善结构。它与需求管理相互配合：前者重结构、质量与中长期能力，后者通过消费投资等调节总需求。二者均须结合现实条件。<\/p>\n<p><strong>六、市场、政府与开放。<\/strong>市场通过价格、供求、竞争配置资源，政府通过宏观调控、公共服务、监管和规则建设弥补市场失灵；关键是使市场起决定性作用、更好发挥政府作用。完善产权保护、公平竞争、要素市场和法治化营商环境，有助于激发经营主体活力。对外开放新格局包括扩大贸易和投资合作、优化区域开放布局、提高便利化水平、推动规则衔接和制度型开放，同时兼顾产业链、金融和经济安全。<\/p>","recall":[{"q":"为什么发展经济要着力于实体经济？","a":"它是创造实际产品服务、吸纳就业和承载技术创新的基础。应结合产业升级与金融服务实体解释，不能把所有金融活动视为无用。"}],"related_topics":[],"syllabus_topic":4},{"id":"c501-15","title":"新质生产力与科学技术的生产作用","outline":"专题四","level":"专题巩固","keywords":["新质生产力","科学技术","第一生产力","创新","全要素生产率"],"body_html":"<p><strong>从生产力解释科技。<\/strong>生产力反映人们改造自然、创造物质生活条件的能力。科学知识通过进入劳动者素质、设备工具、工艺流程和管理组织，影响劳动效率、产品质量与资源利用。回答“科技是第一生产力”，应说明这种对各要素的渗透及创新引领作用；不应说知识只要被提出就会自动成为现实产出，转化还需要人才、制度、投资和应用场景。<\/p>\n<p><strong>新质生产力。<\/strong>它以创新发挥主导作用，强调科技含量、效率与质量，通过技术突破、生产要素重新组合和产业转型形成更先进的生产能力，关注全要素生产率提升。学习时把“新”理解为动力、结构、组织和技术的变化，把“质”理解为效率与发展质量，而不是简单等同于购买新设备或某个热门行业。<\/p>\n<p><strong>两组关系。<\/strong>第一，新质生产力与传统产业不是非此即彼：传统制造通过绿色、数字技术改造也可产生新动能，盲目复制同一产业容易浪费资源。第二，生产力变化需要生产关系和制度相适应，知识产权、人才培养、数据使用和融资规则可能促进也可能阻碍转化。因地制宜意味着依据既有能力和现实需求选择路径。<\/p>\n<p><strong>应用示例。<\/strong>一家食品厂用传感器监测冷链，还需培训员工、改进追溯流程和检验节能成效，才可能提升质量与效率。按“科技作用机制—新质特征—转化条件—案例效果”作答。科学技术的生产作用体现为提升劳动者能力、改进劳动工具、拓展劳动对象，并推动生产组织创新。<\/p>","recall":[{"q":"新质生产力是否意味着抛弃传统产业？","a":"不是。关键是创新和效率质量提升，传统产业的技术与组织改造也能承载新动能，应结合当地条件。"}],"related_topics":[],"syllabus_topic":4},{"id":"c501-05","title":"政治制度、人民当家作主与法治","outline":"专题五","level":"范围核心","keywords":["人民代表大会制度","协商民主","依法治国","人民当家作主"],"body_html":"<p><strong>一、政治发展道路的核心。<\/strong>中国特色社会主义政治发展道路坚持党的领导、人民当家作主、依法治国有机统一。党的领导提供方向和组织保证，人民当家作主体现社会主义民主政治的本质要求，依法治国是治理国家的基本方式。三者统一于民主政治建设的实践，不能以其中一项替代其余两项。这一道路的形成与中国近现代历史、社会主义制度、国家规模与社会条件相联系，制度发展应立足国情并吸收人类政治文明有益成果。<\/p>\n<p><strong>二、根本政治制度和基本政治制度。<\/strong>人民代表大会制度是根本政治制度，人民通过选举代表组成国家权力机关，其他国家机关由其产生、对其负责、受其监督。中国共产党领导的多党合作和政治协商制度，发挥合作、协商、民主监督和参政议政作用；民族区域自治制度把国家统一与民族地区自治结合起来；基层群众自治制度使居民依法参与基层公共事务和公益事业的管理。各项制度共同提供人民参与国家和社会治理的渠道。<\/p>\n<p><strong>三、为什么依靠制度体系保障人民当家作主。<\/strong>制度能够把人民的权利和参与要求转化为明确、稳定、可执行的规则，避免公共事务仅依赖临时安排或个人意愿。保障路径包括健全选举、协商、决策、管理和监督制度，畅通意见表达，完善公开程序和责任机制，加强权利保障与纠错。民主既体现为程序，也要体现在人民对具体公共事务的有效参与和实际权益维护中。<\/p>\n<p><strong>四、中国特色社会主义法治道路。<\/strong>核心要义包括坚持党的领导，坚持中国特色社会主义制度，贯彻中国特色社会主义法治理论。全面依法治国以建设中国特色社会主义法治体系、建设社会主义法治国家为总目标，坚持宪法法律权威，坚持依法治国、依法执政、依法行政共同推进，法治国家、法治政府、法治社会一体建设。科学立法、严格执法、公正司法、全民守法构成法治建设的重要环节，公权力必须受法定权限、程序和监督约束。<\/p>\n<p><strong>五、应用示例。<\/strong>社区改造应先收集居民需求，再经协商形成方案，依法明确项目职责和资金使用，公开实施过程并接受监督。意见表达、规则制定、执行和反馈共同构成参与机制，能够把人民当家作主的原则落实为具体治理程序。<\/p>","recall":[{"q":"制度体系怎样保障人民当家作主？","a":"将人民的参与、表达、决策、管理和监督安排为具体制度程序，并保障权利落实、责任追究和纠错反馈。"}],"related_topics":[],"syllabus_topic":5},{"id":"c501-06","title":"文化自信、核心价值观与文化的社会作用","outline":"专题六","level":"范围核心","keywords":["文化自信","核心价值观","文化软实力","创造性转化"],"body_html":"<p><strong>一、文化理论与文化自信。<\/strong>文化受社会物质生活和制度条件影响，又通过知识、价值观、规范和行动动机反作用于社会。文化具有相对独立性，其变化并不与经济变化完全同步。文化自信是对自身文化价值、生命力和创造力的认识与信心，来源于中华优秀传统文化、革命文化和社会主义先进文化。继承传统要推进创造性转化、创新性发展，并通过交流互鉴吸收外部有益文化成果。<\/p>\n<p><strong>二、意识形态工作的意义与要求。<\/strong>意识形态关系社会价值方向、共同思想基础和文化发展方向。巩固社会主义意识形态，需要坚持马克思主义指导地位，加强理论学习和研究阐释，把思想教育与现实问题的解决相结合，提升公共传播质量和媒介素养。分析社会思潮应重事实、讲道理，说明观念产生的社会条件及其作用，而非只作抽象评价。<\/p>\n<p><strong>三、社会主义核心价值观。<\/strong>国家层面是富强、民主、文明、和谐；社会层面是自由、平等、公正、法治；个人层面是爱国、敬业、诚信、友善。培育和践行要融入国民教育、精神文明建设和日常生产生活，使价值要求与制度规范、公共服务、职业伦理相衔接。其作用在于形成共同价值追求、规范社会行为、增强社会信任，并为判断公共问题提供价值尺度。<\/p>\n<p><strong>四、文化繁荣与制度建设。<\/strong>繁荣发展文化可以提高精神生活质量、促进人的全面发展、增强社会凝聚力和国家文化软实力。公共文化服务保障基本文化权益，文化产业通过多样化产品和服务满足需要；两者都应重视社会效益，并协调社会效益与经济效益。主要任务包括推动优秀文艺创作、保护文化遗产、完善公共文化设施、促进城乡文化服务均衡、培养文化人才和深化文化体制改革。<\/p>\n<p><strong>五、中国特色哲学社会科学与国际传播。<\/strong>构建中国特色哲学社会科学，要立足中国实际，研究中国问题，贯通历史与现实，形成具有主体性和原创性的学科体系、学术体系、话语体系，同时坚持证据标准和国际学术交流。讲好中国故事，需要以真实具体的人物、生活和实践解释发展经验，改进表达与传播方式，重视受众理解与跨文化对话；文化软实力依赖可信内容、优秀作品和持续交流。<\/p>\n<p><strong>六、文化现象分析。<\/strong>非遗短视频可以扩大传播，也可能使内容过度娱乐化。判断时应考察历史准确性、传承人的参与、受众理解和收益安排。文化认同、批判继承与创新传播相结合，才能将传统资源转化为适合当代生活的文化内容。<\/p>","recall":[{"q":"文化为什么能反作用于社会发展？","a":"文化塑造认知、价值、规范与行动动机，并通过人的实践影响制度运行和生产生活；这种作用受现实物质条件制约。"}],"related_topics":[],"syllabus_topic":6},{"id":"c501-07","title":"民生、社会治理与总体国家安全","outline":"专题七","level":"范围核心","keywords":["民生","社会治理","总体国家安全观","脱贫攻坚"],"body_html":"<p><strong>一、发展与改善民生。<\/strong>增进民生福祉是发展的根本目的。发展提供改善生活的物质基础，教育、健康、社会保障等民生改善又能提高劳动能力、增强社会信任和发展参与。民生建设坚持以人民为中心，抓住群众最关心、最直接、最现实的利益问题，尽力而为、量力而行，在发展中逐步提高保障水平。<\/p>\n<p><strong>二、主要民生任务。<\/strong>发展公平而有质量的教育；实现更充分、更高质量的就业；完善收入分配，提高劳动报酬并合理调节差距；建设覆盖全民、城乡统筹的社会保障体系；推进健康中国建设，完善公共卫生和医疗服务；改善住房条件，支持困难群体基本生活；加强养老、儿童照护与残障支持。相关制度包括教育制度、就业和劳动保障制度、社会保险与社会救助制度、基本医疗和住房保障等。<\/p>\n<p><strong>三、加强和创新社会治理。<\/strong>社会治理强调党委领导、政府负责、社会协同、公众参与和法治保障，建设共建共治共享的格局。共建重参与建设，共治重协商合作，共享重发展成果。具体措施包括加强基层治理、健全矛盾预防和化解机制、提升公共服务、发展社会组织与志愿服务、完善公共安全和应急管理、依法保障群众参与和监督。治理过程要形成发现问题、协同处置、反馈评价、持续改进的闭环。<\/p>\n<p><strong>四、总体国家安全观。<\/strong>其核心是以人民安全为宗旨、政治安全为根本、经济安全为基础，以军事、文化、社会安全为保障，以促进国际安全为依托。它要求统筹发展和安全、外部与内部安全、国土与国民安全、传统与非传统安全、自身与共同安全。公共卫生、生态、网络、数据等风险与经济社会生活联系紧密，需要跨部门协同、风险预警和依法治理。<\/p>\n<p><strong>五、脱贫攻坚的意义与措施。<\/strong>脱贫攻坚体现共同富裕和基本民生保障要求，是全面建成小康社会的重要任务。其路径包括精准识别、精准帮扶和精准退出，因地制宜发展产业、促进就业、易地搬迁、教育扶贫、生态补偿和社会保障兜底，解决不愁吃、不愁穿及义务教育、基本医疗、住房安全保障问题。2021 年 2 月 25 日宣布脱贫攻坚取得全面胜利，完成了现行标准下农村绝对贫困的消除任务。绝对贫困消除不等于相对贫困、收入差距和返贫风险消失，持续任务包括巩固成果、防止返贫和推进乡村振兴。<\/p>\n<p><strong>六、应用示例。<\/strong>分析养老服务不足，应同时考察需求增长、支付能力、城乡覆盖、专业人员和家庭负担，再提出公共保障、社区服务、长期照护和监管等配套措施。民生效果应看服务是否可及、负担是否减轻、困难群体是否受益。<\/p>","recall":[{"q":"“消除绝对贫困”是否等于不存在任何贫困与差距？","a":"不是。需注明标准和历史时点，区分绝对贫困、相对贫困、返贫风险及收入分配差距。"}],"related_topics":[],"syllabus_topic":7},{"id":"c501-08","title":"生态文明与绿水青山就是金山银山","outline":"专题八","level":"范围核心","keywords":["生态文明","两山理念","人与自然","绿色发展"],"body_html":"<p><strong>一、生态文明与人与自然的关系。<\/strong>生态文明是人类在生产、生活和制度安排中尊重自然、顺应自然、保护自然的发展形态。自然是人类生存和发展的基础，人能够通过实践改造自然，但活动必须受到生态规律和承载能力约束。人与自然和谐共生要求把资源节约、环境保护和人的发展统一起来，形成绿色的生产方式、生活方式和社会制度。<\/p>\n<p><strong>二、绿水青山就是金山银山。<\/strong>良好生态环境既有健康、公共利益和代际价值，也是长期发展的资源和条件。保护环境就是保护生产力，改善环境可以为绿色产业、优质农业、生态旅游等提供发展机会。生态价值的经济转化需要技术、制度、市场和承载能力等条件，不能为追逐眼前利益损害生态系统。坚持这一理念，需要处理好保护与发展、局部与整体、当前与长远的关系。<\/p>\n<p><strong>三、建设美丽中国的主要任务。<\/strong>推进绿色低碳发展，优化能源、产业和交通结构；全面促进资源节约和循环利用；加强大气、水、土壤等污染防治；推进山水林田湖草沙一体化保护和修复；保护生物多样性和生态系统稳定；完善生态环境治理体系，提高监测、执法和风险应对能力；倡导简约适度、绿色低碳的生活方式。<\/p>\n<p><strong>四、生态文明制度体系。<\/strong>自然资源产权和用途管制明确资源的权责与使用边界，国土空间规划与生态保护红线约束开发活动，环境影响评价和排污管理控制污染，生态补偿协调保护者与受益者关系，督察、考核和责任追究强化执行。把生态文明融入经济、政治、文化和社会建设全过程，意味着项目规划、生产消费、公共决策、教育宣传和社会治理都应考虑环境后果。<\/p>\n<p><strong>五、应用示例。<\/strong>流域治理要统筹上下游和左右岸：上游治理污染、保护水源，下游受益地区通过合理机制分担保护成本，各方共同监测水质和评价效果。只把污染转移到别处，或只建景观而不解决排放，均无法实现系统治理。个人可以通过节能节水、绿色出行、减少浪费和参与环境监督承担生态责任。<\/p>","recall":[{"q":"“两山”关系为什么不是生态价值与货币收益的简单等号？","a":"生态还有健康、公共利益和代际价值；经济价值转化要有制度、技术及生态承载条件，不能以短期收益替代整体价值。"}],"related_topics":[],"syllabus_topic":8},{"id":"c501-09","title":"和平发展、人类命运共同体与世界联系","outline":"专题九","level":"范围核心","keywords":["和平发展","人类命运共同体","一带一路","全球治理"],"body_html":"<p><strong>一、时代主题与中国同世界的关系。<\/strong>和平与发展是当今时代的主题。和平为发展提供条件，发展有助于缓解贫困、失衡等冲突因素；但战争、霸权、保护主义和全球性风险仍然存在。经济全球化和跨国联系使国家之间相互依赖加深，中国既从国际合作中获得发展条件，也通过市场、产业、科技和国际公共产品影响世界。<\/p>\n<p><strong>二、坚持和平发展道路。<\/strong>和平发展强调通过自身努力与国际合作推进现代化，通过对话、协商和共同规则处理分歧，反对以侵略扩张和霸权实现发展。其依据包括中华文化的和平传统、中国近现代历史经验、社会主义建设目标及相互依赖的国际现实。和平发展有利于维护稳定外部环境，集中力量改善人民生活，并促进各国共同发展；维护自身正当权益与履行国际责任相互联系。<\/p>\n<p><strong>三、新型国际关系与人类命运共同体。<\/strong>新型国际关系强调相互尊重、公平正义、合作共赢。人类命运共同体强调各国在全球问题面前具有共同利益和责任，建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界。其实现需要平等协商、共同应对安全风险、分享发展机遇、促进文明交流和开展生态合作，同时尊重各国差异与正当利益。<\/p>\n<p><strong>四、2008 年国际金融危机以来的变化。<\/strong>金融危机揭示金融过度扩张、风险跨境传导和监管不足等问题，此后世界经济增长、产业分工、力量对比和全球治理出现调整。发展不平衡、收入差距、社会分化和制度协调困难加剧，逆全球化与保护主义倾向抬头。解释这些问题，应分析生产与金融、市场与监管、增长与分配、国家利益与全球治理之间的矛盾，并区分不同国家的具体条件。<\/p>\n<p><strong>五、“一带一路”与共同体理念。<\/strong>“一带一路”通过政策沟通、设施联通、贸易畅通、资金融通、民心相通搭建合作平台。命运共同体提供共同发展、合作共赢的理念，“一带一路”提供互联互通和项目合作的实践路径。项目的长期效果取决于需求、经济可行性、生态保护、当地参与及可持续运营等条件。<\/p>\n<p><strong>六、应用示例。<\/strong>气候变化、跨境河流污染和公共卫生风险具有跨国影响。单个国家难以独自解决，需要共享信息、协商规则、协调技术和资金，并合理分担责任。国际合作中既存在共同利益，也存在分配与执行的分歧，正需要持续协商和制度安排。<\/p>","recall":[{"q":"如何把命运共同体与“一带一路”联系起来？","a":"前者是国际关系与共同责任的理念，后者可提供互联互通和合作的平台；需通过项目规则与实际效果说明联系。"}],"related_topics":[],"syllabus_topic":9},{"id":"c501-10","title":"党的领导、全面从严治党与作风建设","outline":"专题十","level":"范围核心","keywords":["党的建设","全面从严治党","作风建设","群众路线"],"body_html":"<p><strong>一、党的领导的必要性。<\/strong>党的领导与中国革命、建设、改革的历史过程相联系，也是中国特色社会主义政治制度的核心组成。现代化建设涉及广泛领域、长期目标和复杂利益，需要政治方向、组织协调和责任体系。党对一切工作的领导体现为总揽全局、协调各方，并通过制度化程序统筹国家治理与社会发展。<\/p>\n<p><strong>二、领导的制度安排。<\/strong>坚持党中央集中统一领导，贯彻民主集中制；重大工作和重要事项依照制度请示报告；党委发挥领导作用，支持国家机关和各类组织依法依章程履职；通过决策、执行、监督等环节保证部署落实。党的领导与依法执政相结合，既要明确政治责任，也要使权力运行受到规则和监督约束。<\/p>\n<p><strong>三、新时代党的建设总要求。<\/strong>坚持和加强党的全面领导，坚持党要管党、全面从严治党，以加强长期执政能力、先进性和纯洁性建设为主线，以政治建设为统领，以坚定理想信念和宗旨为根基，以调动全党积极性、主动性、创造性为着力点，推进政治、思想、组织、作风、纪律建设，把制度建设贯穿其中，深入推进反腐败斗争，不断提高党的建设质量。目标是增强政治方向、群众联系、组织活力、自我纠错和经受风险考验的能力。<\/p>\n<p><strong>四、全面从严治党的主要举措。<\/strong>突出政治建设和政治纪律；加强理论学习与理想信念教育；建设高素质干部队伍和基层组织；持续纠治形式主义、官僚主义、享乐主义、奢靡之风；强化纪律教育和监督执纪；健全权力监督制约机制，贯通各类监督；一体推进不敢腐、不能腐、不想腐；落实主体责任、监督责任和领导干部责任，推动管党治党常态化、制度化。<\/p>\n<p><strong>五、为什么作风建设永远在路上。<\/strong>作风问题与权力运行、利益诱因、组织惯例和监督条件相联系，具有反复性和变异性，集中整治需要与长期制度建设结合。良好作风有助于维护群众利益、节约公共资源、提高政策执行效果和社会信任。治理要把教育提醒、流程改进、问责监督和群众反馈结合起来。<\/p>\n<p><strong>六、应用示例。<\/strong>基层反复填报同类表格，反映多头管理、考核导向和信息共享不足。整改应清理重复任务、统一必要标准、打通信息渠道并听取一线反馈，考察是否真正减少负担。只增加新的检查报表，可能再次加重形式主义。<\/p>","recall":[{"q":"怎样论述“作风建设永远在路上”？","a":"解释问题的反复性及其制度诱因，连接群众利益和治理效果，再说明教育、监督、制度约束与反馈改进的常态化。"}],"related_topics":[],"syllabus_topic":10},{"id":"c501-11","title":"历史唯物主义：社会存在、社会关系与主体","outline":"专题十一","level":"范围核心","keywords":["历史唯物主义","社会存在","社会意识","生产力生产关系"],"body_html":"<p><strong>一、历史唯物主义的基本立场。<\/strong>历史唯物主义从现实的人及其物质生活条件、生产实践和社会关系出发解释社会历史。物质生活资料的生产是社会存在与发展的基础，历史是人在既定条件下通过实践创造的过程。社会存在包括物质生产方式、地理环境、人口等物质生活条件；社会意识包括政治法律思想、道德、宗教、艺术、哲学及社会心理等。社会存在决定社会意识，社会意识具有相对独立性，并通过人的实践反作用于社会存在。<\/p>\n<p><strong>二、社会基本矛盾。<\/strong>生产力是人们改造自然、创造物质财富的能力，基本要素包括劳动者、劳动资料和劳动对象；科学技术通过这些要素发挥作用。生产关系是生产过程中形成的经济关系，主要涉及生产资料所有制、生产中的地位和相互关系、产品分配。生产力决定生产关系，生产关系反作用于生产力。经济基础是一定社会占统治地位的生产关系的总和，上层建筑包括相应的政治法律制度及意识形态；经济基础决定上层建筑，上层建筑反作用于经济基础。两对矛盾共同推动社会发展，具体变化还受到历史条件和主体行动影响。<\/p>\n<p><strong>三、人民群众与历史主体。<\/strong>人民群众创造物质财富、精神财富，并推动社会变革。杰出人物能够对历史发挥重要作用，但其作用受客观条件、社会需要和群众实践制约。分析历史不能只看少数人物的意志，也不能把群众理解为没有差异的抽象整体，要考察不同群体的处境、活动和组织方式。<\/p>\n<p><strong>四、三个称谓的联系。<\/strong>辩证唯物主义强调世界的物质性及联系、发展的基本规律；历史唯物主义集中阐明社会历史的物质基础和发展规律；实践唯物主义突出人与世界通过实践形成的现实联系。三者体现同一哲学的不同侧面，不能分成彼此排斥的派别，也不能把社会规律机械等同于自然定律。<\/p>\n<p><strong>五、历史观、自然观、科学观。<\/strong>自然观承认自然界的客观存在和人与自然的物质联系；历史观强调实践与社会关系的形成发展；科学观重视证据、理论与实践的相互检验，同时研究科学活动所处的社会条件。反思一种社会思潮，可依次考察其产生的物质条件、反映的利益和需要、揭示的真实问题、存在的解释局限，并吸收其中有根据的思想资源。<\/p>\n<p><strong>六、应用示例。<\/strong>“数字技术自动消除教育差距”的判断忽略了社会条件。设备、网络、教师能力、家庭资源、制度安排和学习者行动共同影响收益。技术能够创造新条件，但实际效果取决于这些条件怎样结合，体现物质基础、社会关系与主体能动性的统一。<\/p>","recall":[{"q":"历史唯物主义是否认为经济因素直接决定每件事？","a":"不是。它强调物质生产与社会关系的基础作用，同时分析政治文化的相对独立性、相互作用及人的实践。"}],"related_topics":[],"syllabus_topic":11},{"id":"c501-16","title":"文明形态、人民主体与评价标准","outline":"专题十一","level":"专题巩固","keywords":["文明形态","人民群众","历史创造者","人民利益","社会评价"],"body_html":"<p><strong>文明形态。<\/strong>可理解为人类在一定历史条件下形成的生产生活方式、制度秩序、精神观念和人与自然关系的综合表现。它包括物质、政治、精神、社会与生态等维度，不能只等于经济总量或文化艺术，也不能机械等同于单一社会制度标签。分析一种文明形态，要说明其物质基础、制度组织、价值取向及各维度之间的关系。<\/p>\n<p><strong>人民群众创造历史。<\/strong>人民群众是物质财富和精神财富的创造者，也是社会变革的重要力量。其历史作用通过生产劳动、知识传承、组织参与与制度变革等具体活动实现。强调群众并不否认杰出人物和组织的影响，而是把这些影响放回社会需要、群众实践和客观条件之中，避免英雄个人决定全部历史的解释。<\/p>\n<p><strong>人民利益为何是评价尺度。<\/strong>这一方法论从人民是社会实践主体、社会发展应服务人的生活与发展出发，要求考察政策对多数人的实际影响。评价不能只看部门绩效或短期数字，也要比较利益分配、权利保障、长期成本与不同群体处境。事实判断与价值判断需要连接：先核实实际效果，再说明评价依据，不能以善良愿望代替结果。<\/p>\n<p><strong>应用示例。<\/strong>一座文化馆建筑漂亮但开放时间让上班族和老人难以使用，说明物质设施并不自动带来文明服务。可用访问可及性、参与程度、实际受益与资源公平评估其作用。此例能同时连接文明形态的多维性、群众参与及以人民利益衡量社会效果。<\/p>","recall":[{"q":"回答人民创造历史时需要哪些基本层次？","a":"说明物质财富、精神财富、社会变革三个方面，并用实际活动机制解释；同时恰当处理群众与杰出人物的关系。"}],"related_topics":[],"syllabus_topic":11},{"id":"c501-12","title":"历史与实践视野：逻辑与历史相统一","outline":"专题十二","level":"范围核心","keywords":["实践唯物主义","逻辑与历史","历史性","历史决定论"],"body_html":"<p><strong>一、实践的含义与基本特征。<\/strong>实践是人们有目的地改造客观世界的社会性物质活动，具有客观物质性、自觉能动性和社会历史性。物质生产、社会政治活动和科学实验等是重要实践形式。实践使人既受到现实条件制约，又能够创造工具、改变环境和形成新的社会关系，是理解认识与社会历史的基础。<\/p>\n<p><strong>二、马克思主义哲学的转变。<\/strong>旧唯物主义主要把对象理解为直观的、既成的对象，对人的能动实践和社会关系重视不足；费尔巴哈在自然观上坚持唯物主义，但对社会历史的解释仍未充分超越抽象的人及观念关系。黑格尔发展了辩证思维，却把现实历史归于理念或精神的运动。马克思和恩格斯从现实人的生产生活和实践出发，把唯物主义贯彻到社会历史领域，并在这一基础上改造辩证法。<\/p>\n<p><strong>三、逻辑与历史相统一。<\/strong>历史是事物实际形成和发展的过程，逻辑是思维对其本质联系和规律的概括。逻辑以真实历史为基础，又通过分析综合把握过程中的关键关系，而非逐日复述所有事件。历史材料检验和修正理论，理论帮助理解材料之间的联系。研究既不能让现实迁就预设公式，也不能只积累事实而没有解释。<\/p>\n<p><strong>四、历史性与历史主义。<\/strong>历史性指事物及其意义在具体历史条件下产生、变化；历史主义方法要求把对象放在其时代背景和发展过程中理解。这不等于认定每一事件都是唯一必然结果，也不等于取消跨时代比较和价值判断。应把历史条件、客观规律、主体选择和偶然因素联系起来，既说明限制，也解释可能性与行动。<\/p>\n<p><strong>五、需要辨析的四种倾向。<\/strong>绝对历史决定论把过程理解为无需主体选择的预定结局；历史客观主义若只陈列外部事实，会忽视人的实践与价值关系；历史怀疑论可能从材料有限推到一切历史知识皆不可靠；历史虚无主义可能以片段和任意解释否定有充分证据支持的历史事实或整体联系。克服这些倾向，须坚持史料辨析、具体条件分析与主体作用分析，允许基于新证据修正认识。<\/p>\n<p><strong>六、应用示例。<\/strong>研究网络互助，应追溯通信技术、支付工具、社会需要、信任和监管的变化，考察组织者与参与者的选择，再概括组织机制和风险。这样的研究把事实过程与理论解释、客观条件与主体实践连接起来。<\/p>","recall":[{"q":"逻辑与历史统一为什么不等于照时间顺序列事件？","a":"理论要依据真实历史概括本质联系，顺序罗列只提供材料；反过来概念也不能脱离或歪曲历史。"}],"related_topics":[],"syllabus_topic":12},{"id":"c501-17","title":"实践、认识、创新与主客观世界","outline":"专题十二","level":"专题巩固","keywords":["实践认识","理论创新","实践创新","客观世界","主观世界"],"body_html":"<p><strong>实践对认识的决定作用。<\/strong>实践提供认识的来源，提出问题并推动认识发展，是检验认识真理性的标准，也是认识的目的。来源不等于每个人都必须亲身做过一切：间接知识来自他人实践积累，仍需在适用条件中检验。认识有能动作用，理论能够帮助提出假设、选择行动和预见后果，但不能脱离实践凭空保证结论正确。<\/p>\n<p><strong>理论与实践创新。<\/strong>新的实践问题暴露旧解释的限制，促使调查、比较与概念更新；新的理论又形成方案并回到实践接受检验。良性互动可写成“发现问题—调查证据—形成解释—小范围验证—反馈修正—推广再检验”。创新不是一味否定已有知识，也不是给旧经验换一个名称。要区分成功的局部经验与可普遍推广的规律。<\/p>\n<p><strong>改造客观与主观世界。<\/strong>前者指改变自然和社会的现实条件，后者指改变自身认识能力、思维方式与价值观念。两者在实践中统一：能力和观念影响行动，行动效果又暴露认识偏差。不能以纯粹思想教育替代环境和制度改进，也不能只改变外部条件而不提升人的能力。<\/p>\n<p><strong>应用示例。<\/strong>学校发现学生求助率低，先访谈调查而非认定学生“抗拒帮助”；试行更方便的预约方式，再结合数据与体验修正方案。工作人员同时反思刻板看法，说明客观流程改进与主观认识更新相互促进。答材料题时逐一把材料事实放入上述环节，切忌只背四句话。<\/p>","recall":[{"q":"实践对认识的四个作用是什么？","a":"来源、动力、检验真理性的标准、目的；每个作用均应能配一个具体机制或事例。"},{"q":"主观世界与客观世界的改造怎样统一？","a":"人的认识指导外部行动，行动又检验并更新认识；需要个人能力观念和客观制度条件共同改变。"}],"related_topics":[],"syllabus_topic":12},{"id":"c501-13","title":"唯物辩证法：联系、发展、矛盾与具体分析","outline":"专题十三","level":"范围核心","keywords":["唯物辩证法","黑格尔","矛盾","主要矛盾","量变质变"],"body_html":"<p><strong>一、唯物辩证法的基本特征。<\/strong>联系和发展是唯物辩证法的基本观点，对立统一规律揭示事物发展的内在动力。联系具有客观性、普遍性、多样性和条件性，不能把同时发生的现象直接认作因果。发展是新事物产生、旧事物灭亡的过程，判断新旧要看其是否符合规律、具有生命力，而不只看出现时间。矛盾具有普遍性和特殊性，具体问题具体分析是认识和解决矛盾的关键。<\/p>\n<p><strong>二、矛盾同一性与斗争性。<\/strong>同一性指对立双方相互依存，并在一定条件下相互转化；斗争性指对立双方相互排斥、相互否定。二者相互联系，矛盾双方的作用推动事物运动发展。分析教育中的统一要求与个体差异，就要看到共同目标和差异化支持既有张力又能相互补充，不能简单取消一方。<\/p>\n<p><strong>三、与黑格尔辩证法的比较。<\/strong>共同点是反对孤立、静止地看世界，强调过程、内在联系和矛盾。区别在于基础和方向：黑格尔把发展置于理念、精神的逻辑体系中，马克思和恩格斯将辩证法建立在客观物质世界和社会实践之上，把观念理解为现实运动在人脑中的反映。唯物主义改造保留了联系和发展的合理内核，改变了唯心主义前提，使辩证法成为认识现实和改变现实的方法。<\/p>\n<p><strong>四、自然辩证法与历史辩证法的统一。<\/strong>自然与社会都具有客观的联系、变化和发展，社会存在于自然界之中，人通过实践与自然发生物质交换，因而两者不能绝对割裂。社会又具有特殊性：社会规律通过有意识的人的活动实现，社会研究需要考虑制度、利益、意义和价值。统一不等于用自然科学的具体规律直接代替社会历史分析；对把二者对立起来的观点，应从共同物质基础与社会实践特殊性两方面辨析。<\/p>\n<p><strong>五、主要矛盾与矛盾的主要方面。<\/strong>主要矛盾是在复杂事物中起支配作用的矛盾，矛盾主要方面是在同一矛盾中处于支配地位的一方。两点论要求兼顾各方面，重点论要求抓住关键，二者统一才能避免平均用力和只看一点。社会基本矛盾指生产力与生产关系、经济基础与上层建筑的矛盾；社会主要矛盾是某一历史阶段最突出的矛盾，二者所处分析层次不同。<\/p>\n<p><strong>六、应用示例。<\/strong>社区心理服务使用率低，可能涉及服务可及性、污名、费用和服务质量。调查后找出主要制约，优先改善关键环节，同时兼顾其他因素，并随条件变化调整重点。机械地把同一措施用于所有社区，忽略了矛盾的特殊性。<\/p>","recall":[{"q":"社会基本矛盾与社会主要矛盾如何区别？","a":"基本矛盾说明社会发展的深层结构动力；主要矛盾说明一定历史阶段需要重点解决的突出问题，不能互相替代。"}],"related_topics":[],"syllabus_topic":13},{"id":"c501-18","title":"物质、运动、意识与人工智能","outline":"专题十三","level":"专题巩固","keywords":["物质","运动","意识","人工智能","主观体验"],"body_html":"<p><strong>物质与运动。<\/strong>哲学上的物质强调不依赖人的意识而存在的客观实在，不是只指某一种具体物体。运动是物质的存在方式和根本属性，既包括位置改变，也包括物理、化学、生物及社会变化；不能设想完全脱离运动的物质，也不能把运动当成没有物质承担者的独立实体。静止是一定条件下某种状态的相对稳定，因而绝对运动与相对静止可以统一。<\/p>\n<p><strong>物质与意识。<\/strong>在唯物主义哲学中，意识依托人的生理基础和社会实践，是对客观世界的能动反映；其内容来自现实，但反映经过选择、加工和创造。物质决定意识，意识通过指导实践影响客观世界。错误意识同样可造成实际后果，所以不能把“有能动作用”理解为任何想法都符合事实。<\/p>\n<p><strong>AI材料题的边界。<\/strong>算法、数据、算力及使用情境具有现实物质和社会基础；AI可以辅助信息处理并改变实践方式。但完成语言或推理任务，不足以证明系统具有人类式主观体验。人工意识仍涉及定义和证据争论，不能把“像人说话”直接写成“已经拥有意识”，也不必把未来可能性写成无证据的绝对断言。<\/p>\n<p><strong>应用示例。<\/strong>AI给出心理学资料摘要时，人仍需核对来源、评价偏差并承担研究判断。可按“物质基础—信息处理功能—与人的社会性意识的区别—合理使用与核验”展开。评估人工智能的社会作用，还需考察数据质量、适用条件、责任归属和人的监督。<\/p>","recall":[{"q":"运动与静止为什么不矛盾？","a":"运动是普遍和绝对的，静止是特定参照与条件下的相对稳定，两种判断针对不同层次。"},{"q":"AI能写自我描述是否证明有主观体验？","a":"不能。可观察行为表现与主观体验并不等同，意识判断需明确概念与证据，仍有学术争论。"}],"related_topics":[],"syllabus_topic":13},{"id":"c501-20","title":"辩证思维与发展的前进性、曲折性","outline":"专题十三","level":"专题巩固","keywords":["归纳演绎","分析综合","抽象具体","前进性曲折性","辩证否定"],"body_html":"<p><strong>三组常用方法。<\/strong>归纳从多个具体观察概括一般判断，演绎从一般前提推出特定条件下的结论；归纳要注意样本范围，演绎要检查前提是否成立。分析将整体分解以把握要素及作用，综合将其重新联系以解释整体，不能只列因素而无相互关系。从抽象到具体不是从简单到复杂的堆砌，而是在把握基本规定后重建丰富联系。答题选一组时，要同时说明两个方面及其互补关系。<\/p>\n<p><strong>量变、质变和辩证否定。<\/strong>量的积累在一定条件下可能引起性质改变，但阈值与路径必须根据具体对象研究；质变又为新的量变提供基础。辩证否定强调既克服旧事物的限制，又保留和转化其中合理因素，不能理解为全盘抛弃或原样重复。<\/p>\n<p><strong>前进性与曲折性。<\/strong>发展方向与实现道路处于不同层次：新事物成长受到旧力量、资源限制和认识偏差等影响，可能发生反复；局部挫折不能直接否定长期变化，长期趋势也不保证每一步必然顺利。解释历史进程还要看到人的选择和客观条件，避免把“规律”变成等待成功的宿命论。<\/p>\n<p><strong>应用示例。<\/strong>学校试行新咨询预约系统，首次上线可能因界面复杂而使用率下降。应分解入口、排队与隐私说明的问题，综合改进并再次评估；不能凭一次失败断言改革无效，也不能凭理念良好拒绝修正。按“方法定义—相互关系—具体限制—行动启示”完成论述。<\/p>","recall":[{"q":"怎样解释前进性与曲折性的统一？","a":"区分长期方向与具体道路，说明阻力和条件，既不能以局部挫折否定全部发展，也不能假定每一步都自动前进。"}],"related_topics":[],"syllabus_topic":13},{"id":"c501-14","title":"人文社会科学方法：解释、主体间性与混合研究","outline":"专题十四","level":"范围核心","keywords":["解释学","主体间性","混合方法","数字研究","科学精神"],"body_html":"<p><strong>一、方法的三个层次。<\/strong>哲学方法论处理世界观、认识前提、价值立场和一般思维原则，居于最高抽象层次；一般研究方法如比较、系统分析、因果分析适用于多个领域；具体学科方法如实验、访谈、问卷和统计承担具体证据工作。哲学的指导作用体现在提出问题、审视假设、理解关系和评价结论，并不能代替资料收集和具体检验。<\/p>\n<p><strong>二、自然科学、人文科学与社会科学方法。<\/strong>自然科学通常重观察、测量、实验与规律检验；人文科学重文本、意义、历史语境和经验理解；社会科学同时研究行为规律、社会结构、制度与行动意义。三者可以互相借鉴：社会科学借鉴自然科学的测量、模型和检验，借鉴人文科学的理解与解释，借鉴哲学的概念辨析和批判反思；研究对象具有能动性和社会性，需要防止把人完全物化为数字。<\/p>\n<p><strong>三、解释学。<\/strong>解释学将言语、文本和行动放入历史、语言及生活情境，理解其意义。解释中的部分与整体相互说明：理解一句话要联系全文，新的局部发现又会修正对全文的理解，这称为解释循环。研究者具有先前知识和经验，需要反思这种“前理解”。意义理解是人文研究的普遍任务，因而解释学具有一般方法意义；解释仍须受文本、史料和语境约束。<\/p>\n<p><strong>四、主体间性。<\/strong>主体间性关注多个主体通过交流、互动和共享规则形成理解。研究者与受访者的关系、身份和提问会影响资料生成，受访者的意义世界也应被认真理解。它推动参与式研究、合作研究、对话式访谈和反身性分析，促使研究者记录自己的立场、互动过程以及权力差异，避免把单方面解释当成唯一事实。<\/p>\n<p><strong>五、主要方法及用途。<\/strong>问卷调查描述分布与变量关系；实验和准实验考察因果机制；深度访谈与民族志理解经验和生活情境；比较与历史研究解释制度差异和变迁；社会网络分析研究关系结构；文本分析分析主题、话语和叙事；计算社会科学利用大规模数字资料与模型研究社会过程；混合方法把量化与质性证据连接起来。选择方法取决于问题、资料和研究条件，工具新颖不等于结论更可靠。数字研究尤其需要处理平台样本偏差、隐私、算法影响与可复核性。<\/p>\n<p><strong>六、科学精神与人文精神的统一。<\/strong>科学精神要求证据、逻辑、透明和可检验，人文精神要求尊重人的处境、尊严、权利和意义。研究学生在线求助，可先用匿名问卷描绘差异，再访谈污名和信任经验，综合检验两类结果是否一致。理论指导变量与机制的选择，经验材料反过来检验和修正理论；知情同意、资料保护和公平呈现贯穿全过程。<\/p>","recall":[{"q":"解释学的“部分与整体往返”是什么意思？","a":"借助整体语境理解某段文本，再用新发现修正对整体的认识；这一过程受原文和证据约束，不是随意解释。"},{"q":"主体间性对访谈有什么提醒？","a":"意义在互动中形成；研究者的提问、身份和关系会影响叙述，需记录和反思这些影响。"}],"related_topics":[],"syllabus_topic":14},{"id":"c501-19","title":"社会科学方法论的原则与七类方法","outline":"专题十四","level":"专题巩固","keywords":["社会科学方法论","实践基础","系统方法","社会主体","认知评价"],"body_html":"<p><strong>先区分原则与工具。<\/strong>马克思主义社会科学方法论为研究社会历史提供一般立场与思考路径，不是一套代替所有学科的固定操作步骤。常用原则可概括为从实际出发、理论联系实践、全面联系、发展地分析、矛盾分析、具体问题具体分析以及尊重人民主体。这些原则通过具体研究设计转化为证据收集与分析。<\/p>\n<p><strong>七类方法及其提问。<\/strong>以实践为基础的研究方法问“问题从何种活动产生、结论怎样检验”；社会系统方法问“结构、要素和环境怎样相互作用”；社会矛盾方法问“哪些矛盾在推动或制约变化”；社会过程方法问“它怎样形成、经过哪些阶段”；社会主体方法问“谁行动、谁受影响、行动受何条件限制”；社会认知与评价方法问“事实是否可靠、根据什么评价”；世界历史方法问“跨地区与国际联系怎样改变过程”。<\/p>\n<p><strong>社会生活为何本质上是实践的。<\/strong>社会关系在人们的生产、交往与制度活动中形成并被再生产，社会历史不是脱离人的客观背景板，也不是观念的单独创造。人的活动受到既有条件制约，同时能改变条件，因而应把客观规律与主体能动性结合。<\/p>\n<p><strong>应用示例。<\/strong>研究社区养老，系统方法关注医疗、家庭、支付与服务网络，主体方法关注老人和照护者的经验，过程方法追踪家庭结构变化，评价方法检验是否真正减轻负担。写作时选择与材料有关的两三种方法深入说明，比把七个名称机械重复更有效。<\/p>","recall":[{"q":"方法论与具体研究方法如何区别？","a":"前者规定分析视角、认识原则和评价前提；后者如访谈、调查、统计承担具体取证与分析，二者互相配合。"}],"related_topics":[],"syllabus_topic":14}],"topics":[{"number":1,"numeral":"一","title":"中国特色社会主义的历史由来、科学内涵","requirements":"1.掌握\n中国特色社会主义的形成过程和理论成果；习近平新时代社会主义思想的丰富内涵和伟大意义。\n2.理解\n中国特色社会主义是由道路、理论体系、制度、文化“四位一体”构成的、“八个明确”“十四个坚持”的重要性及其辩证关系。\n3.运用\n增强对中国特色社会主义的认同、对“四个自信”的行动自觉。"},{"number":2,"numeral":"二","title":"中国特色社会主义进入新时代","requirements":"1.掌握\n党的十八大以来党和国家事业的伟大成就、中国特色社会主义新时代的主要内涵及其重大意义、我国社会主要矛盾的转化及其对党和国家工作提出的新要求。\n2、理解\n我国仍处于并将长期处于社会主义初级阶段的基本国情、“站起来”“富起来”“强起来”三者之间的关系。\n3.运用\n综合运用辩证唯物主义和历史唯物主义、马克思主义矛盾学说、马克思主义时代观等理论的基本观点和方法论认识和分析现实问题。"},{"number":3,"numeral":"三","title":"新时代中国特色社会主义的历史使命","requirements":"1.掌握\n新时代中国特色社会主义发展总任务的科学内涵、提出依据及实现路径、“四个伟大”的科学内涵及其内在关系、新时代中国特色社会主义发展的战略安排及其战略意义。\n2.理解\n中国特色社会主义发展战略安排提出的科学依据。\n3.运用\n培养为全面建成社会主义现代化强国、实现民族复兴中国梦而奋斗的使命感和主动性。"},{"number":4,"numeral":"四","title":"中国特色社会主义经济建设","requirements":"1.掌握\n中国特色经济理论与制度、建设现代化经济体系的内涵与主要任务、深化供给侧结构改革的主要内容和重要意义、完善社会主义市场经济体制。\n2.理解\n我国经济已由高速增长阶段转向高质量发展阶段的原因及其主要特征、推动形成对外开放新格局的重要性和主要内容。\n3.运用\n运用中国特色社会主义政治经济学的理论知识分析经济建设中的问题。"},{"number":5,"numeral":"五","title":"中国特色社会主义政治建设","requirements":"1.掌握\n中国特色社会主义政治理论与制度、中国特色社会主义政治发展道路的必然性及其内涵、中国特色社会主义法治道路的核心要义。\n2.理解\n用制度体系保障人民当家作主的原因及办法。\n3.运用\n增强对中国政治发展的道路自信。"},{"number":6,"numeral":"六","title":"中国特色社会主义文化建设","requirements":"1.掌握\n中国特色社会主义文化理论与制度、文化自信的科学内涵、巩固和发展社会主义意识形态工作的重要性、培育和践行社会主义核心价值观的基本要求及重要意义、认识推动社会主义文化繁荣昌盛的重要意义。\n2.理解\n加快构建中国哲学社会科学的重要性及举措、讲好中国故事提高中国文化软实力的重要意义。\n3.运用\n运用马克思主义文化观分析和阐述当前文化现象，增强对中华优秀传统文化的自主学习和探究能力，提高文化判断和选择能力。"},{"number":7,"numeral":"七","title":"中国特色社会主义社会建设","requirements":"1.掌握\n中国特色社会主义建设理论与制度、在发展中保障和改善民生的原因和主要内容、加强和创新社会治理的原则和措施、总体国家安全观的意义及丰富内涵。\n2. 理解\n增进民生福祉是发展的根本目的、坚决打赢扶贫攻坚战的意义及举措。\n3.运用\n正确认识经济社会发展中存在的一些突出问题、增进对党的路线方针认同。"},{"number":8,"numeral":"八","title":"中国特色社会主义生态文明建设","requirements":"1.掌握\n中国特色社会主义生态文明建设理论与制度、坚持人与自然和谐共生的基本方略、新时代建设美丽中国的主要任务。\n2.理解\n绿水青山就是“金山银山”、建设人与自然共生的现代化、把生态文明建设融入经济建设、政治建设、文化建设、社会建设各方面和全过程。\n3.运用\n树立生态文明理念、培养参与中国特色社会主义生态文明建设的责任感。"},{"number":9,"numeral":"九","title":"坚持和平发展道路与构建人类命运共同体","requirements":"1.掌握\n当今时代主题以及中国同世界关系的历史性变化、中国坚持走和平发展道路的意义、中国特色大国外交对推动构建新型国际关系的作用、构建人类命运共同体的内涵和意义。\n2.理解\n2008年国际金融危机以来世界形势发生的巨大变化及深层原因、“一带一路”建设重要倡议和人类命运共同体构建思想的内在关联。\n3.运用\n客观认识西方治理模式困境及中国特色大国外交的意义。"},{"number":10,"numeral":"十","title":"党对一切工作的领导与从严治党","requirements":"1.掌握\n坚持中国共产党对一切工作的领导的必要性和重要性、新时代党的建设的总要求、推进全面从严治党向纵深发展的战略举措。\n2.理解\n党对一切工作的领导的依据和制度安排。\n3.运用\n增强对党的领导的认同与拥护。"},{"number":11,"numeral":"十一","title":"马克思主义的历史唯物主义立场和解释原则","requirements":"1.掌握\n马克思主义哲学的世界观：历史唯物主义，以及它与辩证唯物主义、实践唯物主义等称谓的关系。\n2.理解\n准确理解马克思和恩格斯基于历史唯物主义的立场与解释原则所确立的唯物辩证的历史观、自然观和科学观等。\n3.运用\n能够用历史唯物主义的立场观点和方法对各种社会思潮进行反思与批判。既善于吸收积极的思想资源，又能深化马克思主义基础理论问题的理解与阐发。"},{"number":12,"numeral":"十二","title":"马克思主义的历史与实践视野","requirements":"1.掌握\n把握马克思主义哲学的哲学观，即现代历史唯物主义和实践唯物主义，这种完备的新唯物主义、合理的唯物主义形态——辩证唯物主义具有历史和实践的理论视野，体现为历史的逻辑和实践的思维方式。\n2.理解\n马克思主义哲学回归现实世界，在社会历史领域借助实践的观点，超越了抽象、思辨的历史哲学，批驳了历史唯心主义和一切旧唯物主义特别是费尔巴哈的半拉截子唯物主义的唯心史观，通过唯物辩证法并在历史科学的基础上，以历史性为基础统一历史主义，遵循逻辑与历史的统一原则，颠覆了黑格尔的历史与逻辑的统一的唯心主义。\n3.应用\n能够运用马克思主义历史的逻辑和实践的思维方式，将历史性与历史主义结合起来，反对单纯的历史主义立场所决定的绝对的历史决定论、历史客观主义、历史怀疑论和历史虚无主义。"},{"number":13,"numeral":"十三","title":"马克思主义的唯物辩证法","requirements":"1.掌握\n要准确把握什么是马克思主义的唯物辩证法，它与黑格尔的唯心主义辩证法的区别与共同之处在那里。要懂得马克思、恩格斯对黑格尔辩证法的唯物主义改造是如何完成的。\n2.理解\n理解马克思、恩格斯通过对黑格尔辩证法及其唯心主义哲学的批判，在唯物主义立场上重新阐发了辩证法，最终确立唯物辩证法，这一辩证法也是实践辩证法、历史辩证法，而且自然辩证法与历史辩证法不是对立的而是统一的关系。\n3.应用\n自觉运用马克思主义的辩证法，用辩证思维方法分析问题、解决问题，克服机械的形而上学的思维方式；同时批驳西方马克思主义者将马克思的历史辩证法与自然辩证法对立起来的做法，促进对中国化马克思主义特别是习近平新时代中国特色社会主义思想的理解与研究。"},{"number":14,"numeral":"十四","title":"人文社会科学的最新研究方法","requirements":"1.掌握\n在现代科学的谱系内掌握自然科学方法、人文科学方法与社会科学方法之间的关系，不仅了解目前有哪些主要的社会科学方法，而且知晓社会科学方法是如何借鉴自然科学方法、人文科学方法和哲学方法的。\n2.理解\n哲学方法是人文社会科学方法的最高方法；哲学方法论是一切方法论中最高方法论；理解主体间性概念对于社会科学方法创新的意义与价值；知晓解释学方法何以成为人文科学的一般方法；明确一些最新的社会科学方法。\n3.应用\n能够利用所学到的最新人文和社会科学方法从事学术研究，同时始终坚持科学精神与人文精神的统一，坚持马克思主义的世界观和方法论，用理论思维指导实证科学研究。"}]}],"coverage":[{"code":"112","requirement":"专题一｜掌握：心理学流派的主要观点及代表人物","card_ids":["c112-01","c112-02","c112-03","c112-04","c112-09","c112-11","c112-14","c112-15","c112-17","c112-18","c112-19","c112-20","c112-23"]},{"code":"112","requirement":"专题一｜理解：流派特点、区别、起源与发展过程","card_ids":["c112-01","c112-02","c112-03","c112-04","c112-08","c112-11","c112-17","c112-18","c112-20","c112-25"]},{"code":"112","requirement":"专题一｜运用：心理学流派的现代进展及趋势","card_ids":["c112-22","c112-23","c "专题二·运用：心理测验编制技术","card_ids":["c312-07","c312-10","c312-11","c312-12"]},{"code":"312","requirement":"专题三·掌握：统计图表","card_ids":["c312-16"]},{"code":"312","requirement":"专题三·掌握：集中量数","card_ids":["c312-17"]},{"code":"312","requirement":"专题三·掌握：差异量数","card_ids":["c312-18"]},{"code":"312","requirement":"专题三·掌握：相对量数与相关量数","card_ids":["c312-19","c312-20"]},{"code":"312","requirement":"专题三·理解：相关分析、方差分析、差异检验等方法的操作","card_ids":["c312-20","c312-21","c312-27","c312-28","c312-29","c312-30","c312-31"]},{"code":"312","requirement":"专题三·运用：综合使用统计方法分析相关研究","card_ids":["c312-32","c312-20","c312-30","c212-23","c212-25","c212-26"]},{"code":"312","requirement":"专题四·掌握：假设检验、参数估计统计原理","card_ids":["c312-22","c312-23","c312-24","c312-25","c312-26"]},{"code":"312","requirement":"专题四·掌握：差异检验及方差分析基本原理","card_ids":["c312-27","c312-28","c312-29","c312-30","c312-31"]},{"code":"312","requirement":"专题四·理解：假设检验、参数估计统计原理","card_ids":["c312-24","c312-25","c312-26"]},{"code":"312","requirement":"专题四·运用：统计原理与统计方法结合","card_ids":["c312-27","c312-28","c312-29","c312-30","c312-31","c312-32"]},{"code":"501","requirement":"专题一｜掌握：中国特色社会主义的形成过程和理论成果；习近平新时代社会主义思想的丰富内涵和伟大意义。","card_ids":["c501-01","c501-16"]},{"code":"501","requirement":"专题一｜理解：中国特色社会主义是由道路、理论体系、制度、文化“四位一体”构成的、“八个明确”“十四个坚持”的重要性及其辩证关系。","card_ids":["c501-01","c501-16"]},{"code":"501","requirement":"专题一｜运用：增强对中国特色社会主义的认同、对“四个自信”的行动自觉。","card_ids":["c501-01","c501-16"]},{"code":"501","requirement":"专题二｜掌握：党的十八大以来党和国家事业的伟大成就、中国特色社会主义新时代的主要内涵及其重大意义、我国社会主要矛盾的转化及其对党和国家工作提出的新要求。","card_ids":["c501-02","c501-13"]},{"code":"501","requirement":"专题二｜理解：我国仍处于并将长期处于社会主义初级阶段的基本国情、“站起来”“富起来”“强起来”三者之间的关系。","card_ids":["c501-02","c501-13"]},{"code":"501","requirement":"专题二｜运用：综合运用辩证唯物主义和历史唯物主义、马克思主义矛盾学说、马克思主义时代观等理论的基本观点和方法论认识和分析现实问题。","card_ids":["c501-02","c501-13"]},{"code":"501","requirement":"专题三｜掌握：新时代中国特色社会主义发展总任务的科学内涵、提出依据及实现路径、“四个伟大”的科学内涵及其内在关系、新时代中国特色社会主义发展的战略安排及其战略意义。","card_ids":["c501-03"]},{"code":"501","requirement":"专题三｜理解：中国特色社会主义发展战略安排提出的科学依据。","card_ids":["c501-03"]},{"code":"501","requirement":"专题三｜运用：培养为全面建成社会主义现代化强国、实现民族复兴中国梦而奋斗的使命感和主动性。","card_ids":["c501-03"]},{"code":"501","requirement":"专题四｜掌握：中国特色经济理论与制度、建设现代化经济体系的内涵与主要任务、深化供给侧结构改革的主要内容和重要意义、完善社会主义市场经济体制。","card_ids":["c501-04","c501-15"]},{"code":"501","requirement":"专题四｜理解：我国经济已由高速增长阶段转向高质量发展阶段的原因及其主要特征、推动形成对外开放新格局的重要性和主要内容。","card_ids":["c501-04","c501-15"]},{"code":"501","requirement":"专题四｜运用：运用中国特色社会主义政治经济学的理论知识分析经济建设中的问题。","card_ids":["c501-04","c501-15"]},{"code":"501","requirement":"专题五｜掌握：中国特色社会主义政治理论与制度、中国特色社会主义政治发展道路的必然性及其内涵、中国特色社会主义法治道路的核心要义。","card_ids":["c501-05"]},{"code":"501","requirement":"专题五｜理解：用制度体系保障人民当家作主的原因及办法。","card_ids":["c501-05"]},{"code":"501","requirement":"专题五｜运用：增强对中国政治发展的道路自信。","card_ids":["c501-05"]},{"code":"501","requirement":"专题六｜掌握：中国特色社会主义文化理论与制度、文化自信的科学内涵、巩固和发展社会主义意识形态工作的重要性、培育和践行社会主义核心价值观的基本要求及重要意义、认识推动社会主义文化繁荣昌盛的重要意义。","card_ids":["c501-06","c501-16"]},{"code":"501","requirement":"专题六｜理解：加快构建中国哲学社会科学的重要性及举措、讲好中国故事提高中国文化软实力的重要意义。","card_ids":["c501-06","c501-16"]},{"code":"501","requirement":"专题六｜运用：运用马克思主义文化观分析和阐述当前文化现象，增强对中华优秀传统文化的自主学习和探究能力，提高文化判断和选择能力。","card_ids":["c501-06","c501-16"]},{"code":"501","requirement":"专题七｜掌握：中国特色社会主义建设理论与制度、在发展中保障和改善民生的原因和主要内容、加强和创新社会治理的原则和措施、总体国家安全观的意义及丰富内涵。","card_ids":["c501-07","c501-16"]},{"code":"501","requirement":"专题七｜理解：增进民生福祉是发展的根本目的、坚决打赢扶贫攻坚战的意义及举措。","card_ids":["c501-07","c501-16"]},{"code":"501","requirement":"专题七｜运用：正确认识经济社会发展中存在的一些突出问题、增进对党的路线方针认同。","card_ids":["c501-07","c501-16"]},{"code":"501","requirement":"专题八｜掌握：中国特色社会主义生态文明建设理论与制度、坚持人与自然和谐共生的基本方略、新时代建设美丽中国的主要任务。","card_ids":["c501-08"]},{"code":"501","requirement":"专题八｜理解：绿水青山就是“金山银山”、建设人与自然共生的现代化、把生态文明建设融入经济建设、政治建设、文化建设、社会建设各方面和全过程。","card_ids":["c501-08"]},{"code":"501","requirement":"专题八｜运用：树立生态文明理念、培养参与中国特色社会主义生态文明建设的责任感。","card_ids":["c501-08"]},{"code":"501","requirement":"专题九｜掌握：当今时代主题以及中国同世界关系的历史性变化、中国坚持走和平发展道路的意义、中国特色大国外交对推动构建新型国际关系的作用、构建人类命运共同体的内涵和意义。","card_ids":["c501-09"]},{"code":"501","requirement":"专题九｜理解：2008年国际金融危机以来世界形势发生的巨大变化及深层原因、“一带一路”建设重要倡议和人类命运共同体构建思想的内在关联。","card_ids":["c501-09"]},{"code":"501","requirement":"专题九｜运用：客观认识西方治理模式困境及中国特色大国外交的意义。","card_ids":["c501-09"]},{"code":"501","requirement":"专题十｜掌握：坚持中国共产党对一切工作的领导的必要性和重要性、新时代党的建设的总要求、推进全面从严治党向纵深发展的战略举措。","card_ids":["c501-10"]},{"code":"501","requirement":"专题十｜理解：党对一切工作的领导的依据和制度安排。","card_ids":["c501-10"]},{"code":"501","requirement":"专题十｜运用：增强对党的领导的认同与拥护。","card_ids":["c501-10"]},{"code":"501","requirement":"专题十一｜掌握：马克思主义哲学的世界观：历史唯物主义，以及它与辩证唯物主义、实践唯物主义等称谓的关系。","card_ids":["c501-11","c501-16","c501-18","c501-19"]},{"code":"501","requirement":"专题十一｜理解：准确理解马克思和恩格斯基于历史唯物主义的立场与解释原则所确立的唯物辩证的历史观、自然观和科学观等。","card_ids":["c501-11","c501-16","c501-18","c501-19"]},{"code":"501","requirement":"专题十一｜运用：能够用历史唯物主义的立场观点和方法对各种社会思潮进行反思与批判。既善于吸收积极的思想资源，又能深化马克思主义基础理论问题的理解与阐发。","card_ids":["c501-11","c501-16","c501-18","c501-19"]},{"code":"501","requirement":"专题十二｜掌握：把握马克思主义哲学的哲学观，即现代历史唯物主义和实践唯物主义，这种完备的新唯物主义、合理的唯物主义形态——辩证唯物主义具有历史和实践的理论视野，体现为历史的逻辑和实践的思维方式。","card_ids":["c501-12","c501-17","c501-20"]},{"code":"501","requirement":"专题十二｜理解：马克思主义哲学回归现实世界，在社会历史领域借助实践的观点，超越了抽象、思辨的历史哲学，批驳了历史唯心主义和一切旧唯物主义特别是费尔巴哈的半拉截子唯物主义的唯心史观，通过唯物辩证法并在历史科学的基础上，以历史性为基础统一历史主义，遵循逻辑与历史的统一原则，颠覆了黑格尔的历史与逻辑的统一的唯心主义。","card_ids":["c501-12","c501-17","c501-20"]},{"code":"501","requirement":"专题十二｜应用：能够运用马克思主义历史的逻辑和实践的思维方式，将历史性与历史主义结合起来，反对单纯的历史主义立场所决定的绝对的历史决定论、历史客观主义、历史怀疑论和历史虚无主义。","card_ids":["c501-12","c501-17","c501-20"]},{"code":"501","requirement":"专题十三｜掌握：要准确把握什么是马克思主义的唯物辩证法，它与黑格尔的唯心主义辩证法的区别与共同之处在那里。要懂得马克思、恩格斯对黑格尔辩证法的唯物主义改造是如何完成的。","card_ids":["c501-13","c501-18","c501-20"]},{"code":"501","requirement":"专题十三｜理解：理解马克思、恩格斯通过对黑格尔辩证法及其唯心主义哲学的批判，在唯物主义立场上重新阐发了辩证法，最终确立唯物辩证法，这一辩证法也是实践辩证法、历史辩证法，而且自然辩证法与历史辩证法不是对立的而是统一的关系。","card_ids":["c501-13","c501-18","c501-20"]},{"code":"501","requirement":"专题十三｜应用：自觉运用马克思主义的辩证法，用辩证思维方法分析问题、解决问题，克服机械的形而上学的思维方式；同时批驳西方马克思主义者将马克思的历史辩证法与自然辩证法对立起来的做法，促进对中国化马克思主义特别是习近平新时代中国特色社会主义思想的理解与研究。","card_ids":["c501-13","c501-18","c501-20"]},{"code":"501","requirement":"专题十四｜掌握：在现代科学的谱系内掌握自然科学方法、人文科学方法与社会科学方法之间的关系，不仅了解目前有哪些主要的社会科学方法，而且知晓社会科学方法是如何借鉴自然科学方法、人文科学方法和哲学方法的。","card_ids":["c501-14","c501-19"]},{"code":"501","requirement":"专题十四｜理解：哲学方法是人文社会科学方法的最高方法；哲学方法论是一切方法论中最高方法论；理解主体间性概念对于社会科学方法创新的意义与价值；知晓解释学方法何以成为人文科学的一般方法；明确一些最新的社会科学方法。","card_ids":["c501-14","c501-19"]},{"code":"501","requirement":"专题十四｜应用：能够利用所学到的最新人文和社会科学方法从事学术研究，同时始终坚持科学精神与人文精神的统一，坚持马克思主义的世界观和方法论，用理论思维指导实证科学研究。","card_ids":["c501-14","c501-19"]}],"scopes":[{"id":"S005","code":"112","title":"心理学理论与流派","text":"《心理学理论与流派》考试范围\n考查目的\n《心理学理论与流派》作为应用心理学专业的核心学位课程，主要侧重于考查学生对心理学理论流派的理解和掌握程度，以及对心理学发展过程的熟悉程度。\n\n考查要求\n专题一、心理学流派\n掌握\n心理学流派的主要观点（包括行为主义、精神分析、人本主义等），心理学流派的代表人物及其观点\n理解\n心理学各个流派的特点，流派间的区别，流派的起源与发展过程\n运用\n心理学流派的现代进展及趋势\n专题二、心理学理论\n掌握\n各个流派中的重点理论内容及其提出者\n理解\n相关理论间的区别\n运用\n各个理论在现实生活中的运用"},{"id":"S006","code":"212","title":"心理学研究方法","text":"《心理学研究方法》考试范围\n考查目的\n《心理学研究方法》作为应用心理学专业的核心学位课程，主要侧重于考查学生对心理学研究设计的基础概念、方法类别和设计思路等几个重要而基础的研究方法的掌握、理解与运用情况。\n\n考查要求\n专题一、心理学实验设计的基础概念\n掌握\n研究设计的信度和效度，变量的分类，操作定义的界定\n理解\n信效度的关系，操作定义的特征\n运用\n对控制变量的处理\n专题二、方法类别和设计思路\n掌握\n研究方法的分类和适用范围，实验设计的基本概念，实验设计的分类\n理解\n不同研究方法的特点和区别，不同实验设计的特点和区别\n运用\n根据不同的条件，灵活使用不同的研究方法进行具体的研究设计"},{"id":"S007","code":"312","title":"心理测量与统计","text":"《心理测量与统计》考试范围\n考查目的\n《心理测量与统计》作为应用心理学专业的核心学位课程，主要侧重于考查学生对心理测量原理、心理测量的实际应用及心理学常用的统计方法及其原理的掌握、理解与运用情况。\n\n考查要求\n专题一、心理测量原理\n掌握\n心理测量的基本概念、心理测量的特征与分类、心理测量的产生与发展、心理测量的误差、信度、效度等概念\n理解\n    项目反应理论与概化理论\n运用\n经典测量理论模型、项目分析的运用\n专题二、心理测量的实际应用\n1.掌握\n常用的心理测验，如成就测验、智力测验、能力倾向测验及人格测验等\n2.理解\n心理测验的施测、测验标准的制定\n3.运用\n心理测验的编制技术运用\n专题三、常用的统计方法\n1.掌握\n统计图表、集中量数、差异量数、相对量数与相关量数\n2.理解\n相关分析、方差分析、差异检验等分析方法的操作\n3.运用\n综合使用统计分析方法对相关研究进行分析\n专题四、统计原理\n1.掌握\n假设检验、参数估计的统计学原理，差异检验及方差分析等的基本原理\n2.理解\n假设检验、参数估计的统计学原理\n3.运用\n统计原理与统计方法的结合"},{"id":"S008","code":"412","title":"人格与社会心理学","text":"《人格与社会心理学》考试范围\n考查目的\n《人格与社会心理学》作为应用心理学专业的核心学位课程，主要侧重于考查学生对人格心理学，社会心理学现象及其应用的掌握、理解与运用情况。\n\n考查要求\n专题一、人格心理学\n掌握\n人格的定义、各流派（精神分析流派、特质流派、生物学取向、人本主义流派、行为主义流派及认知主义流派）的人格观点\n理解\n各流派人格观点的区别与关系\n运用\n各流派人格理论在现实生活中的运用\n专题二、社会心理学\n1.掌握\n    社会心理学的常见现象及其理论解释，如社会化过程、归因方式、社会知觉、社会态度；社会关系：友情、爱情；社会影响：服从、顺从、群体极化等\n2.理解\n    印象的形成过程、个体如何受到社会的影响\n3.运用\n使用社会心理学的理论解释社会现象"},{"id":"S009","code":"501","title":"思想政治理论","text":"《思想政治理论》考试范围\n二、考查要求\n专题一、中国特色社会主义的历史由来、科学内涵\n1.掌握\n中国特色社会主义的形成过程和理论成果；习近平新时代社会主义思想的丰富内涵和伟大意义。\n2.理解\n中国特色社会主义是由道路、理论体系、制度、文化“四位一体”构成的、“八个明确”“十四个坚持”的重要性及其辩证关系。\n3.运用\n增强对中国特色社会主义的认同、对“四个自信”的行动自觉。\n专题二、中国特色社会主义进入新时代\n1.掌握\n党的十八大以来党和国家事业的伟大成就、中国特色社会主义新时代的主要内涵及其重大意义、我国社会主要矛盾的转化及其对党和国家工作提出的新要求。\n2、理解\n我国仍处于并将长期处于社会主义初级阶段的基本国情、“站起来”“富起来”“强起来”三者之间的关系。\n3.运用\n综合运用辩证唯物主义和历史唯物主义、马克思主义矛盾学说、马克思主义时代观等理论的基本观点和方法论认识和分析现实问题。\n专题三、新时代中国特色社会主义的历史使命\n1.掌握\n新时代中国特色社会主义发展总任务的科学内涵、提出依据及实现路径、“四个伟大”的科学内涵及其内在关系、新时代中国特色社会主义发展的战略安排及其战略意义。\n2.理解\n中国特色社会主义发展战略安排提出的科学依据。\n3.运用\n培养为全面建成社会主义现代化强国、实现民族复兴中国梦而奋斗的使命感和主动性。\n专题四、中国特色社会主义经济建设\n1.掌握\n中国特色经济理论与制度、建设现代化经济体系的内涵与主要任务、深化供给侧结构改革的主要内容和重要意义、完善社会主义市场经济体制。\n2.理解\n我国经济已由高速增长阶段转向高质量发展阶段的原因及其主要特征、推动形成对外开放新格局的重要性和主要内容。\n3.运用\n运用中国特色社会主义政治经济学的理论知识分析经济建设中的问题。\n专题五、中国特色社会主义政治建设\n1.掌握\n中国特色社会主义政治理论与制度、中国特色社会主义政治发展道路的必然性及其内涵、中国特色社会主义法治道路的核心要义。\n2.理解\n用制度体系保障人民当家作主的原因及办法。\n3.运用\n增强对中国政治发展的道路自信。\n专题六、中国特色社会主义文化建设\n1.掌握\n中国特色社会主义文化理论与制度、文化自信的科学内涵、巩固和发展社会主义意识形态工作的重要性、培育和践行社会主义核心价值观的基本要求及重要意义、认识推动社会主义文化繁荣昌盛的重要意义。\n2.理解\n加快构建中国哲学社会科学的重要性及举措、讲好中国故事提高中国文化软实力的重要意义。\n3.运用\n运用马克思主义文化观分析和阐述当前文化现象，增强对中华优秀传统文化的自主学习和探究能力，提高文化判断和选择能力。\n专题七、中国特色社会主义社会建设\n1.掌握\n中国特色社会主义建设理论与制度、在发展中保障和改善民生的原因和主要内容、加强和创新社会治理的原则和措施、总体国家安全观的意义及丰富内涵。\n2. 理解\n增进民生福祉是发展的根本目的、坚决打赢扶贫攻坚战的意义及举措。\n3.运用\n正确认识经济社会发展中存在的一些突出问题、增进对党的路线方针认同。\n专题八、中国特色社会主义生态文明建设\n1.掌握\n中国特色社会主义生态文明建设理论与制度、坚持人与自然和谐共生的基本方略、新时代建设美丽中国的主要任务。\n2.理解\n绿水青山就是“金山银山”、建设人与自然共生的现代化、把生态文明建设融入经济建设、政治建设、文化建设、社会建设各方面和全过程。\n3.运用\n树立生态文明理念、培养参与中国特色社会主义生态文明建设的责任感。\n专题九、坚持和平发展道路与构建人类命运共同体\n1.掌握\n当今时代主题以及中国同世界关系的历史性变化、中国坚持走和平发展道路的意义、中国特色大国外交对推动构建新型国际关系的作用、构建人类命运共同体的内涵和意义。\n2.理解\n2008年国际金融危机以来世界形势发生的巨大变化及深层原因、“一带一路”建设重要倡议和人类命运共同体构建思想的内在关联。\n3.运用\n客观认识西方治理模式困境及中国特色大国外交的意义。\n专题十、党对一切工作的领导与从严治党\n1.掌握\n坚持中国共产党对一切工作的领导的必要性和重要性、新时代党的建设的总要求、推进全面从严治党向纵深发展的战略举措。\n2.理解\n党对一切工作的领导的依据和制度安排。\n3.运用\n增强对党的领导的认同与拥护。\n\f\n以下对应考察目的（二），即《马克思主义与社会科学方法论》研究生公共课程的考核。\n专题十一、马克思主义的历史唯物主义立场和解释原则\n1.掌握\n马克思主义哲学的世界观：历史唯物主义，以及它与辩证唯物主义、实践唯物主义等称谓的关系。\n2.理解\n准确理解马克思和恩格斯基于历史唯物主义的立场与解释原则所确立的唯物辩证的历史观、自然观和科学观等。\n3.运用\n能够用历史唯物主义的立场观点和方法对各种社会思潮进行反思与批判。既善于吸收积极的思想资源，又能深化马克思主义基础理论问题的理解与阐发。\n专题十二、马克思主义的历史与实践视野\n1.掌握\n把握马克思主义哲学的哲学观，即现代历史唯物主义和实践唯物主义，这种完备的新唯物主义、合理的唯物主义形态——辩证唯物主义具有历史和实践的理论视野，体现为历史的逻辑和实践的思维方式。\n2.理解\n马克思主义哲学回归现实世界，在社会历史领域借助实践的观点，超越了抽象、思辨的历史哲学，批驳了历史唯心主义和一切旧唯物主义特别是费尔巴哈的半拉截子唯物主义的唯心史观，通过唯物辩证法并在历史科学的基础上，以历史性为基础统一历史主义，遵循逻辑与历史的统一原则，颠覆了黑格尔的历史与逻辑的统一的唯心主义。\n3.应用\n能够运用马克思主义历史的逻辑和实践的思维方式，将历史性与历史主义结合起来，反对单纯的历史主义立场所决定的绝对的历史决定论、历史客观主义、历史怀疑论和历史虚无主义。\n专题十三、马克思主义的唯物辩证法\n1.掌握\n要准确把握什么是马克思主义的唯物辩证法，它与黑格尔的唯心主义辩证法的区别与共同之处在那里。要懂得马克思、恩格斯对黑格尔辩证法的唯物主义改造是如何完成的。\n2.理解\n理解马克思、恩格斯通过对黑格尔辩证法及其唯心主义哲学的批判，在唯物主义立场上重新阐发了辩证法，最终确立唯物辩证法，这一辩证法也是实践辩证法、历史辩证法，而且自然辩证法与历史辩证法不是对立的而是统一的关系。\n3.应用\n自觉运用马克思主义的辩证法，用辩证思维方法分析问题、解决问题，克服机械的形而上学的思维方式；同时批驳西方马克思主义者将马克思的历史辩证法与自然辩证法对立起来的做法，促进对中国化马克思主义特别是习近平新时代中国特色社会主义思想的理解与研究。\n专题十四、人文社会科学的最新研究方法\n1.掌握\n在现代科学的谱系内掌握自然科学方法、人文科学方法与社会科学方法之间的关系，不仅了解目前有哪些主要的社会科学方法，而且知晓社会科学方法是如何借鉴自然科学方法、人文科学方法和哲学方法的。\n2.理解\n哲学方法是人文社会科学方法的最高方法；哲学方法论是一切方法论中最高方法论；理解主体间性概念对于社会科学方法创新的意义与价值；知晓解释学方法何以成为人文科学的一般方法；明确一些最新的社会科学方法。\n3.应用\n能够利用所学到的最新人文和社会科学方法从事学术研究，同时始终坚持科学精神与人文精神的统一，坚持马克思主义的世界观和方法论，用理论思维指导实证科学研究。"}],"sources":[],"exams":{"sources":[{"id":"exam_202411","title":"2024年11月校考题目.docx","date":"2024-11","kind":"考生回忆题主档","relative_path":"同等学力心理学学习资料/040203 应用心理学校考资料/2024年11月校考题目.docx","text":"心理学理论与流派\n简答：1、早期行为主义的观点及评价。2、古典精神分析理论的观点及评价。3、人本主义的观点及评价。4、简述经典条件反射。论述：1、论述班杜拉的社会学习理论。2、埃里克森自我发展心理学的主要内容。\n\n人格与社会心理学\n简答：1、简述佛洛依德的自我防御机制理论。2、简述荣格的原型理论。3、基本归因偏差。4、简述去个性化。论述题：1、论述从众的定义及影响因素。2、群体极化，使用生活中的例子说明其形成和影响因素。\n\n心理学研究方法\n简答：\n1、系统随机取样法（等距抽样）及优缺点。\n2、心理实验中的自变量类型有哪些？\n3、研究报告包括哪些内容？\n4、准实验设计特点及优缺点。\n论述：\n1、额外变量的控制主要有哪些方法，简要阐述。\n2、有人认为，驾驶过程中听音乐有助于驾驶员保持注意力，减少交通事故；有人则认为，驾驶过程中听音乐可能会干扰驾驶员的注意力，增加交通事故。某研究者认为，在探讨听音乐与注意力水平、交通事故之间的关系时，应考虑驾驶员的类别(大客车驾驶员、货车驾驶员、斩车驾驶员),驾龄(5年、10年、20年)以及所听音乐类型(据滚乐、轻音乐、民乐)等因素。若该研究者想通过情景模报实验来检验自己的上述看法，请回答：\n(1)实验中要操纵的白变量有哪些?哪些自变量应该作为组间变量?哪些可以作为组内变量?\n(2)因变量是什么?具体测量指标可以有哪些?\n\n\n\n\n\n政治\n简答：\n1、什么是新质生产力？\n2、描述学习过的辩证思维方法中的任何一种，如归纳与演绎，分析与综合。\n3、实践对认识的决定作用表现在哪些方面？\n4、文明形态的基本内涵。\n论述：\n1、习……，如何实现理论创新和实践创新的良性互动。\n2、恩格斯：……以上与经济基础的相互作用，文化在社会发展中的作用。","notes":["2024年11月四科24道大题；未见心理测量与统计题目，不能补作该科真题。","政治两道论述的材料以省略号呈现；保留原文。","源文存在“佛洛依德”“斩车”“据滚乐”“情景模报”“白变量”等笔误，原题照录。"],"questions":[{"id":"exam_202411-q001","subject":"心理学理论与流派","subject_code":"112","date":"2024-11","type":"简答题","text":"1、早期行为主义的观点及评价。","answer":"","answer_status":"原文件未附标准答案","topic":"行为主义","points":null,"is_missing":false,"notes":"","canonical":true,"exam_primary":true,"primary_question_id":"exam_202411-q001","duplicate_source_ids":["exam_compare_202411_202506","exam_embedded_docx","exam_embedded_pdf"],"missing":false,"card_ids":["c112-04"]},{"id":"exam_202411-q002","subject":"心理学理论与流派","subject_code":"112","date":"2024-11","type":"简答题","text":"2、古典精神分析理论的观点及评价。","answer":"","answer_status":"原文件未附标准答案","topic":"精神分析","points":null,"is_missing":false,"notes":"","canonical":true,"exam_primary":true,"primary_question_id":"exam_202411-q002","duplicate_source_ids":["exam_compare_202411_202506","exam_embedded_docx","exam_embedded_pdf"],"missing":false,"card_ids":["c112-11","c112-12","c112-13"]},{"id":"exam_202411-q003","subject":"心理学理论与流派","subject_code":"112","date":"2024-11","type":"简答题","text":"3、人本主义的观点及评价。","answer":"","answer_status":"原文件未附标准答案","topic":"人本主义","points":null,"is_missing":false,"notes":"","canonical":true,"exam_primary":true,"primary_question_id":"exam_202411-q003","duplicate_source_ids":["exam_compare_202411_202506","exam_embedded_docx","exam_embedded_pdf"],"missing":false,"card_ids":["c112-18","c112-19"]},{"id":"exam_202411-q004","subject":"心理学理论与流派","subject_code":"112","date":"2024-11","type":"简答题","text":"4、简述经典条件反射。","answer":"","answer_status":"原文件未附标准答案","topic":"经典条件作用","points":null,"is_missing":false,"notes":"","canonical":t 素 \n2.群体思维及危害 \n3.社会惰化及表现 \n4.刻板印象及其特点 \n论述 \n1.纬纳三维归因案例，小明，成绩好，认为自己努力目能力强，小红成结差，认为\n题目难度，和运气不好(当天身体不舒服)。 \na.根据三维理论分析小红，小明的归因当时，是内外，可控不可控，稳定不稳定 \nb.韦纳认为归因方式会影响情绪，动机，行为。通过二人的归因方式预测他们未\n来学习的情况 \nc.你是老师怎么帮助小红调整归因增加积极性 \n2.认知失调理论概念，应用，以及减少认知失调的策略 \n五、政治 \n简答 \n1.简述马克思主义社会科学方法论 \n2.简述历史的前进性和曲折性的关系 \n3.简述逻辑与历史的统一 \n4.中国特色社会主义新时代内涵 \n论述 \n1.人民群众是创造历史的决定力量 \n2.我国当前的主要矛盾发生了变化(美好生活和不平衡不充分)。论述社会的基本矛\n盾和主要矛盾推动历史结合材料说明如何运用主要矛盾的原理指导中国特色社会主义\n实践 ","notes":["两页PDF，已逐页核验原图；五科各4道简答、2道论述，共30道大题。","正文无评分标准及分值；保留“有缺点”“纬纳”等原文笔误；小问并入所属大题。"],"questions":[{"id":"exam_202506-q001","subject":"心理学理论与流派","subject_code":"112","date":"2025-06","type":"简答题","text":"1.正强化负强化","answer":"","answer_status":"原文件未附标准答案","topic":"强化与惩罚","points":null,"is_missing":false,"notes":"","canonical":true,"exam_primary":true,"primary_question_id":"exam_202506-q001","duplicate_source_ids":[],"missing":false,"card_ids":["c112-07"]},{"id":"exam_202506-q002","subject":"心理学理论与流派","subject_code":"112","date":"2025-06","type":"简答题","text":"2.进化心理学的基本假设","answer":"","answer_status":"原文件未附标准答案","topic":"进化心理学","points":null,"is_missing":false,"notes":"","canonical":true,"exam_primary":true,"primary_question_id":"exam_202506-q002","duplicate_source_ids":[],"missing":false,"card_ids":["c112-23"]},{"id":"exam_202506-q003","subject":"心理学理论与流派","subject_code":"112","date":"2025-06","type":"简答题","text":"3.简述认知心理学的基本观点和评价","answer":"","answer_status":"原文件未附标准答案","topic":"认知心理学","points":null,"is_missing":false,"notes":"","canonical":true,"exam_primary":true,"primary_question_id":"exam_202506-q003","duplicate_source_ids":[],"missing":false,"card_ids":["c112-20"]},{"id":"exam_202506-q004","subject":"心理学理论与流派","subject_code":"112","date":"2025-06","type":"简答题","text":"4.班杜拉观察学习","answer":"","answer_status":"原文件未附标准答案","topic":"班杜拉社会学习理论","points":null,"is_missing":false,"notes":"","canonical":true,"exam_primary":true,"primary_question_id":"exam_202506-q004","duplicate_source_ids":[],"missing":false,"card_ids":["c112-09"]},{"id":"e 活和不平衡不充分)。论述社会的基本矛\n盾和主要矛盾推动历史结合材料说明如何运用主要矛盾的原理指导中国特色社会主义\n实践","answer":"","answer_status":"原文件未附标准答案","topic":"实践与认识","points":null,"is_missing":false,"notes":"","canonical":true,"exam_primary":true,"primary_question_id":"exam_202506-q030","duplicate_source_ids":["exam_compare_202411_202506"],"missing":false,"card_ids":["c501-02","c501-13"]}],"canonical":true,"exam_primary":true,"sha256":"c55b3b62d5e5940e6e991af294d8afa2473e52190fbbd9e216cb15ad52191e7e","primary":true,"appendix":""},{"id":"exam_202511","title":"2025年11月校考机经（梦瑶等记忆版）.docx","date":"2025-11","kind":"考生回忆题主档","relative_path":"同等学力心理学学习资料/040203 应用心理学校考资料/2025年11月校考机经（梦瑶等记忆版）.docx","text":"2025年11月校考机经\n心理学理论流派25.11.22\n简答题\n1.简述格式塔心理学的知觉组织原则\n2.心理动力学理论及其核心观点？\n3.简述人本主义心理学和行为主义的根本分歧\n4.简述主要的自我防御机制\n\n论述题\n1.论述认知神经科学的研究方法，研究成果以及应用\n2.论述阿德勒的个体心理学，并结合自身经历评价\n\n心理学研究方法25.11.22\n简答题\n1.简述观察法的缺点\n2.什么是时间序列设计\n3.多因素实验设计的优缺点\n4.什么是实验内部效度\n\n论述题\n1.什么是混合设计？以大学生攻击行为为因变量，设计一个混合设计研究\n2.围绕大学生社交媒体使用时间和心理健康水平，通过发放问卷的非实验研究形式，有3个小问题：\n1️⃣这是什么实验方法，有什么特点\n2️⃣有哪些混淆变量，列举至少3个并说明如何控制变量\n3️⃣如果问卷结果为负相关，是否可以得出结论，为什么？\n\n心理测量与统计\n一、简答\n1.分层随机抽样的适用范围和优缺点\n2.区分度和难度的关系\n3.什么是区间估计\n4.什么是标准差\n二、论述\n1.常模参照测验和标准参照测验的异同\n2.编制人格测验的基本程序\n\n人格与社会心理学25.11.22\n简答题\n1.简述斯滕伯格的爱情三元理论\n2.简述服从的影响因素有哪些\n3.弗洛伊德的人格结构理论\n4.简述社会交换理论\n\n论述题\n1.论述态度改变的说服理论，举例其市场营销和广告宣传中的应用\n2.刘某贪腐被调查，他百般抵赖辩解说是被冤枉的，又说是碍于人情所迫，最后说目前社会情形不得不这么做…\n1️⃣论述凯利归因理论，结合案例分析刘某的归因与这个归因理论\n2️⃣结合凯利归因理论，什么样的条件才能让刘某改变归因方式\n（最后这个案例题我有点记不清了，等待大家更正补充哈）\n\n思想政治理论25.11.23\n简答\n1.马克思主义社会科学方法论的基本原则\n2.为什么说社会生活在本质上是实践的？\n3.如何理解人民利益是社会评价的最高标准。\n4.为什么要把发展经济的着力点放在实体经济上\n\n论述\n1.一段5G人工智能相关的材料\n1️⃣阐述物质与意识的辩证关系\n2️⃣结合材料谈谈对人工智能与人类意识关系的理解\n\n2.一段总书记关于民族自信的发言\n阐述坚持四个自信（道路自信，理论自信，制度自信，文化自信）的主要内容","notes":["四门专业课题头记25.11.22，思想政治理论题头记25.11.23；五科30道大题。","人格与社会心理学最后的刘某案例，作者明确表示记不清、待更正，非完整确认版。","政治论述材料仅作概要描述；研究方法第二道论述的第三小问未明确“得出”的具体结论，不能擅自补回原题。"],"questions":[{"id":"exam_202511-q001","subject":"心理学理论与流派","subject_code":"112","date":"2025-11","type":"简答题","text":"1.简述格式塔心理学的知觉组织原则","answer":"","answer_status":"原文件未 会价值\n‌Specific Performance（特定履行）‌：一种‌衡平法救济‌方式。当金钱赔偿不足以弥补损失时（如土地买卖、稀有物品），法院命令违约方实际履行合同义务，而非仅支付赔偿金 。\n‌Social Equity（社会公平/社会正义）‌：非严格法律技术术语，在法学语境中常指法律适用需兼顾‌社会公共利益‌与实质公平。它影响法官行使自由裁量权（如判断是否授予特定履行），确保合同执行不违背公序良俗或造成显著不公 。‌‌\n注：前三个是合同‌成立‌的基础要件，后两个涉及合同‌违约后的救济‌及法律背后的价值导向。"},{"id":"exam_compare_202411_202506","title":"2024年11月及2025年6月校考题目.docx","date":"2024-11 / 2025-06","kind":"同题异源对照档","relative_path":"同等学力心理学学习资料/学习交流活动/20250724-班级交流活动第一期-校考分享会/2024年11月及2025年6月校考题目.docx","text":"心理学理论与流派｜2024年11月考题\n\n简答\n\n1、早期行为主义的观点及评价。\n\n2、古典精神分析理论的观点及评价。\n\n3、人本主义的观点及评价。\n\n4、简述经典条件反射。\n\n论述\n\n1、论述班杜拉的社会学习理论。\n\n2、埃里克森自我发展心理学的主要内容。\n\n心理学理论与流派｜2025年6月考题\n\n简答\n\n1、简述正强化和负强化并各举一例。\n\n2、简述进化心理学的基本假设。\n\n3、简述认知心理学的基本观点及评价。\n\n4、 简述班杜拉社会学习理论的关键过程。\n\n论述\n\n1、论述集体无意识，核心内容是什么。\n\n2、分析比较精神分析学派和行为主义学派。\n\n人格与社会心理学｜2024年11月考题\n\n简答\n\n1、简述佛洛依德的自我防御机制理论。\n\n2、简述荣格的原型理论。\n\n3、基本归因偏差。\n\n4、简述去个性化。\n\n论述\n\n1、论述从众的定义及影响因素。\n\n2、群体极化，使用生活中的例子说明其形成和影响因素。\n\n人格与社会心理学｜2025年6月考题\n\n简答\n\n1、 简述大五人格的五因素。\n\n2、 简述群体思维及危害。\n\n3、简述社会惰化及表现。\n\n4、 简述刻板印象及其特点。\n\n论述\n\n1、 韦纳三维归因案例，小明：成绩好，认为自己努力且能力强；\n小红：成绩差，认为题目难和运气不好（当天身体不舒服）。\n根据三维理论分析小红和小明的归因，是内外、可控不可控、稳定不稳定。\n韦纳认为归因方式会影响情绪、动机、行为。通过二人的归因方式预测他们未来学习的情况。\n假设你是老师，怎么帮助小红调整归因增加积极性。\n\n2、论述认知失调理论的概念、应用，以及减少认知失调的策略。\n\n心理学研究方法｜2024年11月考题\n\n简答\n\n1、系统随机取样法（等距抽样）及优缺点。\n\n2、心理实验中的自变量类型有哪些？\n\n3、研究报告包括哪些内容？\n\n4、准实验设计特点及优缺点。\n\n论述\n\n1、额外变量的控制主要有哪些方法，简要阐述。\n\n2、有人认为，驾驶过程中听音乐有助于驾驶员保持注意力，减少交通事故；有人则认为，驾驶过程中听音乐可能会干扰驾驶员的注意力，增加交通事故。某研究者认为，在探讨听音乐与注意力水平、交通事故之间的关系时，应考虑驾驶员的类别(大客车驾驶员、货车驾驶员、斩车驾驶员),驾龄(5年、10年、20年)以及所听音乐类型(据滚乐、轻音乐、民乐)等因素。若该研究者想通过情景模报实验来检验自己的上述看法，请回答：\n(1)实验中要操纵的白变量有哪些?哪些自变量应该作为组间变量?哪些可以作为组内变量?\n(2)因变量是什么?具体测量指标可以有哪些?\n\n心理学研究方法｜2025年6月考题\n\n简答\n\n1、 问卷法的有点\n\n2、 心理学研究的伦理性原则\n\n3、 访谈法的有点\n\n4、 简述影响外部效度的因素\n\n论述\n\n1、 提供一个研究设计，研究不同教学方法（三种水平）对不同科目（语数外）成绩的影响。\n\n2、 一个研究设计，研究主题“正念对焦虑水平的影响”，研究假设正念能显著降低个体焦虑水平。实验招募60个大学生，分两组，一组实验组进行四周正念训练，一组什么也不做，进行焦虑水平前后测，用独立样本t检验。\n（1）该研究设计的混淆变量有什么，列举并指出如何控制；\n（2）该研究设计的内部效度会受到哪些威胁，列举至少三种并提出建议；\n（3）如果提高研究的外部效度；\n（4）提出一个优化方案，考虑可行性\n\n心理测量与统计｜2024年11月考题\n\n简答\n\n【原表空单元格】\n\n【原表空单元格】\n\n【原表空单元格】\n\n【原表空单元格】\n\n论述\n\n【原表空单元格】\n\n【原表空单元格】\n\n心理测量与统计｜2025年6月考题\n\n简答\n\n1、假设检验的基本步骤\n\n2、方差分析的条件\n\n3、简述变异系数及应用\n\n4、问卷说明书的基本内容\n\n论述\n\n1、论述自陈量表和投射测验在人格测验上的优缺点，并举例说明\n\n2、问卷测量的程序及注意事项\n\n思想政治理论｜2024年11月考题\n\n简答\n\n1、什么是新质生产力？\n\n2、描述学习过的辩证思维方法中的任何一种，如归纳与演绎，分析与综合。\n\n3、实践对认识的决定作用表现在哪些方面？\n\n4、文明形态的基本内涵。\n\n论述\n\n1、习……，如何实现理论创新和实践创新的良性互动。\n\n2、恩格斯：……以上与经济基础的相互作用，文化在社会发展中的作用。\n\n思想政治理论｜2025年6月考题\n\n简答\n\n1、简述马克思主义社会科学方法论\n\n2、 简述历史的前进性与曲折性的关系\n\n3、简述逻辑与历史的统一\n\n4、中国特殊社会主义新时代的内涵\n\n论述\n\n1、 人民群众是创造历史的决定力量。\n\n2、我国当前的主要矛盾发生了变化（美好生活和不平衡不充分）。论述社会的基本矛盾和主要矛盾推动历史，结合材料说明如何运用主要矛盾的原理指导中国特色社会主义实践。","notes":["原文件为左右两列对照表。2024年11月24道、2025年6月30道，共54道；2024年统计测量列为空，未造题。","以下原题全文按“科目—年份”顺序重排，保留每个非空单元格原文；原始表格XML已逐行核对。","2025年6月版出现“有点”“如果提高”“中国特殊社会主义”等原文笔误，原题照录。"],"questions":[{"id":"exam_compare_202411_202506-q001","subject":"心理学理论与流派","subject_code":"112","date":"2024-11","type":"简答题","text":"1、早期行为主义的观点及评价。","answer":"","answer_status":"原文件未附标准答案","topic":"行为主义","points":null,"is_missing":false,"notes":"","canonical":false,"exam_primary":false,"primary_question_id":"exam_202411-q001","duplicate_source_ids":["exam_202411","exam_embedded_docx","exam_embedded_pdf"],"missing":false,"card_ids":["c112-04"]},{"id":"exam_compare_202411_202506-q002","subject":"心理学理论与流派","subject_code":"112","date":"2024-11","type":"简答题","text":"2、古典精神分析理论的观点及评价。","answer":"","answer_status":"原文件未附标准答案","topic":"精神分析","points":null,"is_missing":false,"notes":"","canonical":false,"exam_primary":false,"primary_question_id":"exam_202411-q002","duplicate_source_ids":["exam_202411","exam_embedded_docx","exam_embedded_pdf"],"missing":false,"card_ids":["c112-11","c112-12","c112-13"]},{"id":"exam_compare_202411_202506-q003","subject":"心理学理论与流派","subject_code":"112","date":"2024-11","type":"简答题","text":"3、人本主义的观点及评价。","answer":"","answer_status":"原文件未附标准答案","topic":"人本主义","points":null,"is_missing":false,"notes":"","canonical":false,"exam_primary":false,"primary_q 评价。2、古典精神分析理论的观点及评价。3、人本主义的观点及评价。4、简述经典条件反射。论述：1、论述班杜拉的社会学习理论。2、埃里克森自我发展心理学的主要内容。\n\n人格与社会心理学\n小米提供机经（24年11月考试题）\n简答：\n 1、简述佛洛依德的自我防御机制理论。 \n2、简述荣格的原型理论。 \n3、基本归因偏差。 \n4、简述去个性化。 \n论述题：\n 1、论述从众的定义及影响因素。\n 2、群体极化，使用生活中的例子说明其形成和影响因素。\n\n心理学研究方法\n小米提供机经（24年11月考试题）\n简答：\n1、系统随机取样法（等距抽样）及优缺点。\n2、心理实验中的自变量类型有哪些？\n3、研究报告包括哪些内容？\n4、准实验设计特点及优缺点。\n论述：\n1、额外变量的控制主要有哪些方法，简要阐述。\n2、有人认为，驾驶过程中听音乐有助于驾驶员保持注意力，减少交通事故；有人则认为，驾驶过程中听音乐可能会干扰驾驶员的注意力，增加交通事故。某研究者认为，在探讨听音乐与注意力水平、交通事故之间的关系时，应考虑驾驶员的类别(大客车驾驶员、货车驾驶员、斩车驾驶员),驾龄(5年、10年、20年)以及所听音乐类型(据滚乐、轻音乐、民乐)等因素。若该研究者想通过情景模报实验来检验自己的上述看法，请回答：\n(1)实验中要操纵的白变量有哪些?哪些自变量应该作为组间变量?哪些可以作为组内变量?\n(2)因变量是什么?具体测量指标可以有哪些?","notes":["只节选原文件三段“小米提供机经（24年11月考试题）”，其余旧复习讲义未混入机经全文。","三门课各6道，共18道，与2024年11月主档重复保留；原材料未提供逐题标准答案。","原文件另有明确注明Deepseek生成的复习参考，存在需纠正的内容，不能当学校答案。"],"questions":[{"id":"exam_embedded_docx-q001","subject":"心理学理论与流派","subject_code":"112","date":"2024-11","type":"简答题","text":"1、早期行为主义的观点及评价。","answer":"","answer_status":"原文件未附标准答案","topic":"行为主义","points":null,"is_missing":false,"notes":"","canonical":false,"exam_primary":false,"primary_question_id":"exam_202411-q001","duplicate_source_ids":["exam_202411","exam_compare_202411_202506","exam_embedded_pdf"],"missing":false,"card_ids":["c112-04"]},{"id":"exam_embedded_docx-q002","subject":"心理学理论与流派","subject_code":"112","date":"2024-11","type":"简答题","text":"2、古典精神分析理论的观点及评价。","answer":"","answer_status":"原文件未附标准答案","topic":"精神分析","points":null,"is_missing":false,"notes":"","canonical":false,"exam_primary":false,"primary_question_id":"exam_202411-q002","duplicate_source_ids":["exam_202411","exam_compare_202411_202506","exam_embedded_pdf"],"missing":false,"card_ids":["c112-11","c112-12","c112-13"]},{"id":"exam_embedded_docx-q003","subject":"心理学理论与流派","subject_code":"112","date":"2024-11","type":"简答题","text":"3、人本主义的观点及评价。","answer":"","answer_status":"原文件未附标准答案","topic":"人本主义","points":null,"is_missing":false,"notes":"","canonical":false,"exam_primary":false,"primary_question_id":"exam_202411-q003","duplic const allQuestions=D.exams.sources.flatMap(s=>(s.questions||[]).map(q=>({...q,source_id:s.id,source_title:s.title,source_date:s.date,primary:!!s.primary})));let route='home',filters={date:'all',subject:'all',type:'all',alts:false},lastquery='',practiceCurrent=null,onlyUnlearned=false;

const label={home:'复习总览','112':'心理学理论与流派','212':'心理学研究方法','312':'心理测量与统计','412':'人格与社会心理学','501':'思想政治理论',exams:'历年题目与机经',practice:'抽题与自测',scope:'学校考试范围'};

function progress(){let n=cards.filter(c=>learned[c.id]).length;$('#progressText').textContent=`已掌握 ${n} / ${cards.length} 个复习单元`;$('#progressFill').style.width=(100*n/cards.length)+'%'}
function sourceLinks(c){return(c.sources||[]).map(s=>{if(typeof s==='string')s={id:s};if(s.url)return`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title||s.id||'核对资料')}</a>`;let z=sources[s.id];return`<button class="sourcebtn" data-source="${esc(s.id)}">${esc(s.id+' '+(z?.title||s.title||''))}</button>${s.locator?' · '+esc(s.locator):''}`}).join('； ')}
function recallHTML(c){return(c.recall||[]).map(r=>`<details class="recall"><summary>自测 · ${esc(r.q)}</summary><p>${esc(r.a)}</p></details>`).join('')}
function cardHTML(c,open=true){return`<details class="card lesson" id="${c.id}" ${open?'open':''}><summary><div><div class="cardtitle">${esc(c.title)} ${learned[c.id]?'<span class="donebadge">✓ 已掌握</span>':''}</div><div class="cardmeta">${esc(c.level)}</div></div></summary><div class="cardbody"><div class="lesson-content">${c.body_html}</div>${recallHTML(c)}<div class="cardfooter"><label class="mastered"><input type="checkbox" data-learn="${c.id}" ${learned[c.id]?'checked':''}> 已掌握</label></div></div></details>`}

练习机经。简答写清定义与要点，论述展开机制、例子与评价，设计题把变量、程序、控制和分析写完整。</p></div></div><h2>历年题目与练习</h2><p>收录 2024 年 11 月、2025 年 6 月、2025 年 11 月及 2026 年 6 月的现有题目记录。每题都可直接跳转到对应知识。回忆题中的缺项保留原状。</p><div class="readingbar"><button data-route="exams">按年份或科目练题 →</button><button data-route="practice">随机抽题 →</button><button data-route="scope">查看学校考试范围 →</button></div><h2>阅读方式</h2><p>讲义默认展开，可以直接连续阅读。顶部搜索适合查概念、人物和题目；目录可跳转到专题或知识点。勾选“已掌握”后可筛选待复习内容，学习进度保存在当前浏览器。整个 HTML 可离线使用，也可打印当前课程。</p>`}
function lesson(code){let s=D.subjects.find(s=>s.code===code),list=s.cards.filter(c=>!onlyUnlearned||!learned[c.id]);let topics=s.topics.filter(t=>list.some(c=>c.syllabus_topic===t.number));return`<div class="eyebrow">课程 ${s.code}</div><h1>${esc(s.title)}</h1><p class="lead">${esc(s.overview)}</p><nav class="topic-nav" aria-label="专题目录">${topics.map(t=>`<a href="#topic-${code}-${t.number}" data-topic="topic-${code}-${t.number}">专题${t.numeral} · ${esc(t.title)}</a>`).join('')}</nav><div class="toolbar"><button data-action="expand">展开全部</button><button data-action="collapse">收起全部</button><button data-action="recite">${document.body.classList.contains('recitemode')?'退出背诵模式':'进入背诵模式'}</button><label><input id="unlearned" type="checkbox" ${onlyUnlearned?'checked':''}> 只看待复习</label><span class="small">${list.length} / ${s.cards.length} 单元</span></div><details class="toc"><summary>知识点目录</summary>${topics.map(t=>`<h4>专题${t.numeral} · ${esc(t.title)}</h4>${list.filter(c=>c.syllabus_topic===t.number).map(c=>`<a href="#${c.id}" data-card="${c.id}">${esc(c.title)}</a>`).join('')}`).join('')}</details>${topics.map(t=>`<section class="topic-section" id="topic-${code}-${t.number}"><h2 class="topic-heading"><span class="topic-caption">专题${t.numeral}</span>${esc(t.title)}</h2><details class="syllabus-requirement"><summary>本专题考试要求</summary><div class="scope-text">${esc(t.requirements)}</div></details>${list.filter(c=>c.syllabus_topic===t.number).map(c=>cardHTML({...c,code},true)).join('')}</section>`).join('')||'<p class="empty">本科目已全部标记掌握。取消筛选可以重新阅读。</p>'}`}
function qValid(q){return q.text?.trim()&&!q.missing}
function questionHTML(q){let matches=(q.card_ids||[]).map(id=>cards.find(c=>c.id===id)).filter(Boolean);return`<details class="card question" id="${esc(q.id)}"><summary><div><div class="cardtitle">${esc(q.display_title||q.text?.split('\n')[0].slice(0,85)||'原文空白题号')}</div><div class="cardmeta">${esc(q.date||q.source_date)} · ${esc(q.subject||q.subject_code||'附录')} · ${esc(q.type||'未注明题型')} ${!q.primary?'· 对照来源':''}</div></div></summary><div class="cardbody"><div class="examtext">${esc(q.text)}</div>${q.notes?`<p class="small">原记录说明：${esc(Array.isArray(q.notes)?q.notes.join("；"):q.notes)}</p>`:""}${q.answer?`<details class="recall"><summary>${esc(q.answer_status||'原资料附答案，未视为标准答案')}</summary><div class="examtext">${esc(q.answer)}</div></details>`:''}${q.missing?'<div class="notice warning">原文件仅保留题号，题干缺失；本资料未补造题目。</div>':`${q.reference_answer?`<details class="recall"><summary>编写参考要点（非官方答案）</summary><div class="examtext">${esc(q.reference_answer)}</div></details>`:''}${matches.length?`<div class="notice"><b>对应讲义</b><br>${matches.map(c=>`<button class="jump" data-card="${c.id}">${esc(c.title)} →</button>`).join('')}<div class="small">先独立作答，再对照讲义检查定义、要点与例子。</div></div>`:'<div class="notice warning">此题暂未建立精确讲义跳转，请用顶部搜索相关术语；原题保留供核对。</div>'}` }</div></details>`}
function exams(){let arr=allQuestions.filter(q=>(filters.alts||q.primary)&&(filters.date==='all'||(q.date||q.source_date)===filters.date)&&(filters.subject==='all'||q.subject_code===filters.subject)&&(filters.type==='all'||q.type===filters.type));let dates=[...new Set(allQuestions.map(q=>q.date||q.source_date))].filter(Boolean).sort();let types=[...new Set(allQuestions.map(q=>q.type))].filter(Boolean);let opts=(values,sel)=>values.map(v=>`<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(v)}</option>`).join('');return`<div class="eyebrow">原题优先 · 回忆版本可核对</div><h1>历年题目与机经</h1><p class="lead">2024 年 11 月、2025 年 6 月、2025 年 11 月、2026 年 6 月。按现有材料完整保留题干、小问及原有说明；这里的完整指现存记录，不代表已取得完整正式试卷。</p><div class="cardbody"><div class="tablewrap"><table><thead><tr><th>场次</th>${D.subjects.map(s=>`<th>${s.code}</th>`).join('')}</tr></thead><tbody>${D.exams.sources.filter(s=>s.primary).map(s=>`<tr><td>${s.date}</td>${D.subjects.map(sub=>{let qs=s.questions.filter(q=>q.subject_code===sub.code),n=qs.filter(qValid).length;return `<td>${n?n:'未留存'}${qs.some(q=>q.missing)?' + 1缺题':''}</td>`}).join('')}</tr>`).join('')}</tbody></table></div><p class="small">表内为已留存有内容的大题数，非正式试卷总题量。112 流派 / 212 方法 / 312 测量统计 / 412 人格社会 / 501 政治。</p></div><div class="notice">默认显示四期主档。同题在合并版、旧复习资料中再次出现时，保留为“对照来源”，不会把它计作另一次考试或另一道新题。2026 年 6 月流派简答第 4 题原文空缺。</div><div class="toolbar"><select id="examDate" aria-label="考试场次"><option value="all">全部场次</option>${opts(dates,filters.date)}</select><select id="examSubject" aria-label="考试科目"><option value="all">全部科目</option>${D.subjects.map(s=>`<option value="${s.code}" ${s.code===filters.subject?'selected':''}>${s.code} ${esc(s.title)}</option>`).join('')}</select><select id="examType" aria-label="题型"><option value="all">全部题型</option>${opts(types,filters.type)}</select><label><input id="examAlts" type="checkbox" ${filters.alts?'checked':''}> 显示重复对照来源</label><button data-action="expand">展开全部</button><button data-action="collapse">收起全部</button></div><p class="small">当前显示 ${arr.filter(qValid).length} 道有内容记录${arr.some(q=>q.missing)?'，另含原文空白题位':''}。同一大题内的小问不拆成新题。打印仅输出当前筛选题目，不重复打印下方原文对照档。</p>${arr.map(questionHTML).join('')||'<p class="empty">本筛选组合没有现存记录。</p>'}<h2 class="noprint">源文件中的机经原文</h2><p class="small noprint">原文区保留行序、题型说明和原有缺项；文字提取可能产生换行。旧复习建议仅收录其中的机经段。全部对照文档始终可在此查看。</p>${D.exams.sources.filter(s=>(s.questions||[]).length).map(s=>`<details class="card rawsource noprint"><summary><div><div class="cardtitle">${esc(s.title)}</div><div class="cardmeta">${s.primary?'主档':'对照档'} · ${esc(s.kind||'同学记录')} · ${(s.questions||[]).length} 个题位</div></div></summary><div class="cardbody"><p class="small">${esc(Array.isArray(s.notes)?s.notes.join('；'):s.notes||'')}</p><pre class="raw">${esc(s.text)}</pre>${s.appendix?`<details class="recall"><summary>原文附录（题目性质未确认）</summary><pre class="raw">${esc(typeof s.appendix==='string'?s.appendix:JSON.stringify(s.appendix,null,2))}</pre></details>`:''}</div></details>`).join('')}`}
function scopePage(){return`<div class="eyebrow">五门课程 · 逐专题复习</div><h1>学校考试范围</h1><p class="lead">掌握基本概念，理解理论之间的关系，并能用来解释现象、解决问题。点击课程进入相应讲义。</p>${D.scopes.map(s=>`<section class="scope-course"><h2>${esc(s.code+' '+s.title)}</h2><button data-route="${s.code}">进入本门讲义 →</button><pre class="raw">${esc(s.text)}</pre></section>`).join('')}<details class="reading-references noprint"><summary>延伸阅读资料</summary><p>需要进一步阅读时，可查阅以下教材与公开资料。</p><ul>${D.references.map(r=>`<li>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>`:esc(r.title)}</li>`).join('')}</ul></details>`}
function sourcesPage(){return scopePage()}
function practice(){return`<div class="eyebrow">主动回忆 · 先写后看</div><h1>抽题与自测</h1><p class="lead">从已有机经主档或讲义自测中随机抽取。没有自动评分：先独立写出答案，再依据讲义检查核心概念、逻辑和例子。</p><div class="toolbar"><select id="practiceSubject" aria-label="练习科目"><option value="all">全部科目</option>${D.subjects.map(s=>`<option value="${s.code}">${esc(s.title)}</option>`).join('')}</select><button data-action="drawExam">抽一道机经</button><button data-action="drawRecall">抽一道自测</button></div><div id="practiceBody" class="empty">选择科目后抽题。机经题目只取有内容的主档题位。</div>`}
function draw(kind){let code=$('#practiceSubject').value,pool=kind==='drawExam'?allQuestions.filter(q=>q.primary&&qValid(q)&&(code==='all'||q.subject_code===code)):cards.filter(c=>code==='all'||c.code===code).flatMap(c=>(c.recall||[]).map(r=>({...r,card:c})));if(!pool.length){$('#practiceBody').innerHTML='<p>当前科目没有该类题目。</p>';return}let item=pool[Math.floor(Math.random()*pool.length)];$('#practiceBody').className='';$('#practiceBody').innerHTML=kind==='drawExam'?questionHTML(item):`<div class="practicecard"><span class="tag">${esc(item.card.subject)} · 自编自测</span><h2>${esc(item.q)}</h2><details class="recall"><summary>展开参考要点</summary><p>${esc(item.a)}</p><button class="jump" data-card="${item.card.id}">返回讲义 →</button></details></div>`;let d=$('#practiceBody details.question');if(d)d.open=true}
function render(r=route,scroll=true){route=r;document.body.classList.toggle('recitemode',/^\d/.test(r)&&document.body.classList.contains('recitemode'));$('#app').innerHTML=(r==='home'?home():r==='exams'?exams():r==='scope'?scopePage():r==='practice'?practice():lesson(r))+commonFooter();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.route===r));$('#sidebar').classList.remove('show');wrapTables();if(scroll)window.scrollTo({top:0,behavior:'instant'});progress();history.replaceState(null,'','#'+r)}
function wrapTables(){document.querySelectorAll('.cardbody table').forEach(t=>{if(!t.parentElement.classList.contains('tablewrap')){let div=document.createElement('div');div.className='tablewrap';t.replaceWith(div);div.append(t)}})}
function gotoCard(id){let c=cards.find(c=>c.id===id);if(!c)return;onlyUnlearned=false;$('#search').value='';lastquery='';render(c.code,false);let e=document.getElementById(id);e.open=true;e.scrollIntoView({block:'start',behavior:'smooth'})}
function search(q){lastquery=q;if(!q.trim()){render(route);return}let words=q.trim().toLowerCase().split(/\s+/),match=t=>words.every(w=>t.toLowerCase().includes(w));let result=[];cards.forEach(c=>{let t=c.title+' '+plain(c.body_html)+' '+(c.keywords||[]).join(' ')+' '+(c.recall||[]).map(r=>r.q+' '+r.a).join(' ');if(match(t))result.push({kind:'讲义',title:c.title,text:t,id:c.id,code:c.code})});allQuestions.forEach(x=>{let t=x.text+' '+(x.reference_answer||'')+' '+(x.answer||'');if(match(t))result.push({kind:x.primary?'机经主档':'机经对照档',title:x.text?.split('\n')[0].slice(0,80)||'原文题目',text:t,id:x.id,code:x.subject_code})});$('#app').innerHTML=`<div class="eyebrow">全文搜索</div><h1>查找“${esc(q)}”</h1><p class="small">共 ${result.length} 条匹配。支持空格分隔多个关键词；机经对照档也在搜索范围内。</p><div class="results">${result.map(r=>{let pos=r.text.toLowerCase().indexOf(words[0]),snippet=r.text.slice(Math.max(0,pos-35),Math.max(0,pos-35)+190);return`<button class="result" ${r.kind==='讲义'?`data-card="${r.id}"`:`data-question="${esc(r.id)}"`}><span class="tag">${r.kind} · ${esc(r.code||'')}</span><h3>${esc(r.title)}</h3><p>${esc(snippet)}…</p></button>`}).join('')||'<p class="empty">未找到。可尝试较短关键词、同义词或人物译名。</p>'}</div>`;window.scrollTo({top:0,behavior:'instant'})}
document.addEventListener('click',e=>{let b=e.target.closest('[data-route],[data-card],[data-question],[data-source],[data-action],[data-topic]');if(!b)return;if(b.dataset.topic){e.preventDefault();document.getElementById(b.dataset.topic)?.scrollIntoView({block:'start',behavior:'smooth'})}if(b.dataset.route){$('#search').value='';lastquery='';render(b.dataset.route)}if(b.dataset.card){e.preventDefault();gotoCard(b.dataset.card)}if(b.dataset.question){let q=allQuestions.find(x=>x.id===b.dataset.question);filters={date:'all',subject:'all',type:'all',alts:!q.primary};$('#search').value='';render('exams',false);let d=document.getElementById(q.id);d.open=true;d.scrollIntoView({block:'start',behavior:'smooth'})}if(b.dataset.source){render('sources',false);let d=document.getElementById('source-'+b.dataset.source);if(d)d.scrollIntoView({block:'start',behavior:'smooth'})}let a=b.dataset.action;if(a==='expand'||a==='collapse')document.querySelectorAll('#app details.card').forEach(d=>d.open=a==='expand');if(a==='recite'){document.body.classList.toggle('recitemode');render(route,false)}if(a?.startsWith('draw'))draw(a)});
document.addEventListener('change',e=>{let t=e.target;if(t.dataset.learn){learned[t.dataset.learn]=t.checked;try{localStorage.setItem('school-review-20260923',JSON.stringify(learned))}catch{}progress();if(onlyUnlearned)render(route,false)}if(t.id==='unlearned'){onlyUnlearned=t.checked;render(route,false)}if(t.id==='examDate'){filters.date=t.value;render('exams',false)}if(t.id==='examSubject'){filters.subject=t.value;render('exams',false)}if(t.id==='examType'){filters.type=t.value;render('exams',false)}if(t.id==='examAlts'){filters.alts=t.checked;render('exams',false)}});
let timer;$('#search').addEventListener('input',e=>{clearTimeout(timer);timer=setTimeout(()=>search(e.target.value),180)});$('#clear').onclick=()=>{$('#search').value='';search('')};$('#menu').onclick=()=>$('#sidebar').classList.toggle('show');let printState=[];window.addEventListener('beforeprint',()=>{printState=[...document.querySelectorAll('#app details')].map(d=>[d,d.open]);printState.forEach(([d])=>d.open=true)});window.addEventListener('afterprint',()=>printState.forEach(([d,o])=>d.open=o));$('#print').onclick=()=>window.print();render(label[location.hash.slice(1)]?location.hash.slice(1):'home');
</script></body></html>
