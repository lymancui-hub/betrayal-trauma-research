<script id="data" type="application/json">{"subjects":[{"code":"112","title":"心理学理论与流派","overview":"本课程分为心理学流派与心理学理论两个专题。心理学流派讲清各学派的起源、代表人物、研究对象、基本观点、区别及发展趋势；心理学理论讲清主要理论的提出者、核心概念、作用机制、相互区别和现实应用。学习时既要理解理论怎样解释心理与行为，也要掌握其贡献与适用边界。","cards":[{"id":"c112-01","title":"科学心理学的诞生与流派发展地图","outline":"专题一：心理学流派","level":"理解","keywords":["冯特","1879年","科学心理学","发展脉络"],"body_html":"<p>心理学从哲学中对心灵的讨论、从生理学中对感觉与神经的研究逐渐取得独立地位。通常把冯特于1879年在莱比锡建立心理学实验室作为科学心理学诞生的标志：关键不只是有一间实验室，而是把心理问题变成可控制、可观察和可重复研究的科学问题。<\/p><h4>用问题串起流派<\/h4><p>构造主义问“意识由什么组成”；机能主义问“心理活动有什么适应功能”；行为主义问“行为如何习得和改变”；格式塔问“整体经验如何组织”；精神分析问“无意识冲突怎样影响人”；人本主义问“人如何实现潜能”；认知心理学问“信息怎样加工”。它们在时间上有重叠，并非一个出现就把前一个完全替代。<\/p><h4>答题结构与易错点<\/h4><p>心理学的发展体现为研究对象从意识经验拓展到行为和心理加工，研究方法从哲学思辨发展为实验、观察、测量及多方法结合。冯特重视实验内省、统觉和意志，铁钦纳才是构造主义的主要代表；不能简单说两人的体系完全相同。记住流派争论也推动了研究方法和应用领域的发展，评价时要放回当时的科学条件。<\/p>","recall":[{"q":"心理学各流派能否画成一条完全替代的直线？","a":"不能。流派在时间上并存、相互批评并相互吸收；可按研究对象与解释重点演变组织答案。"}],"syllabus_topic":1},{"id":"c112-02","title":"构造主义：研究对象、内省法与评价","outline":"专题一：心理学流派","level":"掌握","keywords":["铁钦纳","构造主义","意识元素","实验内省"],"body_html":"<p>构造主义以铁钦纳为主要代表，试图把成人的意识经验分析为基本成分，并说明成分组合的规律。其核心是研究意识的结构：它关心经验包含哪些感觉、意象和情感，而不是首先讨论意识帮助人解决什么现实问题。<\/p><h4>研究方法<\/h4><p>其主要方法是经过训练的实验内省。在控制刺激和实验条件后，观察者报告自己的直接经验。例如面对苹果，应描述颜色、形状、明暗和味觉等经验，而不能只说“这是苹果”；后者把对象的名称和既有知识带入报告。实验内省不是日常随意反思或写心情日记。<\/p><h4>贡献、局限与作答<\/h4><p>贡献在于使心理活动成为可系统研究的对象，推进实验室研究和精细观察。局限在于内省报告难以独立验证，受训练、语言和期待影响；儿童、动物和无意识过程也难以用同样方法研究。简答题依次写“代表人物—研究对象—研究方法—一项贡献与两项局限”。<\/p>","recall":[{"q":"构造主义与机能主义的核心问题有何不同？","a":"构造主义问意识由哪些基本成分构成；机能主义问心理活动如何帮助个体适应环境。"}],"syllabus_topic":1},{"id":"c112-03","title":"机能主义：意识流与适应功能","outline":"专题一：心理学流派","level":"理解","keywords":["詹姆斯","杜威","机能主义","意识流"],"body_html":"<p>机能主义的代表包括威廉·詹姆斯、杜威和安吉尔。受进化论与实用主义影响，它把心理活动放在有机体适应环境的过程中理解，关注意识和行为“做什么、有什么用”，反对只把意识切成互不相连的元素。<\/p><h4>主要观点<\/h4><p>詹姆斯用“意识流”强调意识具有连续性、变化性、选择性和个人性。杜威批评把反射弧机械分割为刺激、感觉和反应，主张结合完整活动来理解。例如儿童看见烛火、伸手、感到灼热、缩回手不是毫无关系的片段，而是相互联系的适应活动。<\/p><h4>比较与评价<\/h4><p>相较构造主义，机能主义更关注真实生活、个体差异和实用价值，研究方法也较多元，推动了儿童心理、教育心理、动物心理和应用心理研究。它不是所有代表都遵循一个严密体系的学派，概念和方法相对宽泛。若问现实意义，可举“教学不仅考察记住了哪些内容，还考察知识如何支持解决实际问题”。注意不要把机能主义直接等同后来主张只研究可观察行为的早期行为主义。<\/p>","recall":[{"q":"为何机能主义推动应用心理学？","a":"它从心理活动的适应功能出发，重视教育、工作和个体差异等实际问题，因而扩大了研究对象与方法。"}],"syllabus_topic":1},{"id":"c112-04","title":"早期行为主义：华生的观点及评价","outline":"专题一：心理学流派","level":"掌握","keywords":["华生","刺激反应","客观方法","环境决定"],"body_html":"<p>华生是早期行为主义的主要代表。其主张心理学应以可观察的行为为研究对象，以客观实验和观察为主要方法，目标是预测与控制行为；反对把内省获得的意识内容作为心理学唯一基础。1913年的行为主义宣言通常被视为该学派形成的重要标志。<\/p><h4>核心观点<\/h4><p>用刺激—反应联系解释行为，强调学习和环境经验对习惯、情绪及发展的作用。情绪也可通过条件作用获得：某个原本中性的对象若与令人恐惧的事件相联系，以后可能引发恐惧。小阿尔伯特研究常用于说明这一历史观点，但其样本和程序局限很大，也存在明显伦理问题，不能当作现代儿童研究范本。<\/p><h4>评价与答题骨架<\/h4><p>贡献：强化客观研究取向，使学习规律可通过实验考察，促进教育与行为干预。局限：早期观点过度强调环境，低估认知、生物基础及人的主动性，刺激—反应模式难以充分解释语言与复杂思维。写“观点及评价”时先给研究对象、目标、方法、学习机制，再分别列贡献和局限，避免只写“研究行为”一句话。<\/p>","recall":[{"q":"早期行为主义有什么贡献，又有什么不足？","a":"贡献是客观实验取向与学习、行为改变研究；不足是过度环境决定和简单刺激反应解释，低估认知、主动性和生物基础。"}],"syllabus_topic":1},{"id":"c112-11","title":"古典精神分析：无意识的定义、地位与作用","outline":"专题一：心理学流派","level":"掌握","keywords":["弗洛伊德","潜意识","无意识","前意识","心理决定"],"body_html":"<p>在弗洛伊德的古典精神分析中，意识是当下觉察到的心理内容，前意识是暂未觉察但较容易进入意识的内容，无意识则包括难以直接觉察的愿望、冲突和被压抑内容。这里的“潜意识”指精神分析意义上的无意识。<\/p><h4>理论地位与作用<\/h4><p>无意识并非没有心理活动，而是被视为持续影响情绪、动机和行为的重要动力。理论强调心理决定论，认为某些梦、口误、症状和重复性关系模式可能与无意识冲突有关；自由联想和梦的分析被用于理解其意义。这些是精神分析的解释主张，不等于每次口误都必然暴露一个确定的被压抑愿望。<\/p><h4>评价与应用<\/h4><p>贡献是拓展了心理学对意识之外活动、内在冲突、早期经验的关注。局限是许多经典命题难以操作化和证伪，解释依赖个案且有历史文化限制。现实应用可写为对反复出现的情绪与关系模式进行探索，同时结合当下情境和证据。现代认知研究中的自动加工或内隐记忆，不应直接等同弗洛伊德的动力性无意识。<\/p>","recall":[{"q":"无意识与前意识的关键区别是什么？","a":"前意识内容通常可较容易被提取到意识；动力性无意识涉及难直接觉察、可能受压抑或防御影响的内容。"}],"syllabus_topic":1},{"id":"c112-17","title":"格式塔：知觉组织原则与顿悟","outline":"专题一：心理学流派","level":"掌握","keywords":["格式塔","韦特海默","苛勒","考夫卡","知觉组织","顿悟"],"body_html":"<p>格式塔心理学以韦特海默、苛勒和考夫卡为代表，强调心理经验的整体组织性。通常以1912年前后似动现象研究为其形成的重要标志。核心不是把零散感觉简单相加，而是认为整体结构决定部分的意义；“整体不同于部分之和”比仅理解为数量上的“大于”更准确。<\/p><h4>知觉组织原则<\/h4><p>接近律：空间或时间接近的元素容易组成一组；相似律：相似元素容易归组；良好连续律：倾向知觉连续而平滑的结构；闭合律：倾向补全不完整轮廓；共同命运：同方向运动的元素容易被组织在一起；图形与背景区分使注意集中于某一整体。良好形态原则概括了知觉倾向较简洁、规则和稳定组织的特点。<\/p><h4>学习与应用<\/h4><p>苛勒用顿悟说明问题结构重组后可能突然发现解决方法，并非所有学习都只是盲目试误。例如先把统计概念按“描述—推断”重新分类，再理解公式用途，就是结构化学习。答题可先列原则再各给短例。其贡献是突出组织与主动加工，局限在于部分解释较概括；顿悟也常以准备、经验和尝试为条件。<\/p>","recall":[{"q":"格式塔知觉组织原则至少写出四个。","a":"接近、相似、良好连续、闭合；还可写共同命运、图形背景与良好形态。"}],"syllabus_topic":1},{"id":"c112-18","title":"人本主义与马斯洛需要层次","outline":"专题一：心理学流派","level":"掌握","keywords":["马斯洛","人本主义","自我实现","需要层次"],"body_html":"<p>人本主义以马斯洛、罗杰斯为代表，重视完整的人、主观体验、选择、意义及成长潜能，被称为心理学的“第三势力”。它批评某些精神分析理论过于关注病理与冲突，也批评行为主义只从外部控制理解人，主张研究健康、创造与自我实现。<\/p><h4>马斯洛理论<\/h4><p>经典需要层次包括生理、安全、归属与爱、尊重、自我实现。自我实现指充分发展自身潜能、发挥能力，而不等于取得外在名利。低层需要通常在严重匮乏时具有较强迫切性，但不能机械解释为“前一层百分之百满足后下一层才出现”；现实中多种需要并存，价值追求也可能使人承受物质匮乏。<\/p><h4>评价与应用<\/h4><p>教学中既要考虑休息和学习环境，也要提供归属、尊重、选择及有意义的挑战。它拓展了心理学的积极研究主题，推动以人为中心的教育和助人实践；局限是自我实现等概念较难精确测量，层次顺序存在个体与文化差异。答“观点及评价”要写人性观、研究对象、代表理论、贡献和局限，不能只背五层需要。<\/p>","recall":[{"q":"需要层次是否是必须逐层完全满足的硬性阶梯？","a":"不是。它表达主导需要的一般趋势，多种需要可同时存在，顺序和表现会受个体及文化影响。"}],"syllabus_topic":1},{"id":"c112-20","title":"认知心理学：基本观点、贡献与局限","outline":"专题一：心理学流派","level":"掌握","keywords":["信息加工","内部表征","认知革命","奈瑟","米勒"],"body_html":"<p>现代认知心理学把人看作主动加工信息的系统，研究注意、知觉、记忆、语言、推理和问题解决等过程。20世纪中叶的信息论、计算机科学、语言学和行为研究共同促成认知取向发展；米勒、布鲁纳、纽厄尔、西蒙和奈瑟等作出重要贡献。奈瑟1967年的《认知心理学》是重要标志之一，不宜把一个人说成全部认知理论的唯一创始人。<\/p><h4>基本观点与方法<\/h4><p>外界刺激不是直接、机械地产生行为，内部表征、已有知识、策略和加工限制起中介作用。通过反应时、正确率、实验操纵和计算模型，研究者推断不可直接观察的认知过程，并检验模型预测。<\/p><h4>贡献、局限和应用<\/h4><p>贡献是使内部心理过程重新成为严格实验研究的对象，促进记忆策略、教育、人工智能及神经科学研究。早期信息加工模型可能过度类比计算机，低估情绪、身体和真实社会情境。复习应用包括组块、提取练习与组织知识结构，但不能由“像信息加工系统”推出人脑就是普通电脑。论述按“研究对象—主动加工—表征与过程—方法—贡献—局限—实例”展开。<\/p>","recall":[{"q":"认知心理学如何研究看不见的心理过程？","a":"通过可观察的行为指标与受控制的实验操纵建立、比较模型，从结果推断并检验内部加工机制。"}],"syllabus_topic":1},{"id":"c112-22","title":"认知神经科学：方法、发现与应用边界","outline":"专题一：心理学流派","level":"运用","keywords":["认知神经科学","脑电","fMRI","脑损伤","TMS"],"body_html":"<p>认知神经科学把认知任务、行为指标与神经机制联系起来，研究注意、记忆、语言、决策等活动怎样由脑系统支持。答题要同时写“心理过程”和“证据方法”，不能只堆砌脑区名称。<\/p><h4>方法及各自优势<\/h4><p>脑损伤与神经心理学研究通过功能受损模式推测某系统的重要性，但损伤位置常不规则；脑电与事件相关电位有较好的时间分辨率，适合研究加工发生的时间；fMRI主要通过血氧水平变化间接反映活动，空间定位较好，但不能把信号等同神经元放电；TMS等干预在适当设计下可帮助检验特定系统的因果作用，仍受定位与任务等限制。<\/p><h4>成果、应用及论述框架<\/h4><p>代表性认识是记忆包含多个系统、认知依赖分布式网络、脑功能具有一定可塑性。可用于脑损伤后认知评估与康复研究、学习机制研究和人机交互。写作按“定义—四类方法比较—两类发现—应用—限制”展开。某脑区在任务中活跃不等于该脑区只负责这一功能，更不等于能直接读出一个人的完整思想；多方法相互验证比单幅脑图更有说服力。<\/p>","recall":[{"q":"fMRI信号为什么不能直接等同思想或神经元放电？","a":"它主要是间接血氧指标；解释需要任务、比较条件和多种证据，单一激活不足以证明某心理过程或因果关系。"}],"syllabus_topic":1},{"id":"c112-23","title":"进化心理学：基本假设与避免适应故事","outline":"专题一：心理学流派","level":"理解","keywords":["进化心理学","自然选择","适应问题","巴斯"],"body_html":"<p>进化心理学运用进化论思考心理机制的形成，关注某些信息加工与行为倾向是否与祖先环境中反复出现的生存、合作或繁殖问题有关。巴斯等是当代代表。它试图区分机制在进化历史中“为何可能被保留”的终极解释，与个体当下“如何发生”的近因解释。<\/p><h4>基本假设<\/h4><p>心理机制依赖生物系统并受到选择过程影响；反复出现的适应问题可能促成相应的信息加工倾向；这些倾向与发展经验和当前环境互动，现代环境未必与形成它们的环境相同。因此进化取向不等于“行为全部由基因写死”，也不等于当前存在的每个特征都是适应。<\/p><h4>例子与评价<\/h4><p>对威胁线索的注意可提出适应性假设，但仍需与一般学习、文化和当下情境解释比较。优势是连接心理学与生物学，提出跨文化和功能性问题；困难是历史条件难直接观察，容易事后编造似乎合理的故事。考试评价应提出可检验预测、跨样本证据、替代解释和个体差异四点。关于一种倾向怎样产生的解释，也不构成对该行为合理与否的道德判断。<\/p>","recall":[{"q":"进化解释是否意味着行为无法改变？","a":"不意味着。进化假设讨论机制形成，实际行为仍受个体发展、学习、文化和当前环境影响。"}],"syllabus_topic":1},{"id":"c112-24","title":"现代趋势：多层次整合、积极心理与开放科学","outline":"专题一：心理学流派","level":"运用","keywords":["现代进展","积极心理学","PERMA","开放科学","整合"],"body_html":"<p>现代心理学呈现解释层次更加整合、研究情境更加丰富、证据要求更加严格的发展趋势。生物、认知、行为与社会文化视角常被结合用于解释同一问题；流派并存并不意味着所有说法都同样成立，具体命题仍要接受数据检验。<\/p><h4>积极心理学的补充<\/h4><p>塞利格曼等推动对优势、幸福和良好生活的系统研究。PERMA包括积极情绪、投入、关系、意义和成就；心流研究强调在挑战与技能相匹配、目标清楚并有反馈时形成高度投入的体验。它补充了心理学对问题和病理的关注，不是要求人忽略痛苦或只保持乐观。现实应用可将复习任务设计得有挑战且可完成，并提供反馈与同伴支持。<\/p><h4>证据与现实应用<\/h4><p>开放科学强调透明报告、预注册、适当共享数据和材料、重复研究等，以提高研究可核查性。数字行为资料和计算模型也扩大了研究手段，但应注意隐私和适用范围。多层次整合有助于联系不同解释，真实情境研究提高应用价值，透明与重复研究则帮助检验结论是否可靠；三者共同推动心理学从单一流派解释走向相互验证。<\/p>","recall":[{"q":"怎样避免把“现代趋势”写成几个口号？","a":"每个趋势都说明含义、具体研究或应用例子及证据限制，并把它连回不同流派如何相互补充。"}],"syllabus_topic":1},{"id":"c112-25","title":"流派比较与现实应用：一题多角度作答","outline":"专题一：心理学流派","level":"运用","keywords":["学派比较","精神分析与行为主义","人本主义","案例分析"],"body_html":"<p>比较题必须沿相同维度比较，而不是分别背两段互不相干的介绍。精神分析重无意识冲突、早期经验及动力解释，传统方法较多依赖临床个案；早期行为主义重可观察行为、学习与环境控制，强调实验；人本主义重主观体验、自主选择与成长；认知取向重表征、解释和信息加工。<\/p><h4>高频比较<\/h4><p>精神分析与行为主义都试图解释行为规律，但决定机制不同：前者偏重内在冲突，后者偏重外部条件。人本主义与行为主义的分歧集中在人性观、研究对象和改变途径：主体的意义与潜能，对应可观察行为与环境后果。不能夸张成行为主义完全否认任何内部事件，也不能把人本主义写成不需要事实证据。<\/p><h4>同一例子的四种解释<\/h4><p>面对备考拖延，精神分析可探索失败恐惧与内在冲突；行为视角检视刷手机带来的即时奖励和逃避焦虑；认知视角检视“不会就说明我不行”等评价；人本视角关注自主目标、被接纳感和个人意义。论述结尾说明这些是待检验的解释角度，不是对某人的确定诊断。通用骨架为“现象—对应概念—作用过程—可执行措施—效果及边界”。<\/p>","recall":[{"q":"比较精神分析和行为主义时至少使用哪四个维度？","a":"研究对象、行为动力或机制、研究方法、改变途径；再补共同贡献与各自局限。"}],"syllabus_topic":1},{"id":"c112-05","title":"经典条件作用：建立、泛化、分化与消退","outline":"专题二：心理学理论","level":"掌握","keywords":["巴甫洛夫","条件刺激","无条件刺激","泛化","消退"],"body_html":"<p>巴甫洛夫的经典条件作用说明：一个原本不能引出目标反应的刺激，经过与能自然引出该反应的刺激建立联系，后来也能引出条件反应。食物是无条件刺激，食物引起的唾液分泌是无条件反应；配对前声音是中性刺激，配对后声音成为条件刺激，声音引起的唾液分泌是条件反应。<\/p><h4>必背过程<\/h4><p>习得是联系逐渐建立；泛化是类似条件刺激也引发反应；分化是学会只对特定刺激反应；消退是条件刺激多次单独呈现后反应减弱；自发恢复是间隔一段时间后，已消退的反应可能短暂重新出现。因此消退不宜理解为原有学习被彻底抹去。<\/p><h4>实例与辨析<\/h4><p>学生曾在答辩中被严厉批评，后来听见答辩提示音就紧张，可用条件作用解释声音与负面经历的联结。但真实情绪还受认知解释等影响。经典条件作用重在“刺激与刺激之间的预测关系”；操作性条件作用重在“行为与后果之间的联系”。巴甫洛夫是生理学家，其研究为行为主义提供重要基础，不是华生学派的创始人。<\/p>","recall":[{"q":"经典条件作用的四个基本要素是什么？","a":"无条件刺激、无条件反应、条件刺激、条件反应；必须说明配对前后的变化，不能只背四个名称。"}],"syllabus_topic":2},{"id":"c112-06","title":"操作性条件作用：斯金纳与行为塑造","outline":"专题二：心理学理论","level":"掌握","keywords":["斯金纳","操作性条件作用","塑造","强化程序"],"body_html":"<p>斯金纳研究行为如何随其后果而改变。操作性行为是个体作用于环境的行为；若某后果使该行为将来更常出现，该后果就具有强化作用。其分析可写成“前因情境—行为—后果”，例如书桌整洁、完成一组练习、获得及时反馈，逐步增加主动练习。<\/p><h4>常用技术<\/h4><p>塑造是先强化接近目标的行为，再逐步提高标准，适合目标行为尚未完整出现的情况。连续强化是每次目标行为后给予强化，有助初始建立；间歇强化只强化部分反应，通常更有利于维持。比率程序依据反应次数，时距程序依据经过的时间；固定与变动则区分要求是否恒定。<\/p><h4>教育应用与边界<\/h4><p>复习计划可从每天完成一张答题卡开始，完成后得到具体反馈，再增加任务量；奖励应与目标行为相联系且及时、适量，并逐步转向任务本身的意义和自我管理。不能把任何“老师说了好话”都称为强化，必须看目标行为是否增加。其优势是过程可观察、可评估；仅靠外部后果解释全部人格和复杂认知仍有局限。<\/p>","recall":[{"q":"什么叫塑造？","a":"按连续接近原则，先强化接近目标的行为，再逐步提高标准，最终建立目标行为。"}],"syllabus_topic":2},{"id":"c112-07","title":"正强化、负强化与惩罚：四格辨析","outline":"专题二：心理学理论","level":"运用","keywords":["正强化","负强化","正惩罚","负惩罚"],"body_html":"<p>判断强化与惩罚，先看行为将来是增加还是减少，再看刺激是增加还是撤除。“正、负”表示添加、撤除，不表示好坏；“强化、惩罚”表示行为效果，不表示行为在道德上是否正确。<\/p><table><thead><tr><th>操作与效果<\/th><th>名称<\/th><th>例子<\/th><\/tr><\/thead><tbody><tr><td>加刺激，行为增加<\/td><td>正强化<\/td><td>按时完成练习后获得喜欢的活动时间，按时完成增多<\/td><\/tr><tr><td>撤刺激，行为增加<\/td><td>负强化<\/td><td>系安全带后警报停止，系带增多<\/td><\/tr><tr><td>加刺激，行为减少<\/td><td>正惩罚<\/td><td>违规后受到不愉快后果，违规减少<\/td><\/tr><tr><td>撤刺激，行为减少<\/td><td>负惩罚<\/td><td>违规后失去某项特权，违规减少<\/td><\/tr><\/tbody><\/table><h4>考试中的应用<\/h4><p>焦虑学生每次逃避模拟答题后立刻轻松，逃避因移除焦虑而被负强化；这说明负强化可能维持不利行为。消退则是原来维持行为的强化不再出现，不等于额外施加惩罚。答题要明确目标行为、后果变化和频率变化，不能凭奖品或批评的表面形式判断。<\/p>","recall":[{"q":"负强化为什么不是惩罚？","a":"负强化通过撤除厌恶刺激增加行为；惩罚以降低行为发生率为判据。"}],"syllabus_topic":2},{"id":"c112-08","title":"从桑代克到托尔曼：试误、效果律与认知地图","outline":"专题二：心理学理论","level":"理解","keywords":["桑代克","托尔曼","效果律","潜伏学习","认知地图"],"body_html":"<p>桑代克用问题箱研究试误学习：动物经过尝试逐渐减少无效动作，形成情境与有效反应的联结。效果律强调，带来满意结果的反应与情境的联系更可能加强。这为后来对行为后果的系统研究提供了基础，但不能将学习全部理解为盲目重复。<\/p><h4>托尔曼的推进<\/h4><p>托尔曼的目的行为主义仍重视客观行为，却用目的、期待和认知地图等中介概念解释行为。认知地图是对环境空间关系的内部表征；潜伏学习指学习已经发生，却因缺乏适当动机等原因暂未表现在外显成绩中。迷宫探索后能够利用空间关系选择路径，说明习得与表现需要区分。<\/p><h4>比较与实例<\/h4><p>桑代克突出反应与结果联系，托尔曼强调有机体对环境关系和目标的理解；托尔曼因此成为行为研究走向认知解释的重要桥梁。学生平时浏览校园地图，尚未显示用途，寻找新教室时却能迅速选路，可作潜伏学习的说明。论述题可据此反驳“当时没有奖励，所以没有发生学习”，但也不应推出奖励与动机完全无用。<\/p>","recall":[{"q":"潜伏学习说明了什么？","a":"学习的获得不等于即时行为表现；没有当场表现或直接强化，不代表没有形成知识。"}],"syllabus_topic":2},{"id":"c112-09","title":"班杜拉社会学习理论：观察学习四过程","outline":"专题二：心理学理论","level":"掌握","keywords":["班杜拉","观察学习","替代强化","交互决定"],"body_html":"<p>班杜拉认为，人既能从直接经验学习，也能通过观察榜样及其后果而学习，不必每次亲自试错。波波玩偶研究是观察学习的经典例证。后来其理论更明确强调社会认知因素，不能把班杜拉简单归为只承认刺激—反应的早期行为主义。<\/p><h4>四个过程<\/h4><p>注意：选择并注意榜样的关键行为；保持：把信息转为表象或语言并保存；动作再现：具备并练习执行所需的技能；动机：决定是否把已学行为表现出来。直接强化来自自己的行为后果，替代强化来自看到榜样受到的后果，自我强化来自依据个人标准评价自己。强化影响表现与动机，但观察学习的获得不一定依赖当场直接奖励。<\/p><h4>三元交互与应用<\/h4><p>个人因素、行为和环境相互影响。例如同学示范论述题结构改变学习者的策略与信心，学习者练习后主动组织互评，又改变学习环境。答论述题可按“基本立场—四过程—三类强化—交互决定—实例—贡献与局限”展开。其价值在于把环境学习与认知主动性联系起来，也提示榜样必须展示过程、可模仿且有练习机会。<\/p>","recall":[{"q":"观察学习四过程按什么顺序？","a":"注意、保持、动作再现、动机；学习获得与行为表现要区分。"}],"syllabus_topic":2},{"id":"c112-10","title":"自我效能感：从理论到复习行动","outline":"专题二：心理学理论","level":"运用","keywords":["自我效能感","结果期待","掌握经验","班杜拉"],"body_html":"<p>自我效能感是个体对自己能否组织并完成某项行动的判断。它回答“我能不能做到”，结果期待回答“这样做会不会有预期结果”。学生相信练习会提高成绩，却认为自己做不来，说明结果期待较高而自我效能偏低；它也不同于对总体自我价值的自尊。<\/p><h4>主要来源与作用<\/h4><p>通常从实际成功的掌握经验、观察相似榜样的替代经验、可信的言语劝导，以及对生理和情绪状态的解释中形成。自我效能影响任务选择、投入努力、遇到困难时的坚持以及如何理解挫折。最有效的支持往往是让人完成真实而适度有挑战的任务，而不是空泛地说“你一定行”。<\/p><h4>复习示例与答题<\/h4><p>针对“不敢做论述题”，先完成定义和两点机制，再逐步扩展为完整答案；观看程度相近同学的示范，使用具体、准确的反馈，并把紧张理解为准备应对任务的反应。答题可用“定义辨析—四来源—行为作用—具体措施”结构。自我效能应与客观能力共同考虑，过度自信不能代替知识和训练。<\/p>","recall":[{"q":"结果期待与自我效能感有何区别？","a":"前者判断行动会产生什么结果，后者判断自己有没有能力完成该行动。"}],"syllabus_topic":2},{"id":"c112-12","title":"本我、自我、超我与性心理发展","outline":"专题二：心理学理论","level":"掌握","keywords":["本我","自我","超我","快乐原则","现实原则","固着"],"body_html":"<p>弗洛伊德的人格结构模型把人格看成相互作用的三个系统。本我追求本能需要的满足，遵循快乐原则；自我在愿望、现实限制和道德要求之间调节，遵循现实原则；超我体现内化的规范与理想，包含良心与自我理想。三者是理论功能划分，不是脑中的三块实体。<\/p><h4>冲突与发展<\/h4><p>想立即娱乐、本周必须备考、又要求自己完美不出错，可分别体现冲动、现实调节与理想要求的张力。自我并非等于“自私”，超我也不总能带来良好适应，过于苛刻可能增加内疚。古典理论将性心理发展分为口唇期、肛门期、性器期、潜伏期和生殖期，认为某阶段满足与冲突可能与固着有关。<\/p><h4>答题与评价<\/h4><p>本我、自我与超我的要求可能发生冲突，自我通过现实调节与防御机制缓解焦虑；古典理论认为早期经验参与这一动力系统的形成。心理地形模型的意识、前意识、无意识与人格结构模型不可机械一一对应，自我和超我也有无意识部分。性心理阶段具有重要史学意义，但不能凭一个成人习惯反推其儿童经历，更不能把经典理论阶段当作已被全部证实的发展事实。<\/p>","recall":[{"q":"本我、自我、超我是否对应无意识、意识、前意识？","a":"不一一对应。前者是功能结构，后者是觉察层次；自我与超我也有无意识成分。"}],"syllabus_topic":2},{"id":"c112-13","title":"自我防御机制：定义、类型与例子","outline":"专题二：心理学理论","level":"掌握","keywords":["防御机制","压抑","投射","否认","合理化","升华"],"body_html":"<p>精神分析认为，防御机制是自我在冲突和焦虑面前进行的、通常并非有意识的心理调节方式。弗洛伊德奠定相关思想，安娜·弗洛伊德等进一步整理。防御不是一律有害，关键在于使用是否僵化、是否严重歪曲现实及是否妨碍实际解决问题。<\/p><h4>常考类型<\/h4><p>压抑：使令人痛苦的冲突内容难以进入意识；否认：拒绝承认威胁性现实；投射：把自己难接受的感受归给他人；置换：把情绪转向较安全的对象；反向形成：表现出与难接受冲动相反的态度；合理化：为行为提供看似合理而回避真实冲突的理由；退行：压力下出现较早阶段的应对；升华：把冲动引向社会认可的活动。<\/p><h4>实例与易错点<\/h4><p>受上级批评后回家向家人发火可说明置换；考试失利后只说“考试毫无价值”可能体现合理化。但同一行为有多种原因，案例中的机制应写“可能”，不能凭一句话作诊断。压抑不同于有意识地暂时搁置；合理化也不同于提供经事实支持的客观解释。简答题用“定义—缓解焦虑的功能—四至六种机制及短例—适应性评价”即可形成完整答案。<\/p>","recall":[{"q":"投射和置换怎样区分？","a":"投射是把自身难接受的心理内容归给别人；置换是把原来指向一个对象的情绪转向另一个对象。"}],"syllabus_topic":2},{"id":"c112-14","title":"荣格：集体无意识、原型与个体化","outline":"专题二：心理学理论","level":"掌握","keywords":["荣格","集体无意识","原型","人格面具","阴影","个体化"],"body_html":"<p>荣格的分析心理学区分个人无意识与集体无意识。个人无意识与个体经历、被遗忘或未充分意识到的内容有关；集体无意识则是其理论假设的人类共有的深层心理倾向。原型是组织经验和意象的普遍模式，不是所有人脑中存着完全相同的一张具体图画。<\/p><h4>常见原型<\/h4><p>人格面具指适应社会角色而呈现的面貌；阴影指自我不愿承认、被排斥的方面；自性强调人格的整体性与整合方向。阿尼玛、阿尼姆斯是荣格在其时代性别框架下提出的概念，答题宜说明历史背景，避免把性别刻板判断当成现代事实。个体化是逐步整合意识与无意识、发展较完整人格的过程，不是任性地排斥他人。<\/p><h4>应用与评价<\/h4><p>例如一个人只允许自己表现能干，不能承认脆弱，可借“面具与被否认部分的整合”进行反思。其理论重视象征、文化和人格整合，但集体无意识的遗传方式与原型命题难以直接验证。论述集体无意识可按“与个人无意识比较—原型定义—主要原型—个体化—文化意义及证据局限”组织。<\/p>","recall":[{"q":"原型是否就是一幅人人遗传下来的固定图画？","a":"不是。按荣格理论，原型是形成和组织意象的倾向或模式，具体形象仍受经验与文化影响。"}],"syllabus_topic":2},{"id":"c112-15","title":"阿德勒个体心理学：自卑、补偿与社会兴趣","outline":"专题二：心理学理论","level":"运用","keywords":["阿德勒","自卑","补偿","生活风格","社会兴趣"],"body_html":"<p>阿德勒强调把人理解为有目标、处于社会关系中的整体。“个体心理学”中的个体强调不可分割的整体性，而非只顾个人利益。人会体验不足与自卑感，并努力克服困难、发展能力；适度自卑感可能成为成长动力，僵化而强烈的自卑情结则可能妨碍行动。<\/p><h4>理论要点<\/h4><p>补偿指弥补不足的努力；追求优越更宜理解为趋向完善与克服困难，不一定是压倒他人。生活风格是个体形成的、理解自己和世界并追求目标的惯常方式。社会兴趣指与他人合作、关心共同福祉的取向，是健康适应的重要标准。出生顺序是其讨论家庭经验的线索，不能被当作决定人格的固定公式。<\/p><h4>结合经历作答<\/h4><p>示例：因公开表达较弱而回避讨论，后来把目标由“绝不能出错”改为“帮助同学理解一点”，从小组讲题开始练习。这可依次对应自卑感、生活风格、目标调整、补偿与社会兴趣。若写自身经历，应换成真实事件。评价可肯定其社会情境和主动性视角，同时指出概念较宽泛、对个案的解释需要证据支持，不能把所有奋斗都简化为自卑补偿。<\/p>","recall":[{"q":"阿德勒的“追求优越”是否必然指压倒别人？","a":"不是，主要指克服不足、趋向完善；是否兼顾社会兴趣，是其评价适应的重要标准。"}],"syllabus_topic":2},{"id":"c112-16","title":"埃里克森心理社会发展八阶段","outline":"专题二：心理学理论","level":"掌握","keywords":["埃里克森","心理社会危机","同一性","毕生发展"],"body_html":"<p>埃里克森继承精神分析对发展与冲突的关注，突出自我的能动性、社会文化及毕生发展。各阶段有重要的心理社会任务，危机并非必然指灾难，而是发展中的张力与转折；不同任务也可能在后续生活重新出现。<\/p><table><thead><tr><th>时期<\/th><th>主要冲突<\/th><th>积极品质<\/th><\/tr><\/thead><tbody><tr><td>婴儿期<\/td><td>信任对不信任<\/td><td>希望<\/td><\/tr><tr><td>幼儿期<\/td><td>自主对羞耻、怀疑<\/td><td>意志<\/td><\/tr><tr><td>学前期<\/td><td>主动对内疚<\/td><td>目的<\/td><\/tr><tr><td>学龄期<\/td><td>勤奋对自卑<\/td><td>能力<\/td><\/tr><tr><td>青春期<\/td><td>同一性对角色混乱<\/td><td>忠诚<\/td><\/tr><tr><td>成年早期<\/td><td>亲密对孤独<\/td><td>爱<\/td><\/tr><tr><td>成年中期<\/td><td>繁衍、关怀对停滞<\/td><td>关怀<\/td><\/tr><tr><td>成年晚期<\/td><td>自我整合对绝望<\/td><td>智慧<\/td><\/tr><\/tbody><\/table><h4>理解与应用<\/h4><p>同一性是对“我是谁、重视什么、走向哪里”形成相对连贯的认识；繁衍感也包括教育、创造和照顾下一代，不限于生育。年龄划分因教材和文化而异，复习重点是顺序、冲突及发展任务。相较弗洛伊德，它扩大了社会文化和成年期的地位；局限在于阶段边界并非对所有人都固定一致。教育应用应提供与任务匹配的支持，不能把一次失败视为人格终身定型。<\/p>","recall":[{"q":"埃里克森相较弗洛伊德的重要发展是什么？","a":"强调自我、社会文化与毕生发展，把发展任务延伸至成年和老年，并用心理社会冲突来解释。"}],"syllabus_topic":2},{"id":"c112-19","title":"罗杰斯以人为中心：自我概念与人际交往","outline":"专题二：心理学理论","level":"运用","keywords":["罗杰斯","共情","无条件积极关注","真诚一致","自我概念"],"body_html":"<p>罗杰斯认为，人具有成长与实现潜能的趋向；个体如何理解自己的经验、形成自我概念，会影响适应。若只有符合他人要求才得到接纳，便可能形成“价值条件”，为了维持被接纳的自我形象而否认真实体验；自我概念与实际经验的不协调可能带来紧张。<\/p><h4>三项核心关系条件<\/h4><p>真诚一致：沟通者不过度戴面具，并恰当觉察和表达自己的体验；无条件积极关注：尊重对方作为人的价值；共情理解：努力从对方的立场理解其感受与意义，再检验自己理解得是否准确。无条件关注不等于赞同所有行为，共情也不同于替对方做决定。<\/p><h4>人际应用答题示例<\/h4><p>同学考差后，可先说“这次付出很多却没达到期待，让你很失落”，再确认其真正担忧，保持尊重，协商其愿意采取的下一步，而不是马上贴“你就是不努力”的标签。论述可写“理论基础—三条件—倾听与反馈的行动—自主选择—合理边界”。理论贡献是尊重主体和关系质量；若情境需要明确教学、资源或具体措施，单靠温暖态度仍不足以解决所有问题。<\/p>","recall":[{"q":"无条件积极关注是否等于没有边界？","a":"不是。它接纳人的价值，同时可以对伤害行为表达界限，对事实和责任保持清晰。"}],"syllabus_topic":2},{"id":"c112-21","title":"皮亚杰：认知建构、同化顺应与阶段","outline":"专题二：心理学理论","level":"理解","keywords":["皮亚杰","图式","同化","顺应","平衡化"],"body_html":"<p>皮亚杰强调儿童在与环境的活动中主动建构知识。图式是理解和作用于事物的组织方式；同化是利用已有图式理解新经验，顺应是为了适应新经验而修改图式；平衡化是二者协调、推动认知发展的过程。把所有四脚动物都叫“小狗”是同化，了解猫狗差异后调整分类则体现顺应。<\/p><h4>四阶段与特点<\/h4><p>感知运动阶段主要通过感觉和动作认识世界，逐渐形成客体永久性；前运算阶段发展符号活动，但守恒和去中心化尚有限；具体运算阶段能围绕具体事物进行可逆的逻辑运算，理解守恒与分类；形式运算阶段发展抽象和假设演绎推理。常用年龄大致为0—2岁、2—7岁、7—11/12岁和11/12岁以后，边界并非诊断标准。<\/p><h4>教育应用与评价<\/h4><p>教学应考虑学习者已有理解，安排可操作的材料与适度认知冲突，让其解释和验证，而不是只灌输答案。贡献是揭示儿童思维的主动性和结构变化；后续研究提示儿童能力可能受任务表达影响，发展也受领域经验与文化影响。此理论属于认知发展研究，不应与成人记忆的信息加工模型混成同一理论。<\/p>","recall":[{"q":"同化与顺应怎样用一个例子区分？","a":"先用“狗”的旧图式称呼猫是同化；了解差异后修改动物分类图式是顺应。"}],"syllabus_topic":2}],"topics":[{"number":1,"numeral":"一","title":"心理学流派","requirements":"掌握\n心理学流派的主要观点（包括行为主义、精神分析、人本主义等），心理学流派的代表人物及其观点\n理解\n心理学各个流派的特点，流派间的区别，流派的起源与发展过程\n运用\n心理学流派的现代进展及趋势"},{"number":2,"numeral":"二","title":"心理学理论","requirements":"掌握\n各个流派中的重点理论内容及其提出者\n理解\n相关理论间的区别\n运用\n各个理论在现实生活中的运用"}]},{"code":"212","title":"心理学研究方法","overview":"研究方法围绕两个专题展开：心理学实验设计的基础概念，以及方法类别和设计思路。基础概念包括信度、效度、变量、操作定义和额外变量控制；方法与设计包括抽样、观察、问卷、相关研究、实验类型及完整研究方案。学习时把研究问题、变量操作、比较方式和统计分析联系起来，理解每种方法能够回答什么问题。","cards":[{"id":"c212-02","title":"研究信度、研究效度与测量信效度","outline":"专题一｜心理学实验设计的基础概念","level":"掌握","keywords":["信度","效度","内部效度","外部效度","构念效度","统计结论效度"],"body_html":"<p><strong>信度<\/strong>关心在可比条件下所得资料是否一致、稳定，例如重复测量是否接近、不同观察员是否给出相近编码。<strong>效度<\/strong>关心证据能否支持拟作出的解释和结论。可靠地测错对象，仍然没有达到测量目的。因此，良好信度是有效测量的重要基础，却不能单独保证效度。<\/p><h4>两层概念必须分开<\/h4><p>研究设计的效度通常包括：内部效度（结果变化能否归因于处理）、外部效度（能否推广到其他人群、情境和时间）、构念效度（所操纵和测量的操作是否代表理论概念）、统计结论效度（统计推断是否合适、精确）。测验的效度证据则常按内容、效标关联和构念来组织。两者有关联，但不是同一分类表。<\/p><p>例如，一份只问“考试前担心”的量表可能重测很稳定，却不足以代表全部焦虑；随机实验若两组指导语不同，纵使该量表信度高，也不能把差异完全归于干预。重测、复本、内部一致性和评分者一致性分别检验不同误差来源，不能相互替代。<\/p><h4>关系与改进<\/h4><p>随机误差增大通常削弱稳定性并使有效推断更困难；系统性偏差可以使结果稳定地偏离目标。提高信度可用明确评分规则、标准化程序、合适测量次数和训练评分员；提高研究效度还需随机分配、合理对照、避免混淆及合适抽样。研究层面的信效度评价的是整项研究的证据质量；测量层面的信效度评价的是具体工具分数的稳定性及其解释依据。<\/p>","recall":[{"q":"信度很高就能说明实验因果结论可靠吗？","a":"不能。工具稳定不等于控制了组间差异、历史或其他混淆；因果解释还需内部效度证据。"}],"syllabus_topic":1},{"id":"c212-03","title":"内部效度及其主要威胁","outline":"专题一｜心理学实验设计的基础概念","level":"掌握","keywords":["内部效度","历史","成熟","回归","选择","流失"],"body_html":"<p>内部效度是对“观察到的因变量差异由研究处理引起”这一解释的支持程度。核心不是实验场地是否在室内，而是有没有足以解释结果的替代原因。因果推断通常要求变量有关系、原因先于结果，并通过设计与证据排除主要替代解释。<\/p><h4>常见威胁与对应控制<\/h4><ul><li><strong>历史：<\/strong>处理期间发生其他事件；设置同期对照并记录事件。<\/li><li><strong>成熟：<\/strong>自然成长、疲劳或恢复；用相同时间跨度的对照。<\/li><li><strong>测验效应：<\/strong>前测练习改变后测；用平行工具、合适间隔或所罗门四组设计。<\/li><li><strong>仪器变化：<\/strong>设备校准、评分标准或评分员改变；固定并核验测量程序。<\/li><li><strong>统计回归：<\/strong>按极高或极低分选人后，随机误差使再测趋近平均；不能误认成治疗效果。<\/li><li><strong>选择偏差：<\/strong>处理前组间已不同；优先随机分配，辅以基线信息。<\/li><li><strong>差异流失：<\/strong>两组退出者特点不同；报告流失数量、原因并做敏感性分析。<\/li><\/ul><p>练习：某班压力极高的学生自愿参加课程，结束后分数下降。不能立即认定课程有效，因为自然恢复、回归、共同考试结束和自愿者特征都可能解释变化。可以设置同期比较组、随机分配处理、记录考试进程及其他同期事件，并对极端分数入组造成的回归现象保持注意。前测“无显著差异”也不是证明两组完全相同，尤其在样本小时。<\/p>","recall":[{"q":"为什么只挑最焦虑的人干预后再测，容易误判？","a":"极端分数可能含偶然误差，再测自然回归平均；还可能有成熟、历史等因素，需要适当对照。"}],"syllabus_topic":1},{"id":"c212-04","title":"外部、构念与统计结论效度","outline":"专题一｜心理学实验设计的基础概念","level":"理解","keywords":["外部效度","生态效度","构念效度","统计结论效度"],"body_html":"<p><strong>外部效度<\/strong>涉及把研究结果推广到目标人群、场景、时间和操作条件的合理性。便利抽取同一个班的学生，即使实验内部控制严密，也不能直接代表所有成年人。生态效度尤其关注任务、情境和行为与真实生活的联系。模拟驾驶可安全控制危险，但模拟中的碰撞指标并不等同于道路事故率。<\/p><p><strong>构念效度<\/strong>关注理论概念与具体操作之间的对应。例如以“手机屏幕总时长”代表“问题性社交媒体使用”可能混入工作学习时长；只用反应时代表注意水平，会漏掉错误率和速度—准确性权衡。改进方法包括清晰定义、采用多个恰当指标、检验操纵是否产生预期心理变化，并排除同时改变的非目标成分。<\/p><p><strong>统计结论效度<\/strong>关注变量是否确有关系以及关系大小的推断是否可靠。样本过小、测量噪声大、检验假设违背、反复尝试分析只报告显著结果，都可能导致错误结论。应事先明确主要结局和分析、按效应和精度规划样本、报告效应量及区间，并检查数据结构与模型条件。<\/p><h4>四类效度的联系<\/h4><p>内部与外部效度可能有现实权衡，但不是必然此消彼长；可以通过多场景重复和代表性招募兼顾。统计显著不能补救混淆，真实场景也不自动保证代表性。评价研究时依次问：测对了吗、因果说得通吗、统计合适吗、能推广到哪里？<\/p>","recall":[{"q":"模拟驾驶结果怎样表达推广范围？","a":"说明支持所研究被试、音乐条件和模拟任务中的差异；真实事故影响需要道路数据或其他研究继续验证。"}],"syllabus_topic":1},{"id":"c212-05","title":"变量分类：自变量、因变量与混淆变量","outline":"专题一｜心理学实验设计的基础概念","level":"掌握","keywords":["自变量","因变量","额外变量","中介","调节"],"body_html":"<p><strong>自变量<\/strong>是研究者操纵或用于比较的因素；<strong>因变量<\/strong>是观察的结果；<strong>额外变量<\/strong>是研究目的之外但可能影响结果的因素。额外变量若与自变量系统地共同变化，使效应来源无法区分，就形成混淆。并非所有额外变量都已成为混淆变量。<\/p><h4>自变量的常见类型<\/h4><p>可以按来源分为刺激特点（亮度、声音强度）、环境特点（噪声、温度）、任务或指导语（记忆要求、反馈方式）以及被试属性（年龄、驾龄、既有能力）。前三类通常可以操纵，被试属性多为选择变量，不能随机让某人变成“二十年驾龄”。选择变量间的差异须保留因果解释边界。<\/p><p>因变量可用行为正确率、反应时、次数、持续时间、自陈分数或生理指标表示。指标须敏感、可靠、符合构念，并避免天花板、地板效应。把“注意力好不好”写作因变量还不够，要补测量程序和评分单位。<\/p><p><strong>中介变量<\/strong>说明可能的作用路径，如学习方法通过复习投入影响成绩；<strong>调节变量<\/strong>说明何时或对谁关系不同，如反馈效果随任务难度改变。横断面问卷中的中介模型不能独自证明过程的因果顺序。控制变量是设计或分析中控制的因素，但不应不加理论判断地把所有可测因素都放入回归。<\/p><h4>变量识别示例<\/h4><p>比较不同音乐对驾驶注意的影响时，音乐类型是可操纵自变量，漏报率是因变量；驾龄是既有被试属性；睡眠不足是可能影响注意的额外变量。若摇滚乐始终在晚上测试、轻音乐始终在上午测试，音乐与时段系统重合，时段便成为混淆变量。每个因素还需明确水平，以及由不同被试接受还是由同一被试反复接受。<\/p>","recall":[{"q":"额外变量和混淆变量有什么区别？","a":"额外变量可能影响因变量；当它与自变量系统共变并构成替代解释时，才成为混淆变量。"}],"syllabus_topic":1},{"id":"c212-06","title":"操作定义：把抽象概念变成可复核的程序","outline":"专题一｜心理学实验设计的基础概念","level":"运用","keywords":["操作定义","可观察","可重复","测量指标"],"body_html":"<p>操作定义是以具体的操作、测量程序或可观察指标界定研究变量。它回答“在本研究中，怎样制造、识别或测量这个概念”。概念定义回答概念的理论含义，两者应相互对应，操作定义却不能穷尽概念全部内涵。<\/p><h4>三种常见写法<\/h4><p>程序描述法：把某种状态界定为一个明确的处理程序，如任务前进行规定时长的压力任务。动态特征描述法：以行为频率、持续时间或反应模式界定。静态特征描述法：以某时点的可测特征和阈值界定。无论哪种方法，都需写清对象、条件、步骤、记录单位和计分方式。<\/p><p><strong>例题：<\/strong>“注意水平”的操作定义可写为：在固定时长模拟驾驶中，对预设危险信号作出制动反应的中位反应时及漏报比例；反应时只纳入预先界定的有效试次，漏报按全部目标事件计算。音乐条件则应说明类型、播放时段、音量与设备，不能只写“听轻音乐”。<\/p><h4>特征、作用和限度<\/h4><p>好的操作定义具体、可观察、可执行、可重复，并与理论概念相关。其作用是减少理解歧义，使假设可检验，使他人可以复核和重复，也便于比较不同研究。局限是同一构念存在多种操作化，不同指标可能只反映其中一面。因此可采用多方法、多指标交叉验证。操作定义不能是循环解释：“焦虑就是感到焦虑”没有提供观察或测量规则；“采用指定焦虑量表，在规定时间窗内作答并按统一规则计总分”才给出了可执行的测量程序。<\/p>","recall":[{"q":"操作定义“记忆力=记忆能力”为什么不合格？","a":"只是同义重复，未写明任务、材料、时间和计分。可改为学习20个词后一周自由回忆正确词数。"}],"syllabus_topic":1},{"id":"c212-07","title":"额外变量控制：六种方法与选用理由","outline":"专题一｜心理学实验设计的基础概念","level":"运用","keywords":["排除法","恒定法","匹配","随机化","平衡","统计控制"],"body_html":"<p>额外变量控制的目标是使处理效应与其他来源的影响尽量分离，同时减少无关变异。各方法分别作用于干扰来源、实施条件、被试差异、呈现顺序或统计模型，通常需要根据研究情境组合使用。<\/p><ul><li><strong>排除法：<\/strong>消除干扰来源，如用隔音房排除外界噪声；但可能削弱真实情境的代表性。<\/li><li><strong>恒定法：<\/strong>所有条件使用相同光照、时段、设备和指导语；结论相应限于这些水平。<\/li><li><strong>匹配法：<\/strong>先测与结果密切相关的属性，再匹配后分配处理；适合已知、可测的重要个体差异。<\/li><li><strong>随机化法：<\/strong>随机分配被试或呈现刺激，使已知和未知差异在概率意义上平衡；不是保证任何一个小样本绝对相等。<\/li><li><strong>抵消平衡法：<\/strong>使不同条件出现在不同位置，控制练习、疲劳和顺序影响；不可逆处理不宜仅靠轮换解决。<\/li><li><strong>统计控制：<\/strong>用预先合理选定的协变量等模型调整差异；依赖测量和模型假设，不能自动消除未测混淆。<\/li><\/ul><p>例题：研究音乐对驾驶注意的影响，可以恒定音量与道路难度，随机分配音乐顺序，测量睡眠与疲劳，并用休息降低携带效应。若每种音乐都配一种不同道路，则道路与音乐混淆，事后只加入年龄协变量无济于事。不要为得到显著结果任意删被试、删条件；排除规则应有事前依据。<\/p>","recall":[{"q":"为什么统计控制不能替代好设计？","a":"它只能处理所测并正确建模的变量，不能保证消除未测混淆、测量误差或错误因果调整。"}],"syllabus_topic":1},{"id":"c212-08","title":"随机抽样、随机分配、匹配与区组","outline":"专题一｜心理学实验设计的基础概念","level":"理解","keywords":["随机抽样","随机分配","匹配","随机区组"],"body_html":"<p><strong>随机抽样<\/strong>是从目标总体选择谁参加，主要服务于代表性和总体推断；<strong>随机分配<\/strong>是把已参加的人分到哪种条件，主要用于提高组间可比性和内部效度。便利招募后仍可随机分配形成随机实验；概率抽样后若按原班级接受不同教学，也未必是个体随机实验。<\/p><p>简单随机分配可借助随机数，使每人依预定概率进入各组。随机化不会消除测量误差，也不会使已发生的违规执行和差异流失自动无害。样本小、关键属性与因变量关系强时，可按基线能力形成区组，在区组内部随机分配。这样既控制已知差异，又保留随机化。<\/p><p><strong>匹配<\/strong>是把被试按一个或少数关键属性组成相近的对或组；应优先选择与因变量相关、可靠测量且在处理前已存在的变量。匹配后还须说明如何分派处理。匹配变量越多，找到合适配对越困难；也不能匹配所有未知因素。<\/p><h4>例题<\/h4><p>比较两种词汇学习法，先按前测词汇水平组成相近的配对，再在每对内随机指定方法A或B。这是匹配后随机分配。分析需考虑配对或区组结构，不能完全当成无关样本。若只挑分数相近者而让他们自行选方法，仍可能存在动机等选择偏差。<\/p><h4>一句辨析<\/h4><p>抽样回答“代表谁”，分配回答“怎样可比”；匹配和区组回答“怎样降低已知差异的干扰”。<\/p>","recall":[{"q":"从全校随机抽人，再让自愿者选干预，是否随机实验？","a":"不是。抽样随机不等于处理分配随机；自选干预可能造成动机和基线差异。"}],"syllabus_topic":1},{"id":"c212-09","title":"期待效应、盲法、对照条件与操纵检验","outline":"专题一｜心理学实验设计的基础概念","level":"运用","keywords":["盲法","期待效应","需求特征","对照组","操纵检验"],"body_html":"<p>研究者预期可能通过语气、指导、反馈或评分影响结果；被试也可能根据线索猜测研究目的并迎合或抵抗，这叫需求特征相关影响。知道自己正在被观察也可能改变行为。控制这类效应，须从接触、实施、测量与评分各环节设计。<\/p><p><strong>盲法<\/strong>要求明确谁不知道什么：被试不知道分组、评估者不知道分组、分析者不知道条件编码，都是可描述的措施。“双盲”不是简单地研究者与被试都不知道正在做研究。心理干预参与者往往能识别训练内容，无法完全盲化时，可以至少盲化结果评估者，标准化沟通并测量期待。<\/p><p>对照组不只等于“什么都不做”。等待名单、无处理、常规活动、注意力对照或另一种可信干预，分别排除不同解释。若实验组既练习又得到额外关心，而对照组无接触，结果可能混入人际支持和期待效应。对照应与研究问题匹配，不必为形式对称牺牲伦理。<\/p><p><strong>操纵检验<\/strong>检验处理是否改变了预期过程，例如压力任务后紧张评分是否变化；它不等于结果变量的假设检验，也不能证明处理只改变了这一心理成分。可通过预测试或不干扰主任务的安排实施。<\/p><h4>控制示例<\/h4><p>评价一种注意训练时，可让两组接受等时长、同样可信的活动，使用统一指导语，由不知道组别的评分员评价表现，并记录参与者对改善的期待。这样可减少额外接触、评分倾向和期待差异造成的影响；训练内容能够被参与者识别时，被试盲化仍有局限。<\/p>","recall":[{"q":"“两组都做一个活动”是否足够成为好对照？","a":"不一定。应核对时长、接触、期待、任务难度等是否与研究问题有关，避免多个成分同时变化。"}],"syllabus_topic":1},{"id":"c212-10","title":"顺序效应、携带效应与抵消平衡","outline":"专题一｜心理学实验设计的基础概念","level":"运用","keywords":["被试内","练习效应","疲劳","ABBA","拉丁方"],"body_html":"<p>同一被试接受多个条件可以减少个体差异，却会产生顺序问题：练习使后做条件更熟练，疲劳使后做条件更差，前一处理还可能改变后一条件的心理状态，这叫携带效应。条件若总按A后B出现，条件与位置无法分开。<\/p><h4>控制策略<\/h4><p>两个条件可使一半被试AB、另一半BA；完全抵消平衡使用全部可能顺序，k个条件有k!种，条件较多时成本迅速增加。部分平衡只选部分顺序，需说明选择依据。普通拉丁方使每种条件在每个位置出现一次，但并不必然平衡所有相邻携带关系；平衡拉丁方还需满足相邻关系的安排。<\/p><p>ABBA把前后位置作对称安排，可缓解近似线性的练习或疲劳趋势，却不是对所有非线性变化都有效。也可随机化试次、先充分练习、设置休息或洗脱期，采用不同而等值的材料。分析中仍应按重复测量结构处理数据。<\/p><p>若处理会造成不可逆学习、持续治疗效应或被试猜出研究目的，换顺序不能恢复原状态，应考虑被试间设计。不要把“每个人做所有条件”与“所有条件各自独立”混淆。<\/p><h4>例题<\/h4><p>三种声音条件若只用ABC、BCA、CAB，可平衡条件位置，但某些相邻组合出现频率不均。若担心前一种音乐残留，应增加针对携带效应的平衡、休息，或改用组间设计。<\/p>","recall":[{"q":"普通拉丁方保证所有顺序效应都消失吗？","a":"不保证。它主要平衡位置，一阶或更复杂携带效应须另作设计和检验。"}],"syllabus_topic":1},{"id":"c212-01","title":"从研究问题到可检验假设","outline":"专题二｜方法类别和设计思路","level":"掌握","keywords":["研究问题","假设","可证伪性","研究程序"],"body_html":"<p>心理学研究通过系统收集证据描述、解释、预测心理与行为，必要时检验干预能否改变结果。一个好的问题既有理论或现实价值，又须具体、可操作、可检验并符合伦理。例如，“怎样提高学习成绩”太宽；“间隔复习与集中复习相比，能否提高一周后的词语回忆正确率”才明确了对象、处理与结果。<\/p><h4>科学研究的基本流程<\/h4><ol><li>从理论、实际问题和文献不足提出研究问题。<\/li><li>界定概念，形成有依据、可被数据反驳的假设。<\/li><li>确定总体、抽样、研究方法及变量操作定义。<\/li><li>预测试，完善工具与程序，完成伦理和知情同意安排。<\/li><li>依计划收集、编码、核查资料，选择符合设计的分析。<\/li><li>报告结果、解释支持程度、讨论限制和后续问题。<\/li><\/ol><p>假设应写成变量关系的陈述句，而不是研究愿望。方向性假设如“间隔组延迟回忆率高于集中组”；非方向性假设只预测有差异。理论假设需进一步转换为可计算的统计假设。显著结果能为假设提供支持，不能一次证明整个理论永远正确。精确重复检验相同程序能否再现结果，概念重复考察换一种操作化后关系是否仍存在。<\/p><h4>假设与研究方案的联系<\/h4><p>研究问题指明要解释的现象，理论依据提供预期关系，操作定义把概念变成可观察指标，研究设计决定如何比较，统计分析检验预测与资料是否相容。可行性和伦理要求贯穿整个过程。<\/p>","recall":[{"q":"怎样把“音乐影响注意”写成可检验假设？","a":"明确音乐条件、被试、任务与指标，如在相同模拟驾驶任务中，轻音乐条件的危险信号漏报率低于无音乐条件；再预先规定比较方法。"}],"syllabus_topic":2},{"id":"c212-11","title":"抽样方法：简单、分层、整群和多阶段","outline":"专题二｜方法类别和设计思路","level":"掌握","keywords":["总体","样本","分层抽样","整群抽样","代表性"],"body_html":"<p>总体是研究希望推断的全部对象，样本是实际研究的其中一部分。先定义总体与抽样框，再决定抽样方法；样本大不等于代表性好。便利抽样、滚雪球抽样可服务探索或难接近人群，但须坦诚总体推广的限制。<\/p><p><strong>简单随机抽样：<\/strong>按随机机制从总体单位中抽取；有清楚名册时容易说明概率，但大总体逐一列名可能费时。<strong>分层随机抽样：<\/strong>按与研究有关的属性把总体分成互不重叠、合计覆盖总体的层，再在各层内随机抽样。层内相对同质、层间有差异时，通常有利于精度和各亚群体代表性。可按比例分配，也可为小群体比较过度抽样，后者总体估计时需合适权重。<\/p><p><strong>整群抽样：<\/strong>抽取学校、班级等自然群体，再调查入选群体成员，组织成本低，但群内相似性使有效信息少于同人数简单随机样本。<strong>多阶段抽样：<\/strong>如先抽学校、再抽班级、最后抽学生，方便大范围实施，分析须考虑层级与设计。<\/p><h4>分层随机抽样的实施步骤<\/h4><ol><li>明确目标总体和抽样框，选择与研究指标有关且能够获得的信息作为分层依据。<\/li><li>把总体划为互不重叠、覆盖全部成员的层，如按年级分层。<\/li><li>确定总样本量及各层样本量；比例分配时，第h层样本量约为nₕ=n×Nₕ/N。<\/li><li>在每层内部独立进行随机抽取，再合并为样本。<\/li><li>记录各层纳入概率及未回应情况；采用不等比例分配时，总体估计需使用适当权重。<\/li><\/ol><p>例如四个年级分别占学生总数的20%、25%、25%、30%，计划按比例抽200人，可分别抽40、50、50、60人。优点是保障亚群体代表、在合适分层下提高精度；局限是需要完整分层信息，实施和加权较复杂。层数并非越多越好，也不是所有情况下都比简单随机更精确。<\/p>","recall":[{"q":"分层和整群的关键区别是什么？","a":"分层是每一层都抽人，强调各层代表；整群是抽部分群，再研究其成员，强调实施便利并须处理群内相关。"}],"syllabus_topic":2},{"id":"c212-12","title":"系统随机抽样：步骤、优缺点与周期陷阱","outline":"专题二｜方法类别和设计思路","level":"运用","keywords":["系统抽样","等距抽样","随机起点","周期性"],"body_html":"<p>系统随机抽样又称等距抽样：按既定顺序排列总体单位，确定固定间隔，再从第一间隔内随机选起点，沿名册每隔固定间隔抽取一个单位。“随机起点”是关键，随意从第一个人开始不能完整体现概率抽样设计。<\/p><h4>例题<\/h4><p>某总体有1000人，计划抽100人，间隔k=1000/100=10；若在1至10中随机抽到7，则抽第7、17、27……997号。实际总体数与样本数不整除时应制定相应系统抽样规则，不能为了凑数随意补人。<\/p><p><strong>优点：<\/strong>执行简便、选择分布于整份名单、便于现场组织；当名单顺序与研究特征配合得当时可能提高精度。<strong>局限：<\/strong>若总体排列存在周期，且周期与抽样间隔重合，样本可能系统偏向某类人。例如名单每10人都按同一种岗位顺序排列，间隔10可能总抽到同一个岗位。不能笼统说系统抽样必然误差更小。<\/p><h4>实施步骤与偏差控制<\/h4><p>步骤为：确定总体和名册排序→计算间隔→抽取随机起点→等距取样→核查未回应与最终纳入情况。预防可检查排序，必要时随机打乱名单、改变设计或改用分层随机抽样。未响应者也不应随便用邻近一位替代，否则可能改变纳入概率。报告时要说明抽样框、排序方式、起点和间隔。<\/p>","recall":[{"q":"为什么等距抽样一定要检查名单周期？","a":"间隔可能与职位、班级等排序周期同步，使样本过度集中于某类单位，产生系统偏差。"}],"syllabus_topic":2},{"id":"c212-13","title":"观察法：类型、实施与局限","outline":"专题二｜方法类别和设计思路","level":"掌握","keywords":["观察法","时间取样","事件取样","观察者一致性"],"body_html":"<p>观察法是在明确目的和计划下，对行为及情境进行系统记录。自然观察强调在自然发生条件下记录；参与观察者进入活动，非参与观察者尽量保持旁观；结构化观察预定项目和编码，无结构观察较开放。这些分类依据不同，可以组合。<\/p><h4>怎样设计一个观察研究<\/h4><ol><li>明确对象、场景和研究问题。<\/li><li>给行为操作定义，如“帮助”须说明哪些动作算、哪些不算。<\/li><li>选择时间取样（按固定或抽取时段观察）或事件取样（出现目标事件时记录）。<\/li><li>规定频次、时长、强度或发生与否的编码。<\/li><li>训练观察员，进行独立编码并核验一致性。<\/li><li>记录背景、异常与观察者位置，说明同意和隐私安排。<\/li><\/ol><p><strong>优点：<\/strong>能获得实际行为，适于儿童、不易言语报告的人群或自然互动。<strong>局限：<\/strong>被观察者可能改变行为；观察者期待影响选择与记录；罕见行为难等到；难直接了解动机和内在体验；环境因素无法充分控制，通常不能单凭观察确立因果；编码和观察时段不当也会影响代表性。<\/p><p>改进不只是“多观察”，还要跨时段、明确规则、盲化编码和多观察员核查。时间取样较适合常见行为频率，事件取样有利于保留特定事件及其前后情境。例如，观察者期待可通过盲化和独立编码减轻，时段偏差可通过跨时段取样减轻，行为定义含糊可通过编码手册和一致性训练减轻。<\/p>","recall":[{"q":"观察到手机使用多的学生更少交流，能认定手机导致社交减少吗？","a":"不能。需考虑个性、课程安排、情绪和反向关系，观察证据本身无法充分排除替代解释。"}],"syllabus_topic":2},{"id":"c212-14","title":"问卷法与访谈法：设计、偏差与比较","outline":"专题二｜方法类别和设计思路","level":"运用","keywords":["问卷","访谈","社会赞许","回忆偏差","共同方法"],"body_html":"<p>问卷以统一的问题与回答格式收集资料，适合在较短时间了解较多人群的态度、经历和自陈行为；访谈通过交流获取资料，结构化访谈可比较性高，半结构化访谈在统一主题上允许追问，开放访谈更利于探索个人经验。<\/p><p>问卷编制应围绕研究问题，题目单一清楚，明确时间范围，避免双重提问、诱导措辞、双重否定和选项不全。例如把“你是否热爱学习并经常熬夜”拆成两个问题。先预测试理解程度与作答时间，再实施。问卷回收率与有效率是不同概念；有效问卷多也不能保证抽样无偏。<\/p><p>共同风险包括社会赞许、回忆不准、同意倾向、拒访或不回应，以及同一时间同一来源测量造成的共同方法影响。可通过匿名、合理排序、中性指导语、多来源或分时测量、客观记录核对等降低。反向题可能增加阅读误差，不是越多越好；统计检验也不能一次证明完全不存在共同方法偏差。<\/p><h4>比较与应用<\/h4><p>问卷经济、标准化、便于统计，但难澄清误解和深入机制。访谈细致、可追问，适于复杂经历，却耗时且受访谈者影响较大。研究“大学生社交媒体使用与心理健康”可先访谈形成变量，再用标准化调查估计关系。问卷中观察到负相关，应先说明量表高分含义，并保留方向不明、混淆与测量偏差等限制。<\/p>","recall":[{"q":"问卷发现使用时长与健康评分负相关，应怎样解释？","a":"在先确认高分代表更健康后，可说时长越长健康评分越低的统计关联；不能直接说使用造成健康下降。"}],"syllabus_topic":2},{"id":"c212-15","title":"个案、测验、内容分析及其他方法","outline":"专题二｜方法类别和设计思路","level":"掌握","keywords":["个案研究","测验法","内容分析","口语报告","社会测量"],"body_html":"<p><strong>个案研究<\/strong>对一个人、少量对象或特殊事件作深入追踪，综合访谈、观察、档案与测量，适合罕见现象、临床经历和理论生成。优势在深度、完整情境和过程资料；限制是个案可能特殊、缺少严密对照、资料解释受研究者影响，不宜直接估计人群比例或普遍因果。个案研究不等于有反复基线和操纵的单一被试实验。<\/p><p><strong>测验法<\/strong>用标准化任务或题目测量心理属性，可比较和量化，但须核对适用人群、信效度、常模与标准程序。测验是资料收集工具，不因使用量表就成为实验。<\/p><p><strong>内容分析<\/strong>对文字、影像等材料按预定单位与类别系统编码。须说明抽样范围、分析单位、类别定义及编码者一致性，不能只挑支持观点的材料。<strong>口语报告<\/strong>让被试描述任务中的思路，可分析认知过程，但报告未必涵盖自动加工，追溯报告也可能有记忆重构。<\/p><p><strong>社会测量<\/strong>以提名等方式分析团体关系，如班级友情网络，要保护人际选择信息，不能把单次提名视作永久人格标签。<strong>语义区分法<\/strong>让人对概念在“好—坏”等两极维度上评分。方法选择取决于问题：比例用调查，行为用观察，经历用个案或访谈，因果处理效果优先实验，多方法可相互补充。<\/p>","recall":[{"q":"个案研究的优点与局限怎么简答？","a":"深度了解稀有、复杂个案并生成假设；但代表性有限、控制不足、选择和解释偏差较大，需多来源证据与谨慎推广。"}],"syllabus_topic":2},{"id":"c212-16","title":"相关研究、横断追踪与质性量化","outline":"专题二｜方法类别和设计思路","level":"理解","keywords":["相关研究","横断面","纵向","队列效应","混合方法"],"body_html":"<p>相关研究在不随机操纵目标因素的情况下测量变量间关系，适于无法操纵、不能伦理操纵或需研究自然差异的问题。优点是范围广、较贴近实际，也可用于预测；局限是关系方向和第三变量解释通常无法完全排除。控制几个协变量后关系仍显著，也不等于因果得到证明。<\/p><p><strong>横断研究<\/strong>在同一时期比较不同对象或年龄组，快且成本低，但年龄差异可能混入出生队列、教育背景等差异。<strong>纵向研究<\/strong>反复测量同一批对象，有助于考察变化和时间先后，却受流失、练习、历史及成本影响。结合多个队列的序列设计可部分区分年龄、队列和时期影响，但并非自动消除全部混淆。<\/p><p>交叉滞后设计比较早期X对后期Y、早期Y对后期X的预测关系，可提供时序证据；模型选择、稳定的个体差异和未测共同原因仍影响解释，不能仅凭一条路径显著认定因果。<\/p><p><strong>量化研究<\/strong>强调变量、数值和统计关系；<strong>质性研究<\/strong>侧重经验、意义、过程和情境。质性也需要系统取样、资料记录、编码和反思，不能等于随意讲故事。混合方法研究把两者在设计和解释中有目的地结合，如先访谈建构问卷，再调查检验分布；这与“组间＋组内”的混合实验设计是不同概念。<\/p>","recall":[{"q":"混合方法研究与混合实验设计相同吗？","a":"不同。前者结合质性和量化资料；后者同时含组间因素和组内因素。"}],"syllabus_topic":2},{"id":"c212-17","title":"实验设计分类：前实验、准实验和真实验","outline":"专题二｜方法类别和设计思路","level":"掌握","keywords":["前实验","准实验","真实验","对照","随机化"],"body_html":"<p>实验研究的核心是对因素实施处理、观察结果并控制替代解释。实验室或现场是场景分类；真实验、准实验、前实验是控制与设计逻辑分类；单因素、多因素按因素数量分类；组间、组内、混合按被试参与条件分类。不同轴线可以交叉，不能放在同一层级互相排斥。<\/p><p><strong>前实验设计<\/strong>如单组后测X O、单组前后测O₁ X O₂，以及缺少充分控制的既有组后测比较。它们可用于试点和可行性探索，但对选择、历史、成熟等解释控制弱。<\/p><p><strong>真实验设计<\/strong>具有研究者操纵、适当对照和随机化等关键控制，如随机分组后的处理组与控制组比较。它在程序执行良好时能为因果提供较强证据。并非所有现场研究都是准实验，也不是研究者一贴“实验组”标签就成真实验。<\/p><p><strong>准实验设计<\/strong>实施或利用某种处理、政策或事件变化，但不能充分随机分配，通常借助不等组前后测、时间序列等加强比较。其现实可行性好，却更依赖关于组间可比和历史趋势的假设。<\/p><p><strong>实验法优点：<\/strong>能主动操纵研究条件、系统控制额外变量，在合理设计下加强因果推断；程序清楚还便于精确观察与重复。局限是部分变量不可操纵、情境可能人为化，且须遵守伦理与资源条件。<\/p><h4>易错点<\/h4><p>单纯比较既有男女成绩属于属性组比较或非实验研究，不能仅因“不随机”就自动叫准实验。判断要看是否有处理与可信的干预比较逻辑。设计符号中R表示随机分配，X表示处理，O表示观测；横向表示时间，分行表示组别。<\/p>","recall":[{"q":"现场实施随机分配的教学实验属于准实验吗？","a":"不因发生在现场而成为准实验；若操纵、对照与随机化满足真实验逻辑，可是现场真实验。"}],"syllabus_topic":2},{"id":"c212-18","title":"真实验：后测、前后测与所罗门四组","outline":"专题二｜方法类别和设计思路","level":"运用","keywords":["随机对照","前后测","所罗门四组","前测效应"],"body_html":"<p><strong>随机分组后测设计：<\/strong>R X O与R — O。随机化使处理前差异在概率意义上平衡，结束后比较组间结果；没有前测可避免前测敏感化，但缺少个体变化信息，随机化与样本量都要可靠。<\/p><p><strong>随机分组前后测设计：<\/strong>R O₁ X O₂与R O₃ — O₄。它能观察变化并利用基线提高精度，却须考虑前测练习和前测与处理的交互。检验处理效应可根据研究目标用后测基线调整、变化量比较或合适的组别×时间模型。不能用“实验组前后显著、对照组前后不显著”替代直接检验两组差异。<\/p><h4>所罗门四组设计<\/h4><p>把有无前测与有无处理结合，四组均随机分配：①前测—处理—后测；②前测—无处理—后测；③无前测—处理—后测；④无前测—无处理—后测。它可检验处理效应、前测效应及前测是否改变处理作用。代价是需要较多被试、执行和解释更复杂。<\/p><p>例题：怀疑“做过同理心前测”就让人意识到研究意图，可用四组设计判断训练效果是否只在做过前测者出现。选择设计的理由要与主要威胁对应，不是设计越复杂越好。无论哪种，都要说明分配机制、对照内容、主要指标、退出情况与分析方法。<\/p>","recall":[{"q":"一组显著、另一组不显著，能说明干预效应有组间差别吗？","a":"不能。需要直接检验组间变化差异或相应交互，两个显著性结论的差异不等于差异显著。"}],"syllabus_topic":2},{"id":"c212-19","title":"准实验：不等组、时间序列与相等时间样本","outline":"专题二｜方法类别和设计思路","level":"运用","keywords":["准实验","时间序列","不等组","政策评估"],"body_html":"<p>准实验用于现实中不能充分随机分配的干预评价。常见<strong>不等组前后测<\/strong>对原有实验组与比较组都先测后测，检查基线和变化。它比只看一个组的前后变化更有信息，但基线相近不表示所有未测因素相同，统计调整也有条件。<\/p><p><strong>中断时间序列<\/strong>在处理前后多次、等间隔或明确时间点观测，例如政策实施前后每月记录某行为，分析是否有超出原有趋势的即时水平变化或趋势变化。优点是能利用既有走势区别暂时波动和持续变化；局限是同期其他事件、季节变化、测量口径改变和自相关。加入未受处理的比较序列可增强解释。<\/p><p><strong>相等时间样本设计<\/strong>在可比较时段交替安排处理与非处理，比较结果；要求处理可撤除，需考虑顺序、携带和时段本身的差异。<strong>多组时间序列<\/strong>结合比较组与反复观测，比单一前后测更有力，但并非因此免于所有混淆。<\/p><h4>时间序列的分析重点<\/h4><p>水平变化指处理时点附近结果发生突升或突降；趋势变化指处理后增长或下降的速度发生改变。处理前的多次观测提供原有趋势的参照，处理后的多次观测有助于判断变化是短暂波动还是持续改变。不能把每天的数据都当独立样本简单做两组t检验。所需观测次数取决于变化形式、噪声、季节性和模型，不能把某个课堂经验数字写成所有研究的固定要求。<\/p>","recall":[{"q":"时间序列为什么比单组前后测有优势？","a":"它能观察处理前趋势及处理后变化持续性，有助区分原有走势与干预变化；但仍须防同期事件和序列相关。"}],"syllabus_topic":2},{"id":"c212-20","title":"被试间、被试内与混合设计","outline":"专题二｜方法类别和设计思路","level":"运用","keywords":["组间","组内","混合设计","重复测量","攻击行为"],"body_html":"<p><strong>被试间设计：<\/strong>不同被试接受不同条件。优点是避免条件间练习、携带和猜测；缺点是个体差异可能增大误差，通常需要更多被试。可通过随机分配、匹配或区组改善可比性。<\/p><p><strong>被试内设计：<\/strong>每位被试接受同一因素的全部水平或被反复测量。优点是每人作自身对照，减少个体差异影响；缺点是顺序、疲劳、携带和材料重复。须平衡顺序并用符合相关数据结构的方法分析。<\/p><p><strong>混合设计：<\/strong>至少一个组间因素加至少一个组内因素。例如干预组别（训练/对照）为组间，时间（前/后）为组内，构成2×2混合设计。两种教学方法×三个既有年级若每人只属于一个方法、一个年级，两个因素都是组间，不是混合设计。<\/p><h4>例题：大学生攻击行为<\/h4><p>招募大学生，随机分配情绪调节训练或等时长对照，两组都在前后用等值的低风险模拟任务记录攻击性反应评分。组别为组间，时间为组内，因变量为预定评分；统一材料、程序与评分，评估者盲化，记录流失并避免引发实际伤害。核心分析检验组别×时间交互，再解释组间变化差异，同时报告效应量和区间。这里的2×2表示两个因素各有两个水平；随机分配决定组别，前后测构成组内重复，完整方案还包括招募、指标、实施和分析。<\/p>","recall":[{"q":"混合设计最低需要什么？","a":"至少一个被试间因素和一个被试内因素。多因素本身不足以说明是混合设计。"}],"syllabus_topic":2},{"id":"c212-21","title":"多因素设计：主效应、交互作用与简单效应","outline":"专题二｜方法类别和设计思路","level":"理解","keywords":["因子设计","主效应","交互","简单效应","多因素优缺点"],"body_html":"<p>多因素设计在一个研究中考察两个或以上因素，完全析因设计包含各因素水平的全部组合。2×3设计有6种组合，不一定有6组互不相同的被试；组数还要看各因素属于组间还是组内。<\/p><p><strong>主效应<\/strong>是平均跨过其他因素水平后，某个因素的总体影响。<strong>交互作用<\/strong>是一个因素的作用取决于另一个因素水平。<strong>简单效应<\/strong>则是在另一因素某一固定水平上比较该因素。交互存在时，仅讲平均主效应可能掩盖关键模式。<\/p><h4>例题<\/h4><p>安静时，方法A、B的均分为80、70；噪声时均分为60、70。A相对B从高10分变为低10分，提示学习方法×环境的交互；平均后A、B都为70，没有方法主效应，却不意味着方法没有任何作用。图中不平行线提示交互模式，统计是否显著仍要结合误差和检验。<\/p><p><strong>优点：<\/strong>一次检验多个因素，提高信息量，可检验边界条件与交互，更贴近多原因的现实。<strong>局限：<\/strong>组合数量随水平增加、需要足够样本，控制与执行复杂，高阶交互难解释，多重检验也增多。因素水平表用于核对全部条件组合，主要假设区分主效应与交互，设计类型决定数据的独立或重复测量结构及相应分析。<\/p><p>不要把“两个主效应都显著”当成有交互；也不能把“一个条件显著另一个不显著”直接当交互显著。<\/p>","recall":[{"q":"交互作用与主效应有什么不同？","a":"主效应是跨其他因素平均后的差异；交互说明差异大小或方向随另一因素水平变化。"}],"syllabus_topic":2},{"id":"c212-22","title":"随机区组与拉丁方：把干扰纳入设计","outline":"专题二｜方法类别和设计思路","level":"理解","keywords":["随机区组","匹配","拉丁方","误差变异"],"body_html":"<p><strong>随机区组设计<\/strong>先按与结果相关的额外变量把被试或实验单位分成相对同质的区组，再在每个区组内随机安排各处理。区组用于吸收已知差异，处理效应主要通过区组内比较获得。例如按原有词汇水平高、中、低分层，在每层内随机分配三种学习法。<\/p><p>这种设计的优势是降低误差、提高比较精度；条件是区组变量测量可靠，与结果有关，并能在区组内安排处理。区组过多、过小会增加实施困难；若处理与区组有交互，简单加性区组模型可能不够，需相应样本和模型检验。区组不同于抽样分层：前者服务于处理比较，后者主要服务样本代表性。<\/p><p><strong>拉丁方设计<\/strong>可用有限安排平衡两个位置或区组维度：n种处理排列成n×n方阵，每种处理每行每列各出现一次。用于顺序安排时，它使各条件在各位置均衡；用于传统两种干扰因素控制时，行列分别表示干扰来源。<\/p><h4>选择时的限制<\/h4><p>拉丁方依赖适当的加性与设计条件，不能顺便估计所有复杂交互；普通拉丁方也不自动控制所有相邻携带效应。随机区组、匹配和顺序平衡可以组合，但必须写明随机化发生在哪一步、区组或顺序进入何种分析。不能把一次对照完全由某一个班担任、一次处理由另一个班担任，再把“班级”忽略成不存在。<\/p>","recall":[{"q":"区组变量选什么最好？","a":"选处理前已存在、能可靠测量、与因变量关系强的关键干扰来源，不能为控制而随意分组。"}],"syllabus_topic":2},{"id":"c212-23","title":"完整设计练习：音乐、驾龄与驾驶注意","outline":"专题二｜方法类别和设计思路","level":"运用","keywords":["模拟驾驶","3×3×3","操作定义","混合设计","因果边界"],"body_html":"<p><strong>例题：<\/strong>考察驾驶员类别（客车/货车/轿车）、驾龄（5/10/20年）与音乐类型（摇滚/轻音乐/民乐）对驾驶注意的影响。三个因素各有三个水平，下面采用同一驾驶员体验全部音乐条件的方案。<\/p><h4>变量和设计<\/h4><p>驾驶类别与驾龄为既有属性，通常作为组间选择因素；音乐可由同一驾驶员全部体验，作为组内操纵因素，形成3×3×3混合设计。理论上有27个条件组合，每位被试经历其中3个音乐条件，不能把27组合误写为27个独立组。若研究要检验“听音乐相对不听是否有益”，还需无音乐基线；加入后音乐因素变为4水平，必须与原三水平方案明确区分。<\/p><h4>因变量、程序与控制<\/h4><p>因变量可包括危险信号漏报率、有效反应中位时、车道偏离次数、模拟碰撞次数。预先指定主要指标，记录速度—准确性权衡。统一道路难度、车速要求、设备和音量，控制睡眠、疲劳、听力和音乐熟悉度；平衡音乐顺序与道路版本，设置练习及休息，核查每种驾龄类别能招募足够被试。<\/p><h4>分析与解释<\/h4><p>先描述各组合，再用适合重复测量结构的模型检验主要效应与交互；次数或极偏态指标可能需不同模型。音乐在随机顺序及充分控制下可支持较强因果解释，驾龄和类别的效应须保留选择因素限制。模拟碰撞不能直接等同实际事故率；在安全模拟环境完成，告知退出权。<\/p>","recall":[{"q":"此题哪些因素不能像音乐那样任意操纵？","a":"驾龄和驾驶员类别是既有属性，通常选择而不是随机赋予；把它们设为组间因素不等于消除了选择偏差。"}],"syllabus_topic":2},{"id":"c212-24","title":"完整研究方案与研究报告","outline":"专题二｜方法类别和设计思路","level":"运用","keywords":["研究报告","设计题","知情同意","透明报告","问卷案例"],"body_html":"<h4>完整研究方案的八个组成部分<\/h4><ol><li>研究目的与有方向或无方向的假设。<\/li><li>总体、招募、样本规划与分配方式。<\/li><li>自变量水平、组间/组内属性。<\/li><li>因变量及具体操作定义。<\/li><li>设计类型、对照和实施时间线。<\/li><li>额外变量及逐项控制办法。<\/li><li>数据核查、与设计相符的统计分析。<\/li><li>伦理、可行性、局限与结论范围。<\/li><\/ol><p>例题：调查社交媒体时长与健康。用分层抽样、明确近一周或近一月时间窗，选适合大学生的健康测量。睡眠、原有健康、学业压力、线下支持都可能是候选混淆，应根据时间和理论确定，并用设计或恰当分析处理；不能默认把可能的中介全部控制。横断调查即使出现相关，也可能有反向关系和共同原因。<\/p><h4>研究报告包括什么<\/h4><p>标题与作者、摘要关键词、引言、方法、结果、讨论、结论、参考文献及必要附录。引言讲为什么研究；方法讲被试、工具、设计、程序和分析；结果报告样本、描述统计、效应及不确定性；讨论解释证据、与文献关系、局限和启示。不能把未测机制写成已证实事实。<\/p><p>研究前应知情同意、保障自愿退出、减少伤害并保护隐私；知情同意须说明任务、主要风险和资料用途，退出不受惩罚；公开材料去标识，敏感资料限授权访问。如研究确需有限隐瞒，应有伦理论证并作事后说明。记录方案变动、流失和缺失，不捏造、不选择性隐藏不显著结果。研究方案中的对象、指标、程序和分析应相互一致，使资料能够回答最初提出的问题。<\/p>","recall":[{"q":"方法部分最少应交代哪些信息？","a":"被试与抽样分配、工具材料、设计变量、操作程序、伦理与数据分析，使他人理解并能复核实施过程。"}],"syllabus_topic":2},{"id":"c212-25","title":"案例练习：教学方法×语数外的混合设计","outline":"专题二｜方法类别和设计思路","level":"运用","keywords":["教学方法","学科","3×3混合设计","班级聚类"],"body_html":"<p><strong>例题：<\/strong>研究“三种教学方法对语数外成绩的影响”。题干未限定分组和实施方式，以下方案假定每位学生都测三门学科、每人只接受一种教学方法。研究问题包括：教学方法平均效果有无差异，以及效果是否随学科改变。<\/p><h4>方案与变量<\/h4><p>将学生随机分到三种教学方法，每位学生都测语文、数学、外语，教学方法为3水平组间因素，学科为3水平组内因素，形成3×3混合设计。因变量是三科在统一测验方案下的成绩；三科题目内容不同，应依据测验目标建立合理可比尺度，不能假定三个“百分制”就同难同单位。<\/p><h4>程序与控制<\/h4><p>统一干预周期、课时、练习量和反馈要求，记录前测能力、教师与班级情况。避免一种方法只由一位教师实施，否则方法与教师混淆；尽可能让多名教师平衡实施不同方法。若以班级分配教学，则班级才是随机分配单位，需足够班级并在分析中处理聚类，不能把同班每位学生当完全独立重复。<\/p><h4>分析和结论<\/h4><p>描述各方法在各学科的均值、离散程度，再以合适重复测量/混合模型检验方法、学科及交互；有交互时重点比较不同学科内的方法效果。若三科分数分别标准化，解释变为各科相对位置，学科平均差异的原始含义已改变。可事先确定主要比较，必要时按学科分析并控制多重比较。若实际题干补充“不同学生只测一科”，则应改判为组间析因设计。<\/p>","recall":[{"q":"教学方法×语数外一定是混合设计吗？","a":"不一定。只有同一学生反复测三科时，学科才是组内因素；必须说明被试参与条件的前提。"}],"syllabus_topic":2},{"id":"c212-26","title":"案例练习：四周正念研究的评价与优化","outline":"专题二｜方法类别和设计思路","level":"运用","keywords":["正念","焦虑","内部效度","主动对照","基线调整"],"body_html":"<p><strong>例题：<\/strong>招募60名大学生，分为四周正念训练组与无处理对照组，测量焦虑前后分数并采用独立样本t检验。题干未交代是否随机分配，也未交代t检验比较后测还是变化量，因此对设计和分析的评价需要分别讨论这些条件。<\/p><h4>研究评价与改进<\/h4><ol><li><strong>候选混淆与控制：<\/strong>基线焦虑、睡眠、考试压力、既往训练、其他咨询或用药、额外人际接触与期待可能影响结果；处理前测量，随机分配或分层随机，统一实施，记录同期活动，采用等时长可信对照。<\/li><li><strong>内部效度威胁：<\/strong>若未随机有选择偏差；四周内可能有考试结束等历史和自然恢复；前测可有练习，极高分入组可有回归；两组退出不同还造成差异流失。分别用同期对照、标准化、记录流失及适当分析减轻。<\/li><li><strong>外部效度：<\/strong>只招募大学生限制了推广，可在资源允许时跨院系或学校招募、描述样本和情境、增加后续随访，再通过独立场景重复检验推广。<\/li><li><strong>可行优化：<\/strong>保留60人为试点基础，先按主要效应与精度评估样本是否足够；随机分配，前后统一量表，盲化评估者、记录依从和不良反应，事先规定主要分析。<\/li><\/ol><p>统计可按目标比较两组变化量，或在适当假设下用后测对基线调整、组别×时间模型。独立样本t若比较独立组的变化量，并满足条件，不必然错误；把同一个人的前后测当成独立样本则不合适。不能凭两组各自是否显著来证明组间干预差异。<\/p>","recall":[{"q":"原题只说独立t，能直接判定统计错误吗？","a":"不能。需先明确检验对象。比较两独立组的变化量可能合理，若把同一人的前后数据当独立样本才与依赖结构不符。"}],"syllabus_topic":2}],"topics":[{"number":1,"numeral":"一","title":"心理学实验设计的基础概念","requirements":"掌握\n研究设计的信度和效度，变量的分类，操作定义的界定\n理解\n信效度的关系，操作定义的特征\n运用\n对控制变量的处理"},{"number":2,"numeral":"二","title":"方法类别和设计思路","requirements":"掌握\n研究方法的分类和适用范围，实验设计的基本概念，实验设计的分类\n理解\n不同研究方法的特点和区别，不同实验设计的特点和区别\n运用\n根据不同的条件，灵活使用不同的研究方法进行具体的研究设计"}]},{"code":"312","title":"心理测量与统计","overview":"心理测量与统计包括心理测量原理、心理测量的实际应用、常用的统计方法和统计原理四个专题。先理解分数、误差、信度、效度与项目分析，再掌握测验编制、施测和解释；统计部分从图表、集中与离散量数出发，逐步学习相关、差异检验、方差分析、参数估计与假设检验，并通过例题练习计算和结果解释。","cards":[{"id":"c312-01","title":"心理测量的概念、特征与测量水平","outline":"专题一｜心理测量原理","level":"掌握","keywords":["心理测量","标准化","定类","定序","定距","定比"],"body_html":"<p>心理测量依据规则，把心理特征或行为表现赋予数量或类别，以支持描述、比较和推断。心理测验是实现测量的一类标准化工具，通过行为样本推断心理属性。心理属性通常不能直接看见，因此测量具有间接性；结果依赖操作、条件和参照，具有相对性；还须承认误差与不确定性。<\/p><p><strong>标准化<\/strong>涉及内容、指导语、施测条件、时间、评分和解释。客观性来自明确规则，不代表完全不受文化、经验、主试或应答方式影响。常模参照是重要解释方式，但并非所有心理测验都必须以常模解释；标准参照测验关注是否达到预定目标。<\/p><h4>四种测量水平<\/h4><ul><li>定类：数字仅代表类别，如专业编号，不能算平均专业。<\/li><li>定序：能够排序，但相邻差距未必相等，如名次。<\/li><li>定距：具有相等单位，但零点非绝对，如摄氏温度，20度不是10度的“热两倍”。<\/li><li>定比：有相等单位与有意义的绝对零点，如反应时和正确次数，满足条件时可谈倍数。<\/li><\/ul><p>测验可按目标分能力、人格等，按最高表现/典型行为、个别/团体、文字/操作、速度/难度等分类。量表题目是有序等级，多个题合成分数能否近似连续处理，需结合工具性质、分布和分析目的说明；不是写上1—5就自动成为精确等距。<\/p>","recall":[{"q":"心理测验为什么是间接测量？","a":"它记录的是特定情境下的行为样本，再根据理论和效度证据推断不能直接观察的心理属性。"}],"syllabus_topic":1},{"id":"c312-02","title":"心理测量的产生与发展：人物—贡献—意义","outline":"专题一｜心理测量原理","level":"掌握","keywords":["高尔顿","卡特尔","比奈","西蒙","推孟","韦克斯勒"],"body_html":"<p>现代心理测量的产生与实验心理学、个体差异研究、教育识别和职业选拔需求相联系。中国古代人才评鉴、考试与心理观察体现了较早的测量思想，但不能直接等同于现代标准化测验。<\/p><h4>主要脉络<\/h4><p><strong>高尔顿<\/strong>重视个体差异及数量化研究，推动感知、反应等特征测量。<strong>詹姆斯·麦基恩·卡特尔<\/strong>在1890年使用“心理测验”术语；这里不是后来提出16种人格因素的雷蒙德·卡特尔。<strong>比奈与西蒙<\/strong>1905年编制具有实际用途的早期智力量表，服务于识别需要教育帮助的儿童，题目逐渐从简单感觉转向判断、理解等复杂功能。<\/p><p><strong>推孟<\/strong>主持1916年斯坦福—比奈修订，促进智力测验标准化应用。第一次世界大战期间的陆军团体测验扩大了大规模测试。<strong>韦克斯勒<\/strong>推动不同年龄阶段的多分测验智力量表及离差智商。随后能力倾向、教育成就、自陈人格和投射测验不断发展，因素分析为能力与人格结构研究提供工具。<\/p><p>测验理论由经典测量理论进一步扩展到项目反应理论和概化理论，应用也逐渐重视文化适应、公平、效度证据与计算机实施。中国现代测量经历引进、修订、制定本土常模与自主编制。这条发展脉络体现了社会需求、测量方法、代表工具与理论的共同演进；早期工具的分类与观念具有历史背景，不能直接当作今日评价人的标准。<\/p>","recall":[{"q":"两个卡特尔最容易混淆的贡献是什么？","a":"J. M. Cattell与1890年心理测验术语相关；R. B. Cattell与人格因素研究、16PF相关。"}],"syllabus_topic":1},{"id":"c312-03","title":"误差与经典测量理论：X=T+E","outline":"专题一｜心理测量原理","level":"运用","keywords":["CTT","真分数","随机误差","系统误差","方差分解"],"body_html":"<p>测量误差来自与目标无关的因素，如题目取样、理解歧义、疲劳、环境和评分。随机误差的方向和大小随测量而变，削弱一致性；系统偏差可稳定地使分数偏离所要解释的属性，因此一致性高仍可能测得不准确。<\/p><h4>经典测量理论模型<\/h4><p><code>X=T+E<\/code>：X是观察分数，T是该测量程序下理论上无限次独立重复测量的期望分数，E为随机误差。基本关系包括误差期望为0、真分数与误差不相关，以及按相应假设不同平行测量误差不相关。由此有<code>σ²X=σ²T+σ²E<\/code>。基本方差分解并不要求把“误差正态”写成任何情形下的必需公理。<\/p><p>真分数依赖特定测验与程序，不能简单理解为一个人脱离工具的绝对“真实智力”。如果某工具长期受无关文化知识影响，这种稳定成分可能进入该工具的真分数，却仍损害目标解释的效度。<\/p><h4>例题<\/h4><p>若一测验观察分数方差为100、误差方差为20，则真分数方差为80，信度为80/100=0.80。这是群体分数变异中可归于真分数变异的比例，不能说“某人的80%答案是真的”。控制误差可从代表性的条目、适当长度、标准化施测、可靠评分与合适测量时点入手。用于单个人解释时还应考虑测量标准误和具体分数区域的精度。<\/p>","recall":[{"q":"稳定的文化偏差为什么可能使信度高而效度低？","a":"它可能稳定存在，因此不表现为随机波动，却使分数混入与目标构念无关的内容。"}],"syllabus_topic":1},{"id":"c312-04","title":"信度类型：稳定、等值、内部一致与评分一致","outline":"专题一｜心理测量原理","level":"掌握","keywords":["重测信度","复本信度","分半","α","评分者信度"],"body_html":"<p>信度描述分数在规定条件下的一致性，具体估计取决于想控制哪一种误差、用于何种人群及情境。不能只报一个系数就说测验在所有用途上都可靠。<\/p><ul><li><strong>重测信度：<\/strong>同一批被试在两个时间用相同工具，考察时间稳定性。间隔太短可能有记忆，太长可能发生真实变化；必须报告间隔和群体。<\/li><li><strong>复本信度：<\/strong>用两个内容和统计特征尽量等值的版本，考察内容取样等值；隔时施测还混入时间变化。两套题“看起来相似”不等于严格平行。<\/li><li><strong>分半信度：<\/strong>一次测验分成可比两半，计算相关并在适当条件下修正为全长信度。随意前后切半可能因难度、疲劳而不可比。<\/li><li><strong>内部一致性：<\/strong>以α等反映题目之间的协变，受题目数与内容相关影响；高α不能单独证明单维度和效度。<\/li><li><strong>评分者一致性：<\/strong>多个评分者对同一表现评分的一致程度，可依数据与目的采用适当ICC、加权κ等。<\/li><\/ul><p>速度测验若未答题被计为零，奇偶分半可能被共同的作答速度抬高，应谨慎解释。提高信度应定位误差来源：评分规则含糊就培训评分者，状态波动大就优化测量时机；盲目重复题目虽可能抬高α，却会损害内容覆盖并增加疲劳。<\/p>","recall":[{"q":"α很高可以证明单维吗？","a":"不可以。题数、重复措辞、多个高度相关维度都可形成高α；结构需其他理论与因素分析证据。"}],"syllabus_topic":1},{"id":"c312-05","title":"信度计算：分半修正、α、测量标准误","outline":"专题一｜心理测量原理","level":"运用","keywords":["Spearman-Brown","Cronbach α","SEM","测验长度"],"body_html":"<p>信度基本表达为<code>rxx=σ²T/σ²X=1−σ²E/σ²X<\/code>。在经典测量理论下，它反映观察分数方差中真分数方差所占比例，不是每个人分数“正确的概率”。样本异质性和分数范围改变，估计值也可能改变。<\/p><h4>三组常用公式<\/h4><p><strong>分半修正：<\/strong>若两半满足适当平行或等值条件，<code>r全=2r半/(1+r半)<\/code>。推广的斯皮尔曼—布朗公式为<code>r新=kr旧/[1+(k−1)r旧]<\/code>，k是新旧测验长度之比，前提是增加的条目质量与测量性质可比。<\/p><p><strong>α系数：<\/strong><code>α=k/(k−1)×[1−Σs²i/s²总]<\/code>，k为题数，s²i为单题方差，s²总为总分方差。α要成为精确的信度估计通常需τ等值、测量误差不相关等假设；它不是所有模型下均准确的万能指标。<\/p><p><strong>测量标准误：<\/strong><code>SEM=SD√(1−rxx)<\/code>，表示该尺度上测量误差的典型大小。它不同于样本均值标准误<code>SE均值=s/√n<\/code>。<\/p><h4>例题<\/h4><p>两半相关0.60，全长估计为1.20/1.60=0.75；若总分SD=10，则SEM=10√0.25=5。常见近似解释可在明确假设下给观察分数±1.96SEM的区间，但不应把误差条带当作绝对诊断界限。增加可靠而相关的题目通常有助提高精度，增加无关或低质量题目并无此保证。<\/p>","recall":[{"q":"SEM与SE均值的区别？","a":"SEM描述个人测验分数的测量误差；SE均值描述样本均值在重复抽样中的波动，分别依赖信度和样本量等。"}],"syllabus_topic":1},{"id":"c312-06","title":"效度：内容、效标和构念证据","outline":"专题一｜心理测量原理","level":"掌握","keywords":["内容效度","效标效度","聚合","区分","结构效度"],"body_html":"<p>效度是证据和理论对某种分数解释及用途的支持程度。常见证据分为内容效度、效标关联效度和构念/结构效度，它们从不同角度支持同一分数解释与用途。不是一个量表只要“有效”就能用于任意人群和决策。<\/p><p><strong>内容证据：<\/strong>题目是否全面、恰当地覆盖目标领域，如按教学目标建立双向细目表，请专家评价遗漏和无关内容。表面上看起来相关只是表面效度，不等于充分内容证据。<\/p><p><strong>效标关联证据：<\/strong>与外部、有效且尽量不受测验污染的标准相联系；效标同期收集是同时效度，之后获得是预测效度。效标本身的信度、取值范围和时间间隔都会影响系数。<\/p><p><strong>构念证据：<\/strong>理论规定了哪些关系应出现。相同或相近构念应有合理聚合，不同构念应能区分；因素结构、已知群体差异、发展变化以及多特质多方法资料可共同提供证据。因素分析结果好看并不自动证明全部构念效度。<\/p><h4>信度关系与案例<\/h4><p>信度不足会制约有效推断，但信度高不是效度高的充分条件。例题：学习投入量表若大半题都问“考试担心”，即使α很高，也可能实际上测到焦虑。改进先要清晰界定投入、保证内容覆盖，再收集结构及外部关系证据，不能只靠删除题目把α推高。<\/p>","recall":[{"q":"新量表与另一个量表相关高就有效吗？","a":"须看对方测什么、是否可靠、预期关系多高，以及内容结构证据；与不相关构念过高相关可能反而说明区分不足。"}],"syllabus_topic":1},{"id":"c312-07","title":"项目分析：难度、区分度与干扰项","outline":"专题一｜心理测量原理","level":"运用","keywords":["难度","容易度","区分度","项目总分相关","猜测"],"body_html":"<p>项目分析是在题目层面评价质量，常看难易程度、区分能力、内容与选项表现。题目的好坏必须结合测验目的：筛选高水平者、检查最低达标和广泛区分个体，所需难度分布不同。<\/p><h4>核心公式<\/h4><p>二分计分通过率<code>P=答对人数/作答人数<\/code>；P越大题越容易。多级评分可用<code>P=平均得分/满分<\/code>。高低分组区分指数<code>D=PH−PL<\/code>，取值−1至1；D为负应检查错键、含糊、反向计分或构念不符。<\/p><p>例题：高低分组各40人，某题分别32、12人答对，则PH=.80、PL=.30、D=.50；若用两极组近似难度，则P=(.80+.30)/2=.55，但它不是全样本通过率，除非定义和资料条件相符。<\/p><p>过难或过易时大多人同答，区分空间受限；中等难度常有较大潜在区分力，却不保证实际区分好。人格题通常没有“答对”，通过率更多表示赞同或选择比例，不能机械把所有条目调到0.50。项目—总分相关应考虑总分扣除该题，避免自我包含抬高相关。<\/p><p>多选项题还要看干扰项是否有人选择、低分者是否较多选择、是否存在多个合理答案。猜测校正有其假设，不能自动等于真实能力。删改项目须兼顾内容代表性、公平与统计指标，不可只留重复题来追求高相关。<\/p>","recall":[{"q":"D=.50意味着什么？","a":"在当前分组与样本下，高分组答对比例比低分组高50个百分点，表示较好的正向区分；不是“答对率50%”。"}],"syllabus_topic":1},{"id":"c312-08","title":"项目反应理论：能力与作答概率","outline":"专题一｜心理测量原理","level":"理解","keywords":["IRT","潜在特质","单维性","局部独立","项目参数"],"body_html":"<p>项目反应理论（IRT）用潜在特质水平θ与答对或选择某类反应的概率之间的函数关系描述作答。与经典测量理论主要围绕总分不同，IRT关注项目特征和不同能力位置的测量信息；在模型适合、量尺连接等条件满足时，可支持题库、等值和自适应测试。<\/p><h4>基础概念<\/h4><p>常见单维模型假定一个主要潜在特质解释项目反应；局部独立是指给定该特质后，各项目反应不再有剩余依赖，不是说所有题目在原始数据中必须不相关。共用题干、题目泄露线索等可能产生局部依赖。上述单维假设适用于基础单维模型；多维IRT则用多个潜在特质解释作答。<\/p><p>二参数逻辑模型可写作<code>P(θ)=1/[1+exp(−a(θ−b))]<\/code>：a表示区分度，曲线越陡表示在相应能力位置区分越敏感；b为难度，θ=b时概率为.50。三参数模型加下渐近线c：<code>P=c+(1−c)/[1+exp(−a(θ−b))]<\/code>，c常称猜测参数；此时θ=b对应(1+c)/2，不再是.50。<\/p><p>单参数模型通常固定区分度且不设猜测参数，重点估计难度。参数不变性是模型条件下的性质，不能说换任何群体都绝对不变；需检验拟合、差异项目功能和量尺链接。测验信息随θ变化，所以同一工具对中间能力精确，不代表极端能力也同样精确。CTT信度通常概括群体总分的一致性，IRT信息则能够描述不同能力位置的测量精度。<\/p>","recall":[{"q":"三参数模型中θ等于b时，答对率一定是50%吗？","a":"不是，是(1+c)/2；只有c=0时才为50%。"}],"syllabus_topic":1},{"id":"c312-09","title":"概化理论：拆分多个误差来源","outline":"专题一｜心理测量原理","level":"理解","keywords":["概化理论","G研究","D研究","相对决策","绝对决策"],"body_html":"<p>概化理论（GT）把测量放在一组可推广的条件中，关注分数能否推广到其他题目、评分者、时点或场合。它不像简单CTT只把误差放进一个整体，而是通过设计和方差分解识别多个误差来源及其交互。<\/p><h4>G研究与D研究<\/h4><p><strong>概化研究（G研究）<\/strong>先收集资料，估计人、题目、评分者等侧面及交互所占的方差。例如口试得分可能来自考生能力、题目难度、评分者宽严、考生×题目差异及剩余误差。<strong>决策研究（D研究）<\/strong>利用这些估计，比较增加题目还是增加评分者更能达到目标精度，从而优化正式测验。<\/p><p><strong>相对决策<\/strong>关心人与人的排序，所有人都受到同样的评分者宽严偏移时，排序可能不变；<strong>绝对决策<\/strong>关心是否达到固定标准，这种偏移就重要。因此相对误差与绝对误差的组成不同，通常分别考虑概化系数与可靠性/依存性指数。<\/p><h4>例题<\/h4><p>若口试主要误差来自“考生×题目”，单纯增加评分者可能帮助有限，增加能代表目标领域的题目更有针对性；若评分者相关误差很大，则需培训与合理增加评分者。最终选择需考虑成本和方差成分，不能无条件说人越多、题越多就最好。<\/p><p>与IRT比较：IRT解释“人—题作答概率”，GT回答“多种测量条件带来哪些误差、怎样设计更可靠”。<\/p>","recall":[{"q":"G研究与D研究各自做什么？","a":"G研究估计多种误差侧面及交互的方差；D研究据此评估不同测量安排的精度与成本。"}],"syllabus_topic":1},{"id":"c312-10","title":"测验与人格问卷编制：完整程序和说明书","outline":"专题二｜心理测量的实际应用","level":"运用","keywords":["编制","双向细目表","预测试","测验说明书","人格问卷"],"body_html":"<h4>编制技术的完整链条<\/h4><ol><li><strong>明确目的：<\/strong>决定测什么、给谁用、作何解释，区分筛查、研究、选拔与达标判断。<\/li><li><strong>界定构念：<\/strong>依据理论与访谈建立维度或内容范围。成就测验用内容×认知要求的双向细目表，确保覆盖。<\/li><li><strong>形成题库：<\/strong>选择题型与反应格式，写清楚、单义、适龄条目，制定评分规则。<\/li><li><strong>专家与受测者审查：<\/strong>评价内容代表性、理解、文化和语言适配，开展认知访谈或小规模预测试。<\/li><li><strong>试测分析：<\/strong>在适合目标群体的样本中做项目分析、结构分析、信效度检验，保留理论重要的内容。<\/li><li><strong>修订验证：<\/strong>尽可能用独立样本交叉验证，确定最终计分、常模或达标标准。<\/li><li><strong>标准化与手册：<\/strong>规定施测、评分、解释、适用界限和后续更新。<\/li><\/ol><p>人格测验须特别处理社会赞许、反应定势、维度重叠与无“正确答案”的特点，不能照搬知识题的难度标准。α高、因素载荷高只是部分证据，不能取代完整构念与效度论证。<\/p><h4>测验说明书的六项主要内容<\/h4><p>目的、理论与适用人群；题目和维度形成依据；施测程序、时限与注意事项；计分规则；信效度及项目分析证据；常模/标准、分数解释及限制。说明书是使用手册，不只是给被试的一段指导语。用于跨文化群体还需语言适配和相应验证，不能只翻译文字。<\/p>","recall":[{"q":"问卷说明书与问卷指导语一样吗？","a":"不一样。指导语告诉被试怎样作答；说明书还包括理论、适用范围、编制证据、计分、常模、解释和限制。"}],"syllabus_topic":2},{"id":"c312-11","title":"测验的施测、计分、解释与报告","outline":"专题二｜心理测量的实际应用","level":"理解","keywords":["施测","指导语","测验选择","保密","测量用途"],"body_html":"<p>心理测验的应用包括教育评估、人员选拔安置、职业咨询、研究和心理服务中的辅助评估。用途决定工具选择，不能因为一个量表方便下载就用于所有目的。具体个人决策应结合访谈、行为和背景资料，分数只是证据的一部分。<\/p><h4>标准流程<\/h4><p><strong>选择：<\/strong>核对目标构念、人群、语言文化、信效度、常模年代、授权和施测资格。<strong>准备：<\/strong>熟悉手册，准备材料和环境，说明目的、保密范围和作答要求。<strong>实施：<\/strong>统一指导语、时限和辅助方式，建立合作，不提示“正确人格”，记录突发噪声、身体不适与其他异常。<strong>计分：<\/strong>按规则检查漏答、反向题和无效反应，主观评分用明确标准与训练。<\/p><p><strong>解释：<\/strong>明确高低分含义、参照群体、误差范围及具体情境；不同测验原始分数不宜直接比较。人格和症状量表可能受当前状态与社会赞许影响，不能凭单分数给人永久标签。向受测者反馈要用可理解的语言，区分筛查提示、特质描述和正式判断。<\/p><h4>测验报告与资料管理<\/h4><p>报告应交代测验目的、工具和版本、施测条件、计分及参照规则、主要结果、误差和解释限制。保护隐私、知情同意和资料访问边界；为群体研究收集的材料不能任意转作个体淘汰依据。遇到漏答和异常，应按预先规则处理并记录，不能为了分数好看任意补值或删人。<\/p>","recall":[{"q":"测验高分能否脱离手册直接解释？","a":"不能。必须先确认计分方向、目标构念、参照群体和适用用途，并结合测量误差和个体背景。"}],"syllabus_topic":2},{"id":"c312-12","title":"常模参照、标准参照与分数转换","outline":"专题二｜心理测量的实际应用","level":"运用","keywords":["常模","常模参照","标准参照","百分等级","达标"],"body_html":"<p><strong>常模<\/strong>是定义清楚、具有代表性的参照群体在特定测验上的分数分布及转换规则，用来解释个体在同类人中的相对位置。建立时应明确目标总体、抽样框与时间，进行标准化测量，再形成原始分与导出分数的对应。常模要有适当规模、代表性和时效性，不是所有测验都用同一个固定样本数。<\/p><p><strong>常模参照测验<\/strong>回答“相对于同类人处于何种位置”；<strong>标准参照测验<\/strong>回答“是否掌握预先界定的内容或达到能力要求”。两者都需有效内容、可靠计分与规范施测，区别主要在解释参照、题目设计重点与决策用途。录取前10%是相对选拔，不等于已达到某种绝对能力标准。<\/p><h4>常模类型与注意<\/h4><p>发展常模含年龄、年级水平；组内常模可用百分等级、标准分数。年龄当量不是等距尺度，不能把某儿童的阅读年龄直接当作各方面发展年龄。百分等级80表示在规定常模中处于相应位置，不是答对80%，也不表示能力是百分等级40者的两倍。<\/p><p>标准制定需先明确合格表现，可依据内容与专家判断等程序设定分界，再用数据验证分类后果；不能把平均分随意当作“合格线”。若标准用于重大决策，还需评估临界分附近的测量精度和误判。例如按年级常模解释阅读水平，属于常模参照；检查是否掌握课程规定的全部关键技能，属于标准参照。<\/p>","recall":[{"q":"常模过时为什么有问题？","a":"教育、文化、人口和工具使用条件可能变化，使相对位置解释失准，需根据证据判断是否更新。"}],"syllabus_topic":2},{"id":"c312-13","title":"智力测验：比奈、韦氏与瑞文","outline":"专题二｜心理测量的实际应用","level":"掌握","keywords":["智力测验","韦氏","比奈","瑞文","离差智商"],"body_html":"<p>智力测验以推理、理解、记忆、加工等认知表现评估一般或多维能力。其解释依赖智力理论、任务范围、年龄和文化，不能把单一分数视为一个人的全部价值或未来成就。<\/p><p><strong>比奈—西蒙与斯坦福—比奈：<\/strong>源于儿童教育评估，历史上发展出心理年龄及比率智商等思想。比率智商<code>IQ=心理年龄/实际年龄×100<\/code>有发展假设和适用限制，不能简单套用于所有年龄。<\/p><p><strong>韦克斯勒量表：<\/strong>包含成人、儿童、学龄前等不同系列，通过多个分测验给出认知表现资料。课程旧版本常按言语、操作与全量表智商介绍；不同版本的指数结构和分测验不同，旧版结构不能代表所有版本。离差智商常以同龄常模均值100、标准差15表示，即在相应量尺下<code>IQ=100+15z<\/code>。<\/p><p><strong>瑞文推理测验：<\/strong>以图形关系与矩阵推理为主要任务，语言要求相对较少，但不等于完全不受文化教育和经验影响。个别智力测验可观察任务过程、灵活按手册实施，团体测验效率更高，却较少获得个体细节。<\/p><h4>分数解释与应用边界<\/h4><p>相同原始分在不同年龄常模下可以对应不同的标准分数，因而必须明确测验系列、年龄组与计分规则。解释时选择合适年龄与本土常模，考虑语言、教育、动机、健康和测量误差，不凭低分单独作复杂诊断。<\/p>","recall":[{"q":"瑞文为什么不能叫完全无文化测验？","a":"虽然主要使用非言语图形，但教育经验、题型熟悉、测试情境等仍可能影响表现。"}],"syllabus_topic":2},{"id":"c312-14","title":"能力倾向与成就测验：潜能和已学成果","outline":"专题二｜心理测量的实际应用","level":"掌握","keywords":["能力倾向","成就测验","GATB","DAT","教育测量"],"body_html":"<p><strong>能力倾向测验<\/strong>关注个体在某领域接受训练后成功的可能性或适应潜能，常用于职业指导、培训选拔与人员安置。可测言语、数量、空间、机械、文书知觉等，既有专门能力测验，也有成套测验，如GATB、DAT。它们的预测用途须有与实际训练或工作表现相联系的效度证据。<\/p><p><strong>成就测验<\/strong>评估已学知识与技能的掌握状况，如课程测验、学科成就测验。内容应由明确教学目标和知识技能范围确定，重点是代表性与认知层次。可以常模参照说明相对位置，也可标准参照判断是否达标。<\/p><p>两者不是“天生能力”与“完全后天学习”的绝对分割。能力倾向同样受到教育、训练和机会影响；成就测验成绩也受一般能力、动机与测量误差影响。区别主要在编制内容、目标用途和解释时间指向，而不是某一道题天然只属于一类。<\/p><h4>例题<\/h4><p>要判断培训前谁更可能学好机械操作，可用与该训练成功有证据关联的机械能力测验；要判断培训后是否会执行操作规程，应设计覆盖规程和实际任务的成就测验。两种信息可共同使用，但要说明权重与决策标准，不能仅因相关显著就保证个人必然成功。<\/p><p>能力倾向与成就测验可用于教育诊断与反馈、培训选拔、职业咨询和研究测量。工具适用性、常模或标准、测量误差及其他背景资料共同决定结果如何解释。<\/p>","recall":[{"q":"成就测验是否只能用常模解释？","a":"不是，也可标准参照，用明确内容与技能要求判断掌握或达标。"}],"syllabus_topic":2},{"id":"c312-15","title":"人格测验：自陈、投射、评定与情境","outline":"专题二｜心理测量的实际应用","level":"掌握","keywords":["自陈量表","投射测验","MMPI","16PF","EPQ","TAT"],"body_html":"<p><strong>自陈量表<\/strong>让受测者依统一题目报告典型感受和行为，如MMPI、16PF、EPQ和基于大五的NEO系列。其优点是施测计分快、容易标准化、便于团体比较；局限是自我了解、社会赞许、同意倾向、粗心作答和故意修饰。效度量表可提供反应风格线索，不是测谎仪；MMPI的临床相关解释也不能替代完整评估。<\/p><p><strong>投射测验<\/strong>呈现较模糊或开放的刺激，观察受测者如何组织反应，例如罗夏墨迹和主题统觉测验TAT。其理论假设是个体在解释刺激时会反映经验、需要和人格模式。优势是能获得丰富、个性化的材料，部分目的线索较不直接；局限是训练与计分要求高，不同方法和指标的信效度差异明显，解释容易受主观影响。不能声称它可直接、无误地读出潜意识。<\/p><p><strong>他人评定<\/strong>借助熟悉者或观察员提供行为资料，可补自陈限制，却有晕轮、宽严和趋中误差；用行为锚点、训练和多来源可改善。<strong>情境测验<\/strong>通过真实或模拟任务观察行为，贴近具体表现，但情境代表性和行为稳定性仍须验证。<\/p><h4>不同人格测量方法的比较<\/h4><p>自陈资料以受测者报告为主，便于标准化但受自我认识和反应风格影响；投射资料来自开放反应，信息丰富但解释和评分更依赖方法与训练；他人评定提供外部视角，情境测验提供具体行为证据。多方法结合可减少单一信息来源的局限，前提是各工具适合目标问题并具有相应信效度证据。不要把自陈等于“客观真实”、投射等于“无法作假”，也不要把一种方法所有指标一概判为有效或无效。<\/p>","recall":[{"q":"自陈和投射如何用一句话比较？","a":"自陈是结构化自我报告，标准化便利但受反应风格影响；投射更开放、资料丰富，但计分和解释证据要求高。"}],"syllabus_topic":2},{"id":"c312-16","title":"数据整理与统计图表：先看数据再检验","outline":"专题三｜常用的统计方法","level":"运用","keywords":["频数","直方图","条形图","箱线图","散点图","缺失值"],"body_html":"<p>描述统计整理当前样本，推论统计在假设和抽样条件下推断总体。开始分析先确认每行代表什么单位、变量类型和取值范围、缺失编码、反向题和重复记录，不能把“99=缺失”当成真实高分。识别异常值后应核对原记录和产生原因，按预先合理规则处理，不能只删除使结果不显著的分数。<\/p><h4>按问题选图<\/h4><ul><li><strong>条形图：<\/strong>比较类别频数、比例或汇总值，类别之间有间隙。<\/li><li><strong>直方图：<\/strong>看连续变量分布，组距影响形态；组距不等时以频数密度使面积代表频数。<\/li><li><strong>折线图：<\/strong>展示有序时间变化或连续变化，不能让任意无序类别暗示趋势。<\/li><li><strong>箱线图：<\/strong>看中位数、四分位和潜在异常值，异常标记不是自动删值指令。<\/li><li><strong>散点图：<\/strong>看两个数量变量关系、非线性和离群点，计算相关前很有用。<\/li><\/ul><p>频数表应说明组界、总数、比例与累积频数，类别需互斥且覆盖实际资料。表格交代样本量、单位、统计量；图上误差条注明是SD、SE还是置信区间，三者意义不同。<\/p><p>例题：两组均值柱形图看起来差很大，但坐标轴从68开始；应同时看实际差、单位、分布和不确定性。先呈现分布与描述量，再做适当推断，能发现录入错误、天花板效应、严重偏态和不同样本规模。<\/p>","recall":[{"q":"SD、SE和95%CI误差条能混用吗？","a":"不能。SD描述个体分散，SE描述估计量抽样波动，CI表达参数估计不确定性，图注必须标明。"}],"syllabus_topic":3},{"id":"c312-17","title":"集中量数：平均数、中位数与众数","outline":"专题三｜常用的统计方法","level":"掌握","keywords":["集中量数","平均数","中位数","众数","偏态"],"body_html":"<p>集中量数用一个典型位置描述数据中心，常用平均数、中位数和众数；选择应考虑测量水平、分布与用途，不能总把“平均”理解成算术平均。<\/p><p><strong>平均数：<\/strong><code>x̄=Σxi/n<\/code>，利用全部数值，便于代数运算和后续模型，但受极端值影响，须有适当的数量意义。不同组样本量不等时，总均值是按人数加权的组均值，不能直接平均各组均值。<\/p><p><strong>中位数：<\/strong>把数据排序后位于中央的位置。奇数n取第(n+1)/2个；数值资料偶数n取中央两个的均值。对极端值较稳健，适合偏态分布；纯等级资料应保留类别或等级解释，不必把等级代码算出不存在的“半个类别”。<\/p><p><strong>众数：<\/strong>出现最多的取值或类别，可用于定类资料；可能有多个众数，也可能没有唯一众数。只报告众数可能丢失大量分布信息。<\/p><h4>例题<\/h4><p>数据2、3、3、4、18，平均数为30/5=6，中位数3，众数3。18拉高均值，不能据均值6断言“大多数人约6”。若研究典型反应时且存在长右尾，可同时报告中位数和四分位距，并解释排除规则。通常右偏分布均值会被右尾拉高，左偏相反，但不能把三个量数的固定大小顺序当所有分布的数学定律。完整描述还须配离散量数和图形。<\/p>","recall":[{"q":"A班10人均分90，B班30人均分70，总均分是多少？","a":"(10×90+30×70)/40=75，不是简单平均80。"}],"syllabus_topic":3},{"id":"c312-18","title":"差异量数：方差、标准差与变异系数","outline":"专题三｜常用的统计方法","level":"运用","keywords":["方差","标准差","四分位距","变异系数","自由度"],"body_html":"<p>差异量数描述分数围绕中心的分散程度。全距为最大值减最小值，只使用两端，容易受极端值影响；四分位距<code>IQR=Q3−Q1<\/code>表示中间50%的跨度，适于偏态分布。<\/p><p><strong>总体方差：<\/strong><code>σ²=Σ(x−μ)²/N<\/code>。<strong>用样本估计总体方差：<\/strong><code>s²=Σ(x−x̄)²/(n−1)<\/code>；因均值已用样本估计，离均差受总和为0的约束，只有n−1个自由度。若仅描述这批数据自身的总体式离散，也可以用n作分母；与用n−1估计总体方差的目标不同。标准差是方差的正平方根，与原数据单位一致；方差单位为原单位的平方。<\/p><h4>例题<\/h4><p>2、4、6均值4，离均差平方和4+0+4=8，样本方差8/(3−1)=4，标准差2。标准差非负，所有数相同才为0；每个分数加常数不改变标准差，乘常数a则标准差乘|a|。<\/p><p><strong>变异系数：<\/strong><code>CV=s/x̄×100%<\/code>，描述相对离散，可比较不同均值或单位的适当比率尺度资料。它要求有意义的零点，均值为正且不接近0；不宜拿摄氏温度、z分数或任意零点的心理量表随意比较。CV无单位，却不代表任何不同构念都可作实质比较。均值相同的两组可以标准差不同，说明典型水平相近而个体分散不同。<\/p>","recall":[{"q":"均值近于0时为什么不宜用CV？","a":"分母很小会使比值极不稳定；任意零点或可为负的量尺通常也没有清楚的相对变异解释。"}],"syllabus_topic":3},{"id":"c312-19","title":"相对量数：z分数、T分数、百分位与百分等级","outline":"专题三｜常用的统计方法","level":"运用","keywords":["标准分数","z分数","T分数","百分位数","百分等级"],"body_html":"<p>相对位置量数说明一个分数在参照分布中的位置。<strong>z分数<\/strong>为<code>z=(X−μ)/σ<\/code>，以标准差为单位；样本描述可用样本均值和标准差。z=1表示高于均值一个标准差，z为负只是低于均值，不是“负能力”。<\/p><p>线性转换<code>T=50+10z<\/code>形成常用T分数；某些智商尺度用<code>IQ=100+15z<\/code>。线性标准化改变中心与单位，不会自动把偏态数据变为正态。只有给出相应分布假设，才可用标准正态表把z换为百分等级。<\/p><p><strong>百分位数<\/strong>是相应累积比例位置的原始分数，如P75对应约75%分数位于其下的分界；<strong>百分等级<\/strong>则从某个原始分数出发说明它的相对排名。并列分数可按规则用“低于人数＋半数同分人数”计算，具体规则应与教材或常模一致。百分等级差不是等距单位，不能用它直接平均成综合能力。<\/p><h4>例题<\/h4><p>某次考试均值70、标准差10，85分的z=(85−70)/10=1.5，T=65。若分布近似正态，可查得其位置约为第93百分位；没有正态条件，仅凭z=1.5不能认定这个百分等级。两门测验的z分数可比较各自参照群体的相对位置，但不是证明两种不同能力绝对相等，还需核对参照人群和量尺意义。<\/p>","recall":[{"q":"百分等级90与答对率90%相同吗？","a":"不同。百分等级是相对于常模群体的位置；答对率是答对题目占比。"}],"syllabus_topic":3},{"id":"c312-20","title":"相关分析：选择方法、条件与解释","outline":"专题三｜常用的统计方法","level":"运用","keywords":["Pearson","Spearman","相关条件","散点图","偏相关"],"body_html":"<p>相关量数描述变量共同变化的方向与强度。Pearson积差相关<code>r=Σ[(x−x̄)(y−ȳ)]/√[Σ(x−x̄)²Σ(y−ȳ)²]<\/code>，范围−1至1，刻画线性关系。r=0只表示无线性相关，可能仍存在U形关系；相关不说明因果方向。<\/p><h4>什么时候用<\/h4><p>Pearson适于有数量意义、观测成对且个体间独立的资料，先看散点图确认线性和异常值；传统显著性检验及区间的严格条件通常涉及二元正态等模型假设。计算r本身并不要求样本必须正态，但推断要核验条件。等级资料或主要关心单调关系、异常值难处理时，可用Spearman等级相关；它也不是“完全无条件”。<\/p><p>两自然二分变量可用φ；自然二分与连续变量的点二列相关是相应编码下Pearson的形式。偏相关在模型条件下控制指定变量，不会消除全部未知混淆。范围受限、测量信度低、混合多个亚群体、重复测量误当独立，都可能歪曲相关。<\/p><h4>相关分析的实施步骤<\/h4><p>先核对变量测量水平和成对记录，再看散点图与异常值；结合抽样和模型条件选择相关系数，计算后报告r、样本量n、p值和置信区间，最后说明方向、强度与因果解释限制。例题：社交媒体时间与“健康高分更好”量表r=−.30，只支持负向线性关联；可能有健康反过来影响使用、学业压力共同作用，不能直接声称使用损害健康。<\/p>","recall":[{"q":"显著负相关可以证明一种变量伤害另一种变量吗？","a":"不能。相关没有自动建立时间先后及排除共同原因，还要确认分数方向和研究设计。"}],"syllabus_topic":3},{"id":"c312-21","title":"一元回归：预测、残差与R²","outline":"专题三｜常用的统计方法","level":"理解","keywords":["线性回归","回归系数","残差","R²","预测"],"body_html":"<p>一元线性回归用<code>Ŷ=a+bX<\/code>描述Y随X的线性预测变化。b是X每增加1单位时预测Y的平均改变量，a是X=0时预测值，但若0远离实际观察范围，截距的实质意义可能有限。残差<code>e=Y−Ŷ<\/code>表示实际值与预测值的差异。<\/p><p>最小二乘法选择使残差平方和最小的直线。一元带截距模型中<code>b=r×sY/sX<\/code>，<code>a=ȳ−bx̄<\/code>；R²说明该模型相对于均值模型解释了样本Y变异的多少。一元带截距回归的R²等于r²，不能把这条关系不加条件地套到任意多元或无截距模型。<\/p><h4>例题<\/h4><p>若x̄=4、ȳ=70、sX=2、sY=10、r=.60，则b=3，a=58；X=5时预测Y=73。R²=.36表示此线性模型解释样本Y变异的36%，不是“60%的人有效”或“X造成36%的Y”。个体预测有误差，预测区间通常比均值响应的置信区间更宽。<\/p><p>传统推断要检查线性、误差独立、方差适当和残差分布等；大样本并不能自动修复依赖与混淆。多元回归还需关注共线性、变量选择和过拟合。回归调整后的系数仍要结合研究设计解释，尤其不能把横断问卷回归显著写成机制被证实，也不宜向观察范围之外远距离外推。<\/p>","recall":[{"q":"R²=.36可以解释成X引起了36%的结果吗？","a":"不可以。它是特定模型对样本结果变异的解释比例，因果含义需额外设计与识别条件。"}],"syllabus_topic":3},{"id":"c312-30","title":"多因素、重复测量与混合方差分析","outline":"专题三｜常用的统计方法","level":"运用","keywords":["多因素","重复测量","混合设计","球形性","交互作用"],"body_html":"<p>多因素方差分析可检验各因素主效应及交互。被试内或重复测量资料含同一个人的多个观测，彼此相关，需要相应误差项；不能把重复观测直接当作更多独立样本。混合设计同时含组间因素和组内因素。<\/p><p><strong>例：<\/strong>两种训练组×前、后、随访三时点，组别为组间、时间为组内，形成2×3混合设计。组别主效应是跨时点的平均组差，时间主效应是跨组的平均变化，组别×时间交互说明两组随时间的变化模式不同。评价干预时，交互或预定的组间变化对比通常比只看时间主效应更直接。<\/p><h4>条件与操作<\/h4><p>不同被试应独立；关注残差、异常和方差结构。传统重复测量ANOVA在三个或更多组内水平时涉及球形性，即相关差值的方差结构要求；两个水平时该条件自动满足。违背时可按方法用Greenhouse—Geisser等自由度校正，或采用适当多变量/混合效应模型。不能把“方差齐性”和“球形性”当同一个检验。<\/p><p>分析顺序：画各组变化图→检查条件→检验预定总体效应与交互→有理论根据地做简单效应或对比→报告修正、效应量和区间。缺失随访和不等时间间隔可能使简单重复ANOVA不适合，应按数据机制选择模型。教学法×学科案例则要先说明同一学生是否测所有科目，再判断混合还是纯组间设计。<\/p>","recall":[{"q":"两组都进步，是否表明训练优于对照？","a":"不一定。共同进步可能是时间或练习作用，需直接检验两组变化差异，并结合设计排除替代解释。"}],"syllabus_topic":3},{"id":"c312-31","title":"非参数检验与χ²：资料不适合均值检验时","outline":"专题三｜常用的统计方法","level":"运用","keywords":["卡方","Mann-Whitney","Wilcoxon","Kruskal-Wallis","Friedman"],"body_html":"<p>非参数方法常以频数、秩或符号为依据，适合某些定类、定序资料或参数模型不适合的情况，但“非参数”并非“无条件”，也不意味着总在检验中位数。方法仍须与独立/配对、组数和研究目标匹配。<\/p><p><strong>χ²拟合优度<\/strong>比较观察频数与理论比例；<strong>χ²独立性检验<\/strong>检查两个分类变量是否关联。<code>χ²=Σ(O−E)²/E<\/code>，列联表期望频数<code>E=行合计×列合计/总数<\/code>，自由度(r−1)(c−1)。需使用人数频数、独立观测和适当期望频数；过于稀疏时考虑精确检验等。配对二分类前后资料不能简单当独立表，可考虑McNemar检验。<\/p><h4>秩检验选择<\/h4><p>两独立组用Mann—Whitney U；两配对条件用Wilcoxon符号秩（其位置解释有差值分布对称等条件）或适当符号检验；多独立组用Kruskal—Wallis；多相关条件用Friedman。组间秩检验一般反映分布差异，只有相应同形分布等前提下才可简化为位置或中位数比较。<\/p><p>例题：比较三教学组是否通过资格考试，结果是通过/未通过频数，可先考虑3×2独立性χ²；比较同一学生三时点的有序评分，则需相关样本方法。选择检验要从数据类型和设计出发，不是看到“数据不正态”就一律改卡方。报告时仍应说明差异方向、实际大小及多重比较。<\/p>","recall":[{"q":"χ²显著能说明两个分类变量有因果吗？","a":"不能。它支持统计关联，因果解释还取决于随机化、时间先后及混淆控制。"}],"syllabus_topic":3},{"id":"c312-32","title":"综合选法与结果报告：从题干到统计结论","outline":"专题三｜常用的统计方法","level":"运用","keywords":["统计选法","数据类型","独立配对","综合分析","结果报告"],"body_html":"<h4>选法四问<\/h4><ol><li>要描述、估计、比较差异，还是检验关系/预测？<\/li><li>结果是连续分数、等级、类别还是次数？<\/li><li>几个组或条件，彼此独立还是重复测量，是否有班级等聚类？<\/li><li>相关的分布、方差、线性和数据质量条件能否满足？<\/li><\/ol><p>单个均值对固定值→单样本t；两独立均值→独立/Welch t；两配对均值→配对t；多组独立均值→ANOVA或适当替代；同一人多次→重复或混合模型；两个数量变量线性关系→Pearson；等级或单调关系→Spearman；分类频数关联→χ²或适当精确方法。方法名称只是起点，还要写出假设、效应和假设检查。<\/p><h4>综合例题<\/h4><p>两个教学组各30人，同一学生前后测成绩。先核验计分、流失与分布，报告各组前后均值和SD。若随机化与模型条件合适，可预定用后测调整基线的模型或比较两组变化量；若主要问题是变化模式，可检验组别×时间交互。报告组间效应、95%CI、统计量和p，区分统计意义与教育意义。原题未交代比较对象时，不能直接断言“独立t一定错”。<\/p><h4>结果报告的组成<\/h4><p>完整结果包括样本与设计、描述统计、效应方向和大小、95%置信区间、检验方法、统计量及自由度、p值，以及实际意义和推广范围。例如“平均差为5分”说明差异大小，“95%置信区间为1至9分”说明估计精度；是否具有教育意义还需结合量尺和研究目标判断。题目未提供数据时，只能列出分析计划，不能计算均值、p值或判定显著性。<\/p>","recall":[{"q":"题目没有给数据时，能否写“实验组显著更好”？","a":"不能。应写预定假设、分析方法与可能结果的解释，不把预期当成已观察结果。"}],"syllabus_topic":3},{"id":"c312-22","title":"概率、正态分布与常用理论分布","outline":"专题四｜统计原理","level":"掌握","keywords":["概率","条件概率","正态","t分布","χ²","F分布"],"body_html":"<p>概率用于量化不确定性，取值0至1。互斥事件不能同时发生，其并集概率可相加；独立事件的联合概率可相乘。互斥不等于独立：两个有正概率的互斥事件中，一个发生会排除另一个。条件概率<code>P(A|B)=P(A∩B)/P(B)<\/code>，不能随意把P(A|B)倒过来当P(B|A)。<\/p><p><strong>正态分布<\/strong>是关于均值对称的钟形分布，均值决定位置、标准差决定宽窄，总面积为1。正态条件下约68.3%、95.4%、99.7%的个体值位于均值±1、2、3个标准差。标准正态均值0、方差1；连续变量在单一点的概率为0，区间概率才对应曲线下面积。<\/p><h4>推断中常用的分布<\/h4><p><strong>t分布：<\/strong>对称、尾部较正态厚，取决于自由度，用于总体标准差未知时的均值推断等。自由度增大逐渐接近标准正态。<strong>χ²分布：<\/strong>非负且常右偏，与独立标准正态平方和有关，常见于方差及频数资料分析。<strong>F分布：<\/strong>非负，由两项独立χ²各除自由度后的比值形成，常用于方差分析。<\/p><p>这些是统计量的参考分布，不意味着每种检验的原始分数本身要服从F或t分布。应区分观察数据分布、总体模型与统计量抽样分布；“样本超过30就所有数据正态”是错误说法。<\/p>","recall":[{"q":"为什么p值不能倒过来当H₀成立概率？","a":"两者条件方向不同：p是在H₀和模型成立条件下的数据极端性概率，不是给定数据后的假设概率。"}],"syllabus_topic":4},{"id":"c312-23","title":"抽样分布、标准误与中心极限定理","outline":"专题四｜统计原理","level":"理解","keywords":["抽样分布","标准误","中心极限定理","样本量"],"body_html":"<p>设想按同一规则反复抽取相同大小样本，每次都计算均值，这些均值形成的分布叫均值的抽样分布。它不同于一个样本中所有人的分数分布。总体参数如μ通常视为固定未知，样本统计量x̄会随抽样而变。<\/p><p>在独立同分布且总体方差有限等条件下，样本均值的期望为μ，标准误<code>SE(x̄)=σ/√n<\/code>，总体标准差未知时通常以<code>s/√n<\/code>估计。SD表示个体分数的分散，SE表示统计量抽样波动；增加n通常减小SE，却不会因人数变多就让人群本身的SD必然缩小。<\/p><h4>中心极限定理的含义<\/h4><p>在相应条件下，当样本量增大，标准化样本均值的分布趋近正态。它说的是“均值的抽样分布”，不是原始数据自动正态。所需样本量受偏态、厚尾、依赖程度影响，30不是保证一切有效的魔法阈值。若同班学生、重复测量或亲属数据相互依赖，简单σ/√n可能低估不确定性。<\/p><h4>例题<\/h4><p>假设σ=12，n=36时SE=2；n=144时SE=1。想把均值标准误减半，简单独立抽样情形下样本量要增至4倍，而不是2倍。扩大存在系统偏差的便利样本只能使某种偏差估计更“精确”，不能靠人数自动恢复代表性。样本规划也须结合主要假设、效应大小、精度、设计结构与可行性。<\/p>","recall":[{"q":"样本量四倍，SD和SE分别怎样？","a":"在同一总体与独立抽样条件下，个体SD无必然变化，均值SE约减半。"}],"syllabus_topic":4},{"id":"c312-24","title":"参数估计与置信区间：估多少、精度多少","outline":"专题四｜统计原理","level":"运用","keywords":["点估计","区间估计","置信区间","置信水平"],"body_html":"<p><strong>点估计<\/strong>用一个统计量估计总体参数，例如用x̄估计μ；<strong>区间估计<\/strong>用一组按规定程序构造的上下限表达估计不确定性。优良估计量通常关注无偏性、一致性和效率等性质。无偏不表示每个样本都恰好估准。<\/p><p>总体标准差未知、样本独立且正态模型或近似条件适当时，均值的双侧置信区间为<code>x̄ ± t临界(df=n−1)×s/√n<\/code>。总体σ已知并满足正态或相应近似时可用z临界值。置信水平越高，其他条件相同，区间越宽；n越大通常越窄，数据分散越大则越宽。<\/p><h4>例题<\/h4><p>n=25，x̄=50，s=10，SE=2；df=24，95%双侧t临界约2.064，区间为50±4.128，即[45.87,54.13]。含义是：若反复按同样规则抽样并构造区间，约95%的这种区间会覆盖固定的总体均值。已经算出的一个区间不应解释成“固定μ有95%概率落入”，也不是95%的个体分数都在其中。<\/p><p>置信区间只量化相应模型下的抽样不确定性，不能纳入全部测量系统偏差或选择偏差。与同一模型的双侧5%检验对应时，差值95%区间不含0通常与拒绝差为0一致。<\/p>","recall":[{"q":"95%CI是否表示95%的人落在其中？","a":"不是。它估计总体参数的不确定性，个体值的分布范围或预测区间是另一问题。"}],"syllabus_topic":4},{"id":"c312-25","title":"假设检验：原假设、备择假设与p值","outline":"专题四｜统计原理","level":"掌握","keywords":["H₀","H₁","p值","显著性水平","单侧双侧"],"body_html":"<p><strong>原假设H₀<\/strong>规定待检验的总体参数或分布状态，常为无差异/无关联，但也可以是其他明确数值；<strong>备择假设H₁<\/strong>是与H₀相对的参数范围。假设检验在H₀和模型条件下，评估数据与它的相容程度，并按预定规则作统计决策。<\/p><h4>假设检验的六个步骤<\/h4><ol><li>根据问题写H₀和H₁，明确单侧或双侧。<\/li><li>事先确定显著性水平α及主要比较。<\/li><li>按研究设计、变量类型选择检验并检查条件。<\/li><li>计算统计量、自由度与p值或临界值。<\/li><li>按规则拒绝或不拒绝H₀。<\/li><li>报告效应大小、区间、实际含义与限制。<\/li><\/ol><p><strong>p值<\/strong>是在H₀和模型假设成立条件下，得到当前或更极端检验统计量的概率；不是H₀为真的概率，不是结果“纯属偶然”的概率，也不是效应大小。p大只能说证据不足以拒绝，不能证明两组完全相同。<\/p><p>若研究有充分事前依据只关注一个方向，可采用单侧检验；不能看完方向后为变显著改用单侧。软件显示“.000”应写p&lt;.001，而不是p=0。<\/p>","recall":[{"q":"p=.03是否表示原假设成立概率3%？","a":"不是。它是在原假设与模型成立时，当前或更极端统计量的概率为3%。"}],"syllabus_topic":4},{"id":"c312-26","title":"两类错误、检验力与效应量","outline":"专题四｜统计原理","level":"理解","keywords":["第一类错误","第二类错误","检验力","效应量","多重比较"],"body_html":"<p><strong>第一类错误<\/strong>是H₀实际为真却拒绝它，检验程序用α控制这一长期错误率；<strong>第二类错误<\/strong>是某个备择情形为真却未拒绝H₀，概率为β。<strong>检验力<\/strong>为1−β，表示在指定真实效应和条件下检测到该效应的能力。β不是一个脱离具体效应的固定常数。<\/p><p>其他条件相同，增大样本、降低无关误差或提高测量精度通常提高检验力；真实效应越大越容易检出。更严格的α可降低第一类错误，却往往降低检验力。小样本不显著可能因为效应小或估计不精确，也可能没有效应，须看区间，而不是直接宣布“完全没关系”。<\/p><p><strong>效应量<\/strong>回答差异或关系有多大。如标准化均值差d、相关r、方差解释量η²等；p值还强烈受样本量影响，因此统计显著不等于实际重要。解释应结合量尺、基线风险或教育意义，不能只套“小中大”的固定门槛。<\/p><h4>例题<\/h4><p>大样本中两教学法只差0.2分也可能p&lt;.05；小样本中看似差5分却区间很宽。前者须判断实际价值，后者须承认精度不足。反复比较很多结局或所有组对会增加至少一次误报的风险，应预先指定主要假设、适当调整多重比较并区分探索与验证。不能靠不断增加被试、换分析直到显著来维持宣称的α水平。<\/p>","recall":[{"q":"p不显著怎样判断结果价值？","a":"结合效应估计、置信区间、检验力与设计限制，说明数据仍允许哪些重要效应，不能简单判为无效。"}],"syllabus_topic":4},{"id":"c312-27","title":"单样本t检验与z检验：步骤和算例","outline":"专题四｜统计原理","level":"运用","keywords":["单样本t","z检验","总体方差","自由度"],"body_html":"<p>单样本检验比较某总体均值与给定参考值μ₀。总体σ已知且正态或合适近似条件成立时，可用<code>z=(x̄−μ₀)/(σ/√n)<\/code>；总体σ未知时通常用<code>t=(x̄−μ₀)/(s/√n)<\/code>，df=n−1。不能只凭“样本大于30”机械决定必须用z；大样本t会接近z。<\/p><h4>例题：均值是否不同于50<\/h4><ol><li>已知n=25、x̄=54、s=10，先确认个体独立、无严重异常，正态或近似条件合适。<\/li><li>H₀：μ=50；H₁：μ≠50，事先设α=.05双侧。<\/li><li>SE=10/√25=2，t=(54−50)/2=2.00，df=24。<\/li><li>临界值约±2.064，|2.00|不足以进入拒绝域，故不拒绝H₀；双侧p约.057。<\/li><li>均值95%CI为54±2.064×2=[49.87,58.13]，包含50。<\/li><\/ol><p>结论应是“本样本在该检验下尚不足以支持总体均值不同于50”，而不是“两者相等”。参考值必须来源清楚、量尺和群体适当。若与另一个有限样本均值比较，却把它当完全无误差的总体值，会低估不确定性，应考虑两个样本的结构。<\/p><p>若目标是证明差异小到可忽略，通常需要预先定义可忽略界限并用等效性思路；普通不显著t检验不能完成这一任务。检验统计量的分子是样本均值与原假设值之差，分母是均值标准误；自由度和单双侧设定共同决定临界值。<\/p>","recall":[{"q":"样本量很大、总体σ未知，是否一定不能用t？","a":"可以用t；df较大时t分布接近正态。关键是σ是否已知和模型条件，而非机械人数阈值。"}],"syllabus_topic":4},{"id":"c312-28","title":"独立样本与配对样本t：先判断资料关系","outline":"专题四｜统计原理","level":"运用","keywords":["独立t","配对t","Welch","差值","方差齐性"],"body_html":"<p><strong>独立样本t<\/strong>用于两组相互独立单位的均值比较。等方差版本使用合并方差<code>sp²=[(n₁−1)s₁²+(n₂−1)s₂²]/(n₁+n₂−2)<\/code>，<code>t=(x̄₁−x̄₂)/[sp√(1/n₁+1/n₂)]<\/code>，df=n₁+n₂−2。模型要求独立观测、适当正态条件，并对合并版本要求方差齐性。<\/p><p>方差不等时可用<strong>Welch t<\/strong>：分母<code>√(s₁²/n₁+s₂²/n₂)<\/code>，自由度用Welch—Satterthwaite近似。不能在方差不等时直接沿用合并自由度。<\/p><p><strong>配对t<\/strong>用于同一人的两次测量或有意义匹配的两人，先算差值d，再用<code>t=(d̄−0)/(sd/√n)<\/code>，df=n−1，n是配对数。正态要求主要针对差值分布，而不是分别要求前测、后测都完全正态；不同配对之间应独立。<\/p><h4>例题<\/h4><p>5人的前后差值为1、2、3、4、5，则d̄=3、sd=√2.5≈1.581，SE≈.707，t≈4.243，df=4。不是把10个分数当10个独立人。若事先规定双侧α=.05，H₀为总体平均差值等于0，df=4的临界值约为±2.776；|t|≈4.243超过临界值，双侧p约.013，平均差值95%置信区间为3±2.776×.707，即约[1.04,4.96]。在假设条件成立时，有证据支持平均差值大于0；实际改善还是恶化取决于差值的计算方向及量表高分含义。两组前后测的干预题，应直接比较组间变化或适当模型，单看各组前后t结果不够。<\/p>","recall":[{"q":"配对t中的n是前后分数合计数吗？","a":"不是，是独立的配对数；例如20人各测两次，n=20，df=19。"}],"syllabus_topic":4},{"id":"c312-29","title":"方差分析：均值差异如何转成F检验","outline":"专题四｜统计原理","level":"运用","keywords":["ANOVA","F","组间组内","平方和","方差齐性"],"body_html":"<p>方差分析检验两个或更多总体均值是否相等。单因素组间ANOVA的H₀为μ₁=μ₂=…=μk；备择是至少一个均值不同，不是所有组必定两两不同。其思想是把总变异分为处理组之间与组内误差，比较二者相对于自由度的大小。<\/p><p><code>SS总=SS组间+SS组内<\/code>；<code>MS组间=SS组间/(k−1)<\/code>，<code>MS组内=SS组内/(N−k)<\/code>，<code>F=MS组间/MS组内<\/code>。H₀成立且条件满足时，两均方都估计相应误差方差，F通常围绕1附近波动；大的F说明组间差异相对于误差较大。<\/p><h4>例题<\/h4><p>3组共15人，SS组间=120、SS组内=60，则df分别2和12，MS分别60和5，F(2,12)=12。先按F参考分布作总体判断，再根据事前计划或适当事后程序定位差异，同时报告均值、区间和效应量。不能做一串未调整t检验替代总体分析。<\/p><h4>适用条件<\/h4><p>经典组间ANOVA需独立观测、组内误差近似正态、方差齐性，因变量应有合适数量意义。正态不是要求把混在一起的所有原始分数看成一条正态。方差明显不齐可考虑Welch ANOVA及匹配的比较程序；嵌套班级需处理聚类。Tukey、Bonferroni等适用目标不同，不能把LSD当任何大量探索比较都安全的通用办法。<\/p>","recall":[{"q":"ANOVA显著说明哪几组不同？","a":"总体检验只说明并非所有均值相等；具体比较须用预定对比或适当多重比较方法。"}],"syllabus_topic":4}],"topics":[{"number":1,"numeral":"一","title":"心理测量原理","requirements":"掌握\n心理测量的基本概念、心理测量的特征与分类、心理测量的产生与发展、心理测量的误差、信度、效度等概念\n理解\n    项目反应理论与概化理论\n运用\n经典测量理论模型、项目分析的运用"},{"number":2,"numeral":"二","title":"心理测量的实际应用","requirements":"1.掌握\n常用的心理测验，如成就测验、智力测验、能力倾向测验及人格测验等\n2.理解\n心理测验的施测、测验标准的制定\n3.运用\n心理测验的编制技术运用"},{"number":3,"numeral":"三","title":"常用的统计方法","requirements":"1.掌握\n统计图表、集中量数、差异量数、相对量数与相关量数\n2.理解\n相关分析、方差分析、差异检验等分析方法的操作\n3.运用\n综合使用统计分析方法对相关研究进行分析"},{"number":4,"numeral":"四","title":"统计原理","requirements":"1.掌握\n假设检验、参数估计的统计学原理，差异检验及方差分析等的基本原理\n2.理解\n假设检验、参数估计的统计学原理\n3.运用\n统计原理与统计方法的结合"}]},{"code":"412","title":"人格与社会心理学","overview":"本课程分为人格心理学与社会心理学两个专题。人格心理学介绍人格的定义与形成，以及精神分析、特质、生物学、人本主义、行为主义和认知主义六种解释；社会心理学介绍社会化、社会知觉与归因、社会态度、人际关系和社会影响。各单元结合日常生活与学习情境，说明概念之间的区别和心理过程怎样发生。","cards":[{"id":"c412-01","title":"人格的定义、特征与形成因素","outline":"专题一：人格心理学","level":"掌握","keywords":["人格","稳定性","独特性","遗传环境","人格发展"],"body_html":"<p>人格是个体在认知、情绪、动机与行为中表现出来的相对稳定而独特的组织模式，影响其适应环境的方式。理解时抓住整体性、独特性、相对稳定性和情境中的适应性。稳定不是永不改变，独特也不是每项特征都只有一个人拥有。<\/p><h4>相关概念辨析<\/h4><p>气质主要指反应速度、强度、情绪性等动力特点，与生物基础联系较紧；性格更多涉及对现实的态度和习惯行为方式；人格包含这些成分，不能等同道德上的“人品”。某人在课堂沉默，也不能直接证明其在所有情境中都内向。<\/p><h4>形成与发展<\/h4><p>人格受到遗传和神经生理基础、家庭教养与早期经验、同伴与学校、社会文化及个体自我调节的共同影响。因素相互作用：儿童的气质会影响成人回应，成人回应又塑造行为；人也会选择并改变自己的环境。答题可按“生物基础—近端关系—文化教育—个人主动性—交互作用”展开。以成年后参加讨论训练为例，既有倾向仍可能存在，但表达习惯、技能和自我认识可以改变，避免使用“童年决定一生”的绝对说法。<\/p>","recall":[{"q":"人格稳定性与可塑性是否矛盾？","a":"不矛盾。稳定性是相对与概率性的，长期经验、自我调节和情境变化仍可带来发展。"}],"syllabus_topic":1},{"id":"c412-02","title":"精神分析人格观：结构、动力与发展","outline":"专题一：人格心理学","level":"掌握","keywords":["弗洛伊德","心理动力","本我","自我","超我"],"body_html":"<p>精神分析把人格理解为动力系统，强调无意识愿望、内在冲突与早期关系经验。弗洛伊德的本我遵循快乐原则，要求及时满足；自我遵循现实原则，在需要、规范和环境之间调节；超我包含内化的良心与理想。人格表现来自三者相互作用，不能把一个行为孤立地归给某个系统。<\/p><h4>理论如何解释行为<\/h4><p>例如既想休息又担心让他人失望，个体可能体验冲突；自我通过计划安排、现实协商或防御方式调节。古典理论也用性心理阶段、固着和早期经验解释人格发展。新精神分析流派保留动力观点，但进一步突出社会关系、文化、目标和自我功能。<\/p><h4>比较与评价<\/h4><p>相比特质取向重“人有哪些稳定差异”，精神分析更问“这些行为背后有什么动力”；相比行为主义重环境学习，它突出内部冲突。贡献是重视非意识过程与人格整体；局限是经典命题较难检验，对早期经历的回溯解释存在不确定性。作答应先说明该理论的观点，再进行评价，不把所有经典解释都当作已证实事实。人格结构模型也不等于意识、前意识、无意识三个觉察层次。<\/p>","recall":[{"q":"精神分析与特质理论回答的问题如何不同？","a":"精神分析着重解释行为背后的动力和冲突；特质理论着重描述、测量并预测相对稳定的个体差异。"}],"syllabus_topic":1},{"id":"c412-03","title":"防御机制专题：怎样写出有例子的简答题","outline":"专题一：人格心理学","level":"掌握","keywords":["自我防御","压抑","否认","投射","置换","合理化"],"body_html":"<p>防御机制是自我面对威胁性冲突和焦虑时常自动发生的心理调节。作用是暂时减轻痛苦、维持自我，但过度或僵化使用可能妨碍认识现实。不要把它直接等同有意识撒谎，也不能因一个人提出异议就断言其“在防御”。<\/p><h4>常见机制与例子<\/h4><p>否认是难以承认不利事实，例如收到明确的失败结果仍坚称“不可能，事情没有发生”；投射是把自己不愿承认的敌意解释为“别人都针对我”；置换是把对上级的不满转向较安全的家人；合理化是用貌似合理的理由遮蔽难接受的原因，例如竞争失利后只说“那个机会根本不值得”；反向形成是表现出与难接受冲动相反的态度，例如难以接受自己对某人的敌意，反而表现得过分热情；升华是把冲动引向创造、运动等被社会接受的活动。压抑涉及心理内容难进入意识，不能只凭“我不想说”判断。<\/p><h4>答题与应用<\/h4><p>可用“定义与功能—列举机制—每项一个例子—适度与过度的评价”四步。若材料中的人把失误都推给环境，既可能涉及合理化、自利归因，也可能确有客观困难，应核对证据，区分不同概念。真实沟通中可先降低威胁，承认感受，再讨论具体责任和改进，避免贴防御机制标签激化冲突。<\/p>","recall":[{"q":"如何区分合理化与客观说明理由？","a":"合理化具有回避难接受动机或责任的防御功能；客观说明能接受事实核对与替代解释，不能只凭“有理由”判断。"}],"syllabus_topic":1},{"id":"c412-04","title":"荣格与阿德勒：动力人格观的两条发展","outline":"专题一：人格心理学","level":"理解","keywords":["荣格","阿德勒","原型","集体无意识","社会兴趣"],"body_html":"<p>荣格和阿德勒都曾与弗洛伊德有学术联系，后来发展出不同体系。荣格区分个人无意识与集体无意识，用原型说明跨文化象征与经验组织的倾向；人格面具体现社会角色，阴影体现不被自我接受的部分，自性体现整体整合方向。其个体化过程强调人格各方面的整合。<\/p><h4>阿德勒的重点<\/h4><p>阿德勒强调人的整体性、目标及社会关系。自卑感可以推动补偿与成长，过度自卑可能限制行动；生活风格体现个体应对世界的惯常方式；社会兴趣强调合作与关心他人。追求优越不必理解为胜过别人，也可理解为克服不足、完善能力。<\/p><h4>区别、联系与例子<\/h4><p>两者都拓展了经典精神分析，但荣格更侧重象征、集体无意识与整合，阿德勒更侧重社会处境、目的与补偿。对“必须永远表现强大”的人，荣格视角可探索面具与阴影，阿德勒视角可探索不足感、目标及合作方向。两种分析都是理论假设，需要事实支持。原型不能视为每个人遗传的一幅固定图像，出生顺序也不能被当成决定人格的公式。<\/p>","recall":[{"q":"荣格和阿德勒的核心关注各是什么？","a":"荣格关注原型、集体无意识及人格整合；阿德勒关注自卑补偿、目标、生活风格及社会兴趣。"}],"syllabus_topic":1},{"id":"c412-05","title":"特质流派：奥尔波特与卡特尔","outline":"专题一：人格心理学","level":"掌握","keywords":["奥尔波特","卡特尔","首要特质","中心特质","16PF"],"body_html":"<p>特质是使人在一类情境中呈现相对一致倾向的心理特征。特质取向通常用连续维度描述差异，而不是把所有人强行分为少数互不重叠类型；同一人可以在多个维度上有不同程度。<\/p><h4>奥尔波特<\/h4><p>共同特质用于比较同一文化中多个人的相似差异；个人特质体现个体独特的组织。首要特质可能统摄一个人的许多活动，但不是人人都有；中心特质是日常描述一个人时较广泛、突出的若干特点；次要特质只在较窄情境中出现。功能自主强调某些成年动机可获得独立意义，不再完全依赖最初起因。<\/p><h4>卡特尔与应用<\/h4><p>卡特尔区分表面特质和根源特质：表面上共同出现的行为，未必对应同一个根源；他用因素分析探索较基本的人格维度，形成16种人格因素及相关测量工具。对小张的案例，应先列事实，再提出可能的中心特质，并说明在何种情境有优势或困扰。特质可帮助预测倾向，但不能用单次行为定性。评价时可肯定其测量与比较价值，同时说明描述结构不等于完整解释人格形成过程。<\/p>","recall":[{"q":"中心特质与次要特质如何区别？","a":"中心特质在多种情境中较广泛地体现一个人的特点；次要特质较局限、情境性更强。"}],"syllabus_topic":1},{"id":"c412-06","title":"艾森克与生物学取向：PEN、气质与环境","outline":"专题一：人格心理学","level":"掌握","keywords":["艾森克","PEN","外倾性","神经质","精神质","生物学取向"],"body_html":"<p>艾森克用外倾性、神经质和精神质三个较宽维度描述人格，常称PEN模型。外倾性涉及社交、活跃和刺激偏好；神经质涉及负性情绪与情绪反应倾向；精神质是其量表传统中的特定特质维度，涉及冷硬、冲动等倾向，名称不等于已经患有精神病。<\/p><p>其人格层次由低到高为具体反应、习惯反应、特质、类型或超特质：一次课堂发言是具体反应，经常发言形成习惯，多个相关习惯体现特质，相关特质进一步组织为外倾性等较宽维度。<\/p><h4>生物基础的解释<\/h4><p>艾森克尝试用皮质唤醒等机制解释外倾差异，用情绪反应系统解释神经质。生物学取向还包括遗传、气质和奖赏惩罚敏感性研究。格雷的强化敏感性理论关注趋近奖赏、威胁反应和冲突监测等系统；其早期与修订版本定义有差异，不能简单把某系统等同唯一脑区或某一种人格。<\/p><h4>评价与应用<\/h4><p>双生子等研究可估计特定群体和环境中的遗传贡献，但遗传率不是“某个人人格有多少百分比由基因决定”，更不意味着不能改变。实际发展来自生物基础与经验交互。应用时可根据刺激敏感性安排学习环境，而非认定内向者不适合合作。答题用“三维度—层次与生物解释—证据价值—非决定论边界”的结构，区分理论假设与已证实的简单生理公式。<\/p>","recall":[{"q":"艾森克的精神质是否等于精神疾病诊断？","a":"不等于。它是特定人格理论和量表中的连续维度，不能直接作临床诊断。"}],"syllabus_topic":1},{"id":"c412-07","title":"大五人格：五维度与完整案例作答","outline":"专题一：人格心理学","level":"运用","keywords":["大五人格","开放性","尽责性","外倾性","宜人性","神经质"],"body_html":"<p>大五模型用开放性、尽责性、外倾性、宜人性和神经质五个维度描述人格差异。开放性涉及好奇与新经验；尽责性涉及计划、自律和可靠；外倾性涉及社交活跃和积极投入；宜人性涉及合作、体谅与信任；神经质涉及较易体验担忧和负性情绪。它们是程度差异，不是五种固定人群。<\/p><h4>案例分析<\/h4><p>若小张按时完成任务、列计划，可推测较高尽责性；喜欢组织交流可提示较高外倾性；常担忧失误可能提示较高神经质，但要看持续性和情境。积极影响可写可靠、投入或提前发现风险；潜在困扰要与材料联系，如过度追求完美、承担过量任务或担忧消耗注意，而不能把高分一律判为好、低分一律判为坏。<\/p><h4>改进建议与证据边界<\/h4><p>建议必须对准行为：为任务设定完成标准和时间上限，练习拒绝额外任务，检查担忧是否有证据，逐步增加可掌握的社交挑战。答案按“材料证据→人格维度→情境中的优势→可能困难→措施”作答。没有量表及长期资料时应写倾向性推测；大五提供描述框架，不自动说明这些差异为何形成，也不用于直接判断职业资格或心理疾病。<\/p>","recall":[{"q":"大五案例题最容易丢分的地方是什么？","a":"只列维度名称却不结合材料，或把特质高低当道德好坏；应给行为证据、情境后果和具体改进。"}],"syllabus_topic":1},{"id":"c412-08","title":"人本主义人格观：成长潜能与自我一致","outline":"专题一：人格心理学","level":"掌握","keywords":["人本主义","马斯洛","罗杰斯","自我实现","价值条件"],"body_html":"<p>人本主义人格理论重视人的主观世界、整体性、自主选择与成长潜能。马斯洛以需要及自我实现解释动机；罗杰斯关注自我概念、机体经验及二者的一致性。人格健康不能仅理解为没有症状，还涉及开放地体验、认识自己并发展潜能。<\/p><h4>形成机制<\/h4><p>若个体只有达到他人规定的成绩或角色才得到接纳，就可能形成价值条件，否认那些“不符合要求”的真实感受。理想自我与现实自我的差距可用于讨论自我评价，但罗杰斯理论的核心还包括自我概念与实际经验的不一致，不能只记成两种自我之间的距离。<\/p><h4>应用与比较<\/h4><p>帮助学生选择有意义的学习目标、允许表达困难、提供尊重和真实反馈，有助其自主成长。共情、真诚一致和无条件积极关注是重要关系条件，接纳个人并不意味着认可其所有行为。与行为主义相比，人本主义更强调内部体验和自主性；与古典精神分析相比，更突出健康与成长。优点是尊重人、拓展积极研究与助人实践，局限是部分概念不易严格测量，也可能低估环境约束与具体技能训练的重要性。<\/p>","recall":[{"q":"价值条件如何影响人格适应？","a":"个体可能为获得接纳而否认真实经验，使自我概念与体验不一致；支持性关系有助更开放地理解自己。"}],"syllabus_topic":1},{"id":"c412-09","title":"行为与社会学习人格观：人格也会被情境塑造","outline":"专题一：人格心理学","level":"理解","keywords":["行为主义人格","强化史","观察学习","自我调节"],"body_html":"<p>行为主义把许多人格表现看成在特定环境中逐步习得的行为模式。经典条件作用可解释某些情绪反应，操作性条件作用解释后果如何塑造习惯；稳定的环境和强化史也可使行为显得稳定。“他不爱讲话”应进一步问：在什么场景沉默，沉默或表达分别得到什么后果。<\/p><h4>从社会学习到社会认知<\/h4><p>班杜拉强调观察榜样、替代强化、自我效能及自我调节。个人因素、行为与环境交互作用，个体并非只被环境推动：他会选择交往对象、设定标准和改变学习情境。例如公开发言后得到羞辱可能减少表达，而在支持性小组成功讲题，可能增加表达并改变自我效能。<\/p><h4>改变方案与评价<\/h4><p>先把目标写成可观察行为，再识别前因和后果，示范可行做法，逐步练习并反馈。例如把“变自信”改为“每周在小组提一个问题”，比抽象贴标签更易执行。优点是机制可检验、干预可评估；传统行为主义对意义、情感和生物差异解释有限，社会认知理论对此作了扩展。不能说一个人的人格全部由一次奖励或一种榜样决定。<\/p>","recall":[{"q":"从行为取向改进人格相关习惯的第一步是什么？","a":"把抽象目标转为可观察的行为，识别其前因和后果，然后逐步练习、反馈和调整。"}],"syllabus_topic":1},{"id":"c412-10","title":"认知人格观：个人建构、期待与情境模式","outline":"专题一：人格心理学","level":"掌握","keywords":["George Kelly","个人建构","认知图式","米歇尔","控制点"],"body_html":"<p>认知取向强调同一事件会因个人的解释、期待与目标不同而产生不同反应。乔治·凯利（George Kelly）的个人建构理论把人比作主动提出预测、检验理解的“科学家”，用诸如可信—不可信、接纳—拒绝等建构维度组织经验。建构具有个人性，也可以在新经验中调整。<\/p><h4>相关发展<\/h4><p>罗特关注期待、强化价值与控制点：人认为结果主要与自身行动相关，或主要受外部力量控制，会影响其行动选择。米歇尔等强调人格的情境模式，同一人在“如果受到尊重”的情境中合作，在“如果被羞辱”的情境中退缩，仍可能形成稳定的“如果—那么”行为特征。贝克的图式与核心信念视角也说明解释方式怎样影响情绪和行为。<\/p><h4>应用与辨析<\/h4><p>同学没及时回信息，有人解释为忙碌，有人解释为排斥自己；可比较证据、生成替代解释并通过行动检验。认知取向强调能动性与情境，局限是不能只靠思维改变忽略现实资源。必须区分人格理论的George Kelly与社会归因理论的Harold Kelley，中文都常译“凯利”，但理论和研究问题不同。<\/p>","recall":[{"q":"两位“凯利”的理论怎样区分？","a":"George Kelly提出个人建构人格理论；Harold Kelley提出协变归因模型。中文译名相近，不能混写。"}],"syllabus_topic":1},{"id":"c412-11","title":"人格六种取向比较：同一案例的六个问题","outline":"专题一：人格心理学","level":"运用","keywords":["六种人格观点","比较","整合","案例"],"body_html":"<p>人格心理学的六种主要取向是精神分析、特质、生物学、人本主义、行为主义和认知主义。它们分别强调人格的动力、差异结构、生物基础、成长潜能、学习过程与解释方式。<\/p><table><thead><tr><th>取向<\/th><th>解释重点<\/th><th>面对反复回避发言时的分析<\/th><\/tr><\/thead><tbody><tr><td>精神分析<\/td><td>无意识冲突与关系经验<\/td><td>探索评价焦虑背后的冲突<\/td><\/tr><tr><td>特质<\/td><td>稳定个体差异<\/td><td>考察外倾性等长期倾向<\/td><\/tr><tr><td>生物学<\/td><td>气质、遗传与生理反应<\/td><td>了解刺激敏感性和唤醒<\/td><\/tr><tr><td>人本主义<\/td><td>自我、接纳与成长<\/td><td>关注价值条件与自主目标<\/td><\/tr><tr><td>行为主义<\/td><td>学习史与行为后果<\/td><td>分析回避如何被强化<\/td><\/tr><tr><td>认知主义<\/td><td>建构、信念与期待<\/td><td>检验“出错就会被否定”的解释<\/td><\/tr><\/tbody><\/table><h4>六种取向的联系与差异<\/h4><p>精神分析重动力冲突，特质重稳定差异，生物学重遗传与生理机制；人本主义重成长与接纳，行为主义重学习条件，认知主义重信念、期待与主动解释。几种取向既有分歧也有联系：艾森克兼具特质与生物解释，班杜拉连接学习与认知。综合解释可在不同层次互补，但不能随意把互相冲突的命题拼在一起，更不能从一段案例同时确诊六种原因。对同一行为的解释需要结合具体情境和长期表现，形成可以观察与检验的假设。<\/p>","recall":[{"q":"为何艾森克、班杜拉不宜硬塞进完全互斥的分类？","a":"艾森克连接特质结构与生物基础，班杜拉连接学习与认知；流派标签概括重点，并非绝对边界。"}],"syllabus_topic":1},{"id":"c412-12","title":"社会化：内容、途径与贯穿一生的过程","outline":"专题二：社会心理学","level":"掌握","keywords":["社会化","再社会化","社会规范","角色","榜样"],"body_html":"<p>社会化是个体在社会互动中学习语言、规范、价值观和角色行为，形成适应社会生活能力与自我认识的过程。它既包括社会文化的传递，也包含个体主动选择、理解和调整；不只是儿童服从成人的单向过程。<\/p><h4>主要内容与机制<\/h4><p>内容可分为语言和基本生活技能、社会规范与道德、角色及身份、态度价值观和自我调节。家庭、学校、同伴、工作组织与媒体都是重要环境。机制包括指导、强化、观察学习、角色承担和经验反思。初级社会化形成基本能力，成年后进入新职业等需要继续社会化；当原有规范和角色要发生较大改变时，可涉及再社会化。<\/p><h4>例子与理论联系<\/h4><p>新生加入复习小组，观察老生怎样分工、讲解并互评，逐步内化诚信和合作规范，可用观察学习、社会影响与角色学习共同解释。科尔伯格道德发展通常概括为三水平六阶段，不是“三阶段六水平”；埃里克森则强调不同生命时期的心理社会任务。答题按“定义—内容—影响者—机制—毕生性—实例”展开，并指出规范学习与独立判断可以并存。<\/p>","recall":[{"q":"社会化为什么不止发生于儿童期？","a":"人的角色、环境和社会要求会持续变化，进入大学、职业或退休等情境都需要继续学习和调整。"}],"syllabus_topic":2},{"id":"c412-13","title":"自我概念、社会比较与角色","outline":"专题二：社会心理学","level":"理解","keywords":["自我概念","自尊","社会比较","镜中我","角色"],"body_html":"<p>自我概念是个体关于“我是什么样的人”的知识与信念组织；自尊是对自我价值的评价，自我效能是对完成具体任务能力的判断，三者不能混用。自我认识既来自个人经验，也受他人反馈、角色及社会比较影响。<\/p><h4>形成机制<\/h4><p>镜中我强调人会根据自己理解的“他人怎样看我”形成自我评价，注意这未必就是他人真实看法。社会比较在缺少客观标准时尤其常见：向上比较可能提供目标，也可能带来挫败；向下比较可能保护自我评价，但也可能降低改进动力，效果取决于解释和情境。<\/p><h4>角色与应用<\/h4><p>同一个人同时是家长、学生和员工，不同角色期待可能冲突；角色间冲突不同于同一角色收到彼此矛盾的期待。复习时若只和成绩最好的同学比较，容易忽略自身进步，可以同时使用个人前后比较与可达成的任务标准。答题须把“他人反馈→个人解释→自我评价→行为选择”写成过程，并注意个人也会主动选择比较对象、表达身份和调整角色安排。<\/p>","recall":[{"q":"自尊和自我效能感有什么区别？","a":"自尊评价自己的总体价值，自我效能判断自己完成某项具体行动的能力。"}],"syllabus_topic":2},{"id":"c412-14","title":"印象形成：首因、近因、晕轮与信息整合","outline":"专题二：社会心理学","level":"掌握","keywords":["社会知觉","印象形成","首因效应","近因效应","晕轮效应"],"body_html":"<p>社会知觉涉及对自己、他人和人际关系的知觉，印象形成是把有限线索组织为对某个人较整体认识的过程。通常经历选择注意线索、激活类别与经验、解释并整合信息，再随新信息进行修正。外貌、表情、行为、语言和情境都会参与，但观察到的线索不等于真实人格全貌。<\/p><h4>常见效应<\/h4><p>首因效应指较早信息对总体判断影响较大；近因效应指较新信息影响较大，其出现受间隔、注意和任务等条件影响。晕轮或光环效应指某一显著特征的评价扩散到其他并无充分证据的特征，例如由演讲流畅推断其统计分析一定严谨。内隐人格理论则是人们关于各种品质如何相互关联的日常信念。<\/p><h4>实例与改进<\/h4><p>面试者准时、服装整洁，可能使观察者过早推断其所有工作都可靠；需要用多个情境中的行为和明确标准验证。答题写“定义—信息加工过程—两三种偏差—情境例子—校正方法”。校正可分项评价、延迟整体定论、主动寻找反例，并区分事实与推测。不能把首因与近因写成无条件、同时都占最大影响的固定规律。<\/p>","recall":[{"q":"晕轮效应怎样举例才准确？","a":"从一个显著优点或缺点推断其他缺乏证据的特征，例如由外表整洁推断研究一定严谨。"}],"syllabus_topic":2},{"id":"c412-15","title":"刻板印象、偏见与歧视：认知不等于事实","outline":"专题二：社会心理学","level":"掌握","keywords":["刻板印象","偏见","歧视","群体分类","接触"],"body_html":"<p>刻板印象是对某类群体成员形成的概括化信念，常忽略群体内部差异，并被机械套用到个人。偏见偏重基于群体身份的评价和情感，歧视偏重实际差别对待的行为；三者有关联，但不完全等同。<\/p><h4>形成与维持<\/h4><p>社会分类帮助简化复杂信息，但可能放大群体间差异、忽略群体内多样性。选择性注意与记忆、验证原有信念、社会传播和角色分工都可能维持刻板印象；对反例也可能说“他只是例外”，从而不更新原有看法。正面刻板印象同样可能给个体压力或造成误判。<\/p><h4>应用与作答<\/h4><p>若认为“某年龄的同学学不会技术”，便不给其练习机会，就可能把群体标签转为不平等对待。减少偏差可增加具体个人信息，以相同标准评价；在适当条件下开展地位平等、有共同目标、合作并获制度支持的群体接触。简答题写定义、简化性与稳定性等特点、影响和纠正方法；注意不是有任何分类就必然是偏见，也不能用“人人都这样”代替事实依据。<\/p>","recall":[{"q":"刻板印象、偏见、歧视分别侧重什么？","a":"刻板印象侧重群体认知，偏见侧重评价与情感，歧视侧重差别对待行为。"}],"syllabus_topic":2},{"id":"c412-16","title":"归因基础与凯利三度理论：如何用证据判断原因","outline":"专题二：社会心理学","level":"掌握","keywords":["海德","Harold Kelley","协变","共同性","区别性","一致性"],"body_html":"<p>归因是人们解释自己或他人行为及结果原因的过程。海德区分个人内部原因与环境外部原因；哈罗德·凯利（Harold Kelley）
